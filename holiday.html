<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอหยุด/ลา</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script>
</head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>ขอหยุด/ลา</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></header>
<p id="cnt" class="card stat">กำลังโหลด…</p>
<div id="form" hidden>
  <label class="field" for="type">ประเภท</label>
  <select id="type"><option value="off">หยุดประจำสัปดาห์</option><option value="sick">ลาป่วย</option><option value="personal">ลากิจ</option><option value="special">พิเศษ/อื่นๆ</option></select>
  <label class="field" for="date">วันที่</label>
  <input id="date" type="date">
  <label class="field" for="note">เหตุผล</label>
  <textarea id="note" rows="3" placeholder="เล่าสั้นๆ (ไม่บังคับ)"></textarea>
  <button id="send" class="btn primary">ส่งคำขอ</button>
  <p id="msg" class="muted"></p>
</div>
<h2>เดือนนี้</h2>
<div id="list" class="card list"></div>
<script>
(async () => {
  const TYPE = { off: "หยุดประจำสัปดาห์", sick: "ลาป่วย", personal: "ลากิจ", special: "พิเศษ/อื่นๆ" };
  const ST = { pending: "รออนุมัติ", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิก" };
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
  const plus = (n) => { const d = new Date(today + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const ddmm = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}`;
  try {
    const { supabase, me } = await App.ready();
    const setMin = () => { date.min = type.value === "sick" ? today : plus(1); date.max = plus(30); if (!date.value || date.value < date.min) date.value = date.min; };
    type.onchange = setMin; setMin();
    const canCancel = (r) => r.user_id === me.userId && (r.status === "pending" || r.status === "approved") && r.date >= today;
    list.onclick = async (ev) => {
      const b = ev.target.closest("button[data-cancel]"); if (!b) return;
      if (!confirm(`ยกเลิกคำขอวันที่ ${b.dataset.d}?`)) return;
      b.disabled = true;
      const { error } = await supabase.rpc("cancel_leave", { p_id: b.dataset.cancel });
      msg.textContent = error ? "ยกเลิกไม่สำเร็จ: " + error.message : `ยกเลิกคำขอวันที่ ${b.dataset.d} แล้ว`;
      msg.className = error ? "err" : "ok";
      await load();
    };
    async function load() {
      const { data: c } = await supabase.rpc("leave_counters");
      cnt.textContent = `เดือนนี้หยุดแล้ว ${c?.month_days ?? 0} วัน · สัปดาห์นี้ใช้โควตา ${c?.week_used ?? 0}/1`;
      const { data, error } = await supabase.from("leave_requests").select("id, user_id, date, type, status, users(name)")
        .gte("date", today.slice(0, 8) + "01").lte("date", plus(31)).order("date");
      if (error) { list.innerHTML = `<p class="err">โหลดไม่ได้: ${error.message}</p>`; return; }
      const rows = data; // this month + upcoming (≤ 30 days)
      list.innerHTML = rows.length ? rows.map((r) => `<div class="row" style="flex-wrap:wrap;row-gap:8px"><b class="grow"><span class="num">${ddmm(r.date)}</span> · ${TYPE[r.type] || r.type}${me.role === "owner" && r.users ? " · " + r.users.name : ""}</b><span class="pill" data-tone="${{ pending: "wait", approved: "ok", rejected: "bad" }[r.status] || ""}">${ST[r.status] || r.status}</span>${canCancel(r) ? `<span style="flex-basis:100%;height:0"></span><button class="btn sm" style="margin:0 0 0 auto" data-cancel="${r.id}" data-d="${ddmm(r.date)}">ยกเลิกคำขอ</button>` : ""}</div>`).join("")
        : `<p class="muted">ยังไม่มีคำขอ</p>`;
    }
    send.onclick = async () => {
      if (!date.value) { msg.textContent = "เลือกวันก่อน"; msg.className = "err"; return; }
      send.disabled = true; msg.textContent = "กำลังส่ง…"; msg.className = "muted";
      const { data, error } = await supabase.rpc("request_leave", { d: date.value, p_type: type.value, note: note.value.trim() || null });
      if (error) { msg.textContent = "ส่งไม่สำเร็จ: " + error.message; msg.className = "err"; send.disabled = false; return; }
      const n = await App.fn("leave-notify", { leave_id: data.id }).catch(() => null);
      msg.textContent = data.status === "approved" ? "อนุมัติแล้ว (โควตาประจำสัปดาห์)" : "ส่งคำขอแล้ว รอเจ้าของอนุมัติในกลุ่ม";
      if (!n || !n.ok) msg.textContent += "\nแจ้งเตือน LINE ไม่สำเร็จ บอกเจ้าของเองด้วย";
      msg.className = "ok"; msg.style.whiteSpace = "pre-line"; note.value = ""; send.disabled = false;
      await load();
    };
    form.hidden = false;
    await load();
  } catch (e) { if (e.message !== "denied") cnt.textContent = "โหลดไม่ได้: " + e.message; }
})();
</script></body></html>
