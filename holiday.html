<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอหยุด/ลา</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<link rel="stylesheet" href="lib/ux-owner.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/skeleton.js"></script><script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/ux-owner.js"></script>
<script src="lib/ux-staff.js"></script><script src="lib/ux-motion.js"></script>
</head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>ขอหยุด/ลา</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></header>
<p id="cnt" class="card stat"><span class="vh">กำลังเปิด…</span><i class="sk-b" style="--w:56%;--h:18px;margin:4px 0"></i><i class="sk-b" style="--w:72%;--h:14px;margin:10px 0 5px"></i></p>
<div class="sk"><span class="vh">กำลังเปิด…</span><div class="field" style="display:flow-root"><i class="sk-b" style="--w:18%;--h:14px;margin:5px 0 4px"></i></div><i class="sk-b" style="--w:100%;--h:52px;--r:12px;--gap:0px"></i><div class="field" style="display:flow-root"><i class="sk-b" style="--w:16%;--h:14px;margin:5px 0 4px"></i></div><i class="sk-b" style="--w:100%;--h:52px;--r:12px;--gap:0px"></i><i class="sk-b" style="--w:62%;--h:14px;margin:10px 0 0"></i><i class="sk-b" style="--w:48%;--h:14px;margin:6px 0 0"></i><div class="field" style="display:flow-root"><i class="sk-b" style="--w:30%;--h:14px;margin:5px 0 4px"></i></div><i class="sk-b" style="--w:100%;--h:96px;--r:12px;--gap:0px"></i><i class="sk-b" style="--w:100%;--h:52px;--r:14px;margin:12px 0"></i></div>
<div id="own" class="ld" hidden></div>
<div id="form" class="ld" hidden>
  <label class="field" for="type">ขออะไร</label>
  <select id="type"><option value="off">หยุดประจำสัปดาห์</option><option value="sick">ลาป่วย</option><option value="personal">ลากิจ</option><option value="special">หยุดพิเศษ</option></select>
  <label class="field" for="date">วันไหน</label>
  <input id="date" type="date">
  <p class="muted">ลาป่วยเลือกวันนี้ได้<br>อย่างอื่นขอล่วงหน้า 1 วัน</p>
  <label class="field" for="note">เหตุผล (ไม่ใส่ก็ได้)</label>
  <textarea id="note" rows="3" placeholder="เช่น ไปหาหมอ"></textarea>
  <button id="send" class="btn primary">ส่งคำขอหยุด/ลา</button>
  <p id="msg" class="muted"></p>
</div>
<h2 id="listh" class="sh">วันที่ขอไว้</h2>
<div id="list" class="card list"><div class="row"><span class="grow"><i class="sk-b" style="--w:58%;--h:17px"></i></span><i class="sk-b" style="--w:72px;--h:24px;--r:999px"></i></div><div class="row"><span class="grow"><i class="sk-b" style="--w:58%;--h:17px"></i></span><i class="sk-b" style="--w:72px;--h:24px;--r:999px"></i></div></div>
<script>
(async () => {
  const TYPE = { off: "หยุดประจำสัปดาห์", sick: "ลาป่วย", personal: "ลากิจ", special: "หยุดพิเศษ" };
  const ST = { pending: "รออนุมัติ", approved: "อนุมัติแล้ว", rejected: "ไม่อนุมัติ", cancelled: "ยกเลิกแล้ว" };
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
  const plus = (n) => { const d = new Date(today + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const thd = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "UTC" });
  try {
    const { supabase, me } = await App.ready();
    if (me.role === "owner" || me.role === "manager") return HolidayOwner(supabase); // P2-7: owner (round 6: or manager) approves + month calendar, no request form
    UXM.dateTh(date); // Mos 26 ต.ค.: Thai day over the native picker
    const setMin = () => { date.min = type.value === "sick" ? today : plus(1); date.max = plus(30); if (!date.value || date.value < date.min) date.value = date.min; };
    type.onchange = setMin; setMin();
    const canCancel = (r) => r.user_id === me.userId && (r.status === "pending" || r.status === "approved") && r.date >= today;
    list.onclick = async (ev) => {
      const b = ev.target.closest("button[data-cancel]"); if (!b) return;
      // ง1: no confirm · the row shows ยกเลิกแล้ว now, cancel_leave runs after 5 s unless "เลิกทำ"
      const row = b.closest(".row"), pill = row.querySelector(".pill");
      b.hidden = true; pill.dataset.tone = ""; pill.textContent = ST.cancelled; msg.textContent = ""; msg.className = "muted";
      UXM.later(`ยกเลิกวันที่ ${b.dataset.d} แล้ว`, async () => {
        const { error } = await supabase.rpc("cancel_leave", { p_id: b.dataset.cancel });
        if (error) UXM.toast("ยกเลิกไม่ได้\n" + App.errText(error), { ms: 4000 });
        await load();
      }, load);
    };
    async function load() {
      const { data: c, error: cErr } = await supabase.rpc("leave_counters");
      cnt.innerHTML = cErr ? `<span class="err">นับวันหยุดไม่ขึ้น ลองเปิดหน้าใหม่</span>` : `เดือนนี้หยุดไปแล้ว <b class="num">${+(c?.month_days ?? 0)} วัน</b><br><span class="muted">หยุดประจำสัปดาห์นี้ ใช้แล้ว ${+(c?.week_used ?? 0)} จาก 1 วัน</span>`;
      const { data, error } = await supabase.from("leave_requests").select("id, user_id, date, type, status, users(name)")
        .gte("date", today.slice(0, 8) + "01").lte("date", plus(31)).order("date");
      if (error) { list.innerHTML = `<p class="err">เปิดไม่ขึ้น: ${App.errText(error)}</p>`; return; }
      const rows = data; // this month + upcoming (≤ 30 days)
      list.innerHTML = rows.length ? rows.map((r) => `<div class="row" style="flex-wrap:wrap;row-gap:8px"><b class="grow"><span class="num">${thd(r.date)}</span> ${TYPE[r.type] || r.type}${me.role === "owner" && r.users ? " " + r.users.name : ""}</b><span class="pill" data-tone="${{ pending: "wait", approved: "ok", rejected: "bad" }[r.status] || ""}">${ST[r.status] || r.status}</span>${canCancel(r) ? `<span style="flex-basis:100%;height:0"></span><button class="btn sm" style="margin:0 0 0 auto" data-cancel="${r.id}" data-d="${thd(r.date)}">ยกเลิกคำขอ</button>` : ""}</div>`).join("")
        : `<div class="empty tight"><img class="mascot sm" src="img/mascot-240.png" alt="" width="56" height="56"><p>ยังไม่มีใครขอหยุด</p><p class="muted">ขอหยุดหรือลาแล้ว จะขึ้นที่นี่</p></div>`;
    }
    send.onclick = async () => {
      if (!date.value) { msg.textContent = "เลือกวันก่อน"; msg.className = "err"; UXM.shake(date); return; }
      send.disabled = true; msg.textContent = "กำลังส่ง…"; msg.className = "muted";
      const { data, error } = await supabase.rpc("request_leave", { d: date.value, p_type: type.value, note: note.value.trim() || null });
      if (error) { msg.textContent = "ส่งไม่ได้\n" + App.errText(error); msg.className = "err"; send.disabled = false; return; }
      const n = await App.fn("leave-notify", { leave_id: data.id }).catch(() => null);
      UXM.toast(data.status === "approved" ? "หยุดได้เลย ✓" : "ส่งแล้ว รอเจ้าของอนุมัติ ✓"); // ก4: success = toast · the row below shows the status
      msg.textContent = !n || !n.ok ? "LINE แจ้งเจ้าของไม่ได้\nช่วยบอกเจ้าของเองด้วย" : ""; msg.className = msg.textContent ? "err" : "muted";
      note.value = ""; send.disabled = false;
      // ux(staff): done state → next task · staff only (owner view is another stream's)
      if (me.role !== "owner" && !document.querySelector(".ux-next")) await UXS.showNext(supabase, msg, false, "afterend");
      await load();
    };
    form.hidden = false;
    await load();
  } catch (e) { if (e.message !== "denied") cnt.textContent = "เปิดไม่ขึ้น: " + App.errText(e); }
})();
</script></body></html>
