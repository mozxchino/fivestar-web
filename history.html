<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประวัติ</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script>
</head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>ประวัติ</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3 · 30 วันล่าสุด</div></div></header>
<p id="msg" class="muted">กำลังโหลด…</p>
<div id="list"></div>
<script>
(async () => {
  try {
    const { supabase } = await App.ready();
    const { data, error } = await supabase.from("shop_days").select("*").order("date", { ascending: false }).limit(30);
    if (error) throw error;
    const ST = { open: "เปิดอยู่", closed: "ปิดแล้ว", sent: "ส่งแล้ว", holiday: "วันหยุด", backfill: "ข้อมูลย้อนหลัง" };
    const hm = (t) => t ? new Date(t).toLocaleTimeString("th-TH", { timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit", hour12: false }) : "-";
    document.getElementById("msg").hidden = !!data.length;
    if (!data.length) document.getElementById("msg").textContent = "ยังไม่มีประวัติ";
    document.getElementById("list").innerHTML = data.map((d) => {
      const diff = d.cash_counted != null && d.cash_expected != null ? d.cash_counted - d.cash_expected : null;
      const cash = diff == null ? "-" : `<span class="${diff < 0 ? "err" : ""}">${diff > 0 ? "+" : ""}${diff}</span>`;
      return `<div class="card day"><div class="day-head"><b class="date num">${d.date.slice(8)}/${d.date.slice(5, 7)}</b><span class="pill" data-tone="${{ open: "wait", closed: "ok", sent: "ok" }[d.status] || ""}">${ST[d.status] || d.status}</span></div>
        <div class="kv"><span>เปิด <b class="num">${hm(d.opened_at)}</b></span><span>ปิด <b class="num">${hm(d.closed_at)}</b></span></div>
        <div class="kv"><span>OT <b class="num">${d.ot_hours ?? 0}</b> ชม.</span><span>เงินสดต่าง <b class="num">${cash}</b></span></div></div>`;
    }).join("");
  } catch (e) { if (e.message !== "denied") document.getElementById("msg").textContent = "โหลดไม่ได้: " + e.message; }
})();
</script></body></html>
