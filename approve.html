<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อนุมัติใบสั่ง</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css"><link rel="stylesheet" href="lib/ux-data.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/ux-motion.js"></script>
<style>
#items{margin-top:0}
#pill{flex:none;align-self:center;font-size:15px;padding:6px 12px 6px 10px}
#self{display:contents}
body:has(#repeat:not([hidden])) .sk{display:none}
pre{white-space:pre-wrap;font:15px/1.6 var(--font-body);margin:0;font-variant-numeric:tabular-nums}
</style></head><body class="grouped" ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>อนุมัติใบสั่ง</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div><div class="sk"><i class="sk-b" style="--w:150px;--h:12px;margin:3px 0"></i></div><div id="when" class="ld" hidden><div class="sub">ของมา <span id="d"></span></div><div class="sub">ถ้าไม่กด แอปส่งตอน <span id="cd"></span></div></div></div></header>
<p id="blocked" class="err" hidden></p>
<div class="sk"><span class="vh">กำลังเปิด…</span><div class="chips sk-row"><i class="sk-b" style="--w:72px;--h:34px;--r:999px"></i><i class="sk-b" style="--w:160px;--h:44px;--r:999px"></i></div><div class="card list" style="margin-top:0"><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div></div><div class="sticky"><i class="sk-b" style="--w:100%;--h:52px;--r:14px"></i></div></div>
<div id="repeat" class="ld" hidden>
  <div class="empty"><p>ยังไม่มีใบสั่งพรุ่งนี้</p><p class="muted">พนักงานยังไม่กดปิดร้าน</p></div>
  <button id="rep" class="btn primary">สั่งเหมือนครั้งก่อน</button>
  <button id="skip" class="btn">ไม่สั่งของพรุ่งนี้</button>
</div>
<div id="form" class="ld" hidden>
  <div class="chips"><span id="pill" class="pill"></span><span id="self" hidden></span></div>
  <div id="items" class="card list"></div>
  <details class="fold"><summary>ข้อความที่เซลล์จะเห็น<span class="chip">เปิดดู</span></summary>
    <div class="card preview"><pre id="prev"></pre></div></details>
  <div class="sticky"><p id="chg" class="ux-chg" aria-live="polite"></p><button id="send" class="btn primary">ส่งใบสั่งให้เซลล์</button>
    <p id="msg" class="muted"></p><button id="copy" class="btn" hidden>คัดลอกไปส่งเอง</button></div>
</div>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const E = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const show = (id, t) => { $(id).hidden = false; if (t) $(id).textContent = t; };
  const { supabase, me } = await App.ready();
  if (me.role !== "owner") return show("blocked", "หน้านี้สำหรับเจ้าของ");
  const bkk = (add = 0) => { const d = new Date(Date.now() + 7 * 3600e3 + add * 864e5); return d.toISOString().slice(0, 10); };
  const tomorrow = bkk(1), q = new URLSearchParams(location.search);
  const ST = { proposed: "รอส่ง", approved: "รอส่ง", sent: "ส่งแล้ว", failed: "ส่งไม่ออก" };
  let orderId = q.get("order"), order = null, rows = [], step = {}, shop = "", autoAt = "21:00";

  async function findOrder() {
    let r = supabase.from("orders").select("id,status,for_date,sent_at");
    r = orderId ? r.eq("id", orderId) : r.eq("for_date", tomorrow).in("status", ["proposed", "approved", "failed", "sent"]).order("created_at", { ascending: false });
    return (await r.limit(1).maybeSingle()).data;
  }
  order = await findOrder();
  if (!order) {
    if (q.get("repeat") !== "1") return show("blocked", "ยังไม่มีใบสั่งพรุ่งนี้\nรอพนักงานกดปิดร้านก่อน");
    show("repeat");
    $("skip").onclick = () => { $("repeat").innerHTML = "<p>พรุ่งนี้ไม่สั่งของ</p>"; };
    $("rep").onclick = async () => {
      $("rep").disabled = true;
      try {
        const { data: prev } = await supabase.from("orders").select("id").eq("status", "sent").lte("for_date", bkk()).order("for_date", { ascending: false }).limit(1).maybeSingle();
        if (!prev) throw new Error("ยังไม่เคยส่งใบสั่ง ไม่มีครั้งก่อนให้ใช้");
        const { data: old } = await supabase.from("order_items").select("product_id,qty_final,qty_proposed").eq("order_id", prev.id);
        const { data: nid, error } = await supabase.rpc("propose_order", { for_date: tomorrow });
        if (error || !nid) throw error || new Error("ทำใบสั่งไม่ได้ (พรุ่งนี้ร้านหยุดหรือเปล่า)");
        await supabase.from("order_items").delete().eq("order_id", nid);
        const { error: e2 } = await supabase.from("order_items").insert(old.map((o) => ({ order_id: nid, product_id: o.product_id, qty_proposed: o.qty_final ?? o.qty_proposed, qty_final: o.qty_final ?? o.qty_proposed })));
        if (e2) throw e2;
        location.replace("approve.html?order=" + nid);
      } catch (e) { $("rep").disabled = false; $("rep").insertAdjacentHTML("afterend", `<p class="err">${App.errText(e)}</p>`); }
    };
    return;
  }
  orderId = order.id;
  const { data: st } = await supabase.from("settings").select("key,value").in("key", ["shop_name", "auto_send_at"]);
  for (const s of st || []) { if (s.key === "shop_name") shop = s.value; else autoAt = s.value; }
  // order_review = order_display + เหลือ (latest closed sheet) · ควรมี · proposed qty · pack size
  const { data: disp, error: dErr } = await supabase.rpc("order_review", { oid: orderId });
  if (dErr) throw dErr;
  rows = (disp || []).sort((a, b) => a.sort - b.sort);
  step = Object.fromEntries(rows.map((r) => [r.product_id, r.pack_size || 1]));
  const { data: sb } = await supabase.from("self_buy_today").select("name,status");
  if (sb && sb.length) { $("self").hidden = false; $("self").innerHTML = `<span class="lbl">ต้องซื้อเอง</span>` + sb.map((s) => `<span class="chip ${s.status === "out" ? "bad" : "wait"}">${E(s.name)} ${s.status === "out" ? "หมด" : "ใกล้หมด"}</span>`).join(""); }
  $("d").textContent = new Date(order.for_date + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  $("pill").textContent = ST[order.status] || order.status; $("pill").dataset.tone = { sent: "ok", failed: "bad" }[order.status] || "wait";
  const n = (v) => Number(v).toLocaleString("th-TH", { maximumFractionDigits: 1 });
  const base = (r) => r.kind === "consumable" ? "ของใช้ในร้าน" : `เหลือ ${r.remaining == null ? "-" : n(r.remaining)} · ควรมี ${r.par == null ? "-" : n(r.par)}`;
  const meta = (r, q) => `${base(r)} ${E(r.unit_th)}` + (r.sets != null ? ` (${Math.round(q / r.pack_size)} เซ็ต)` : "") + (q !== Number(r.qty_proposed) ? `<br><b>แก้จาก ${n(r.qty_proposed)}</b>` : "");
  const rowH = (r, i) => `<div class="orow" id="r${i}"><div class="grow"><div class="nm">${E(r.label)}</div><div class="meta"></div></div>
    <div class="step"><button type="button" data-d="-1" data-s="${i}" aria-label="ลด ${E(r.label)}">−</button><input type="number" inputmode="decimal" min="0" step="${step[r.product_id]}" value="${Number(r.qty)}" data-i="${i}" aria-label="${E(r.label)} จำนวนสั่ง (${E(r.unit_th)})"><button type="button" data-d="1" data-s="${i}" aria-label="เพิ่ม ${E(r.label)}">+</button></div></div>`;
  // round 4: rows still at the proposal AND not low (เหลือ ≥ ควรมี) fold into one line · edited / low / no stock figure stay open on top
  // ponytail: only the layout changes · every row keeps its input (data-i), cur() still walks rows in order → the same send payload
  const same = (r) => Number(r.qty) === Number(r.qty_proposed) && r.remaining != null && r.par != null && Number(r.remaining) >= Number(r.par);
  const top = rows.map((r, i) => same(r) ? "" : rowH(r, i)).join(""), fold = rows.map((r, i) => same(r) ? rowH(r, i) : "").join(""), nSame = rows.filter(same).length;
  $("items").innerHTML = (top + (nSame ? `<details class="fold ux-same" id="same"><summary><span><b>ส่งตามที่ระบบเสนอ ${nSame} รายการ</b><small>ของยังพอ ไม่ได้แก้จำนวน</small></span><span class="chip"><span class="o">ดู ${nSame} รายการ</span><span class="c">ซ่อน</span></span></summary>${fold}</details>` : "")) || '<p class="muted">ใบนี้ไม่มีของต้องสั่ง</p>';
  const qv = (i) => Math.max(0, Number(document.querySelector(`[data-i="${i}"]`).value) || 0);
  const cur = () => rows.map((r, i) => ({ product_id: r.product_id, qty_final: qv(i), r }));
  // ง3: how far the owner moved from what the system proposed (order_review qty_proposed)
  const label = () => { const e = rows.filter((r, i) => qv(i) !== Number(r.qty_proposed)).length; $("chg").textContent = e ? `แก้จากที่ระบบเสนอ ${e} รายการ` : "ตามที่ระบบเสนอ";
    const k = cur().filter((x) => x.qty_final > 0).length; $("send").disabled = k === 0; $("send").textContent = k === 0 ? "ไม่มีของที่จะสั่ง" : `ส่งใบสั่งให้เซลล์${order.status === "sent" ? "อีกครั้ง" : ""} ${k} รายการ`; };
  const mark = (i) => { const q = qv(i), r = rows[i], row = $("r" + i); row.classList.toggle("chg", q !== Number(r.qty_proposed)); row.querySelector(".meta").innerHTML = meta(r, q); };
  rows.forEach((_, i) => mark(i));
  $("items").onclick = (ev) => {
    const b = ev.target.closest("button[data-d]"); if (!b) return;
    const i = +b.dataset.s, s = step[rows[i].product_id], inp = document.querySelector(`[data-i="${i}"]`);
    const was = qv(i); inp.value = Math.max(0, Math.round((was + s * +b.dataset.d) / s) * s);
    UXM.roll(inp, Math.sign(qv(i) - was)); inp.dispatchEvent(new Event("input", { bubbles: true })); // ก3: the number slides, never jumps
  };
  const text = (head) => { const d = order.for_date.slice(8) + "/" + order.for_date.slice(5, 7); return `${head} ${d} ${shop}\n` + cur().filter((x) => x.qty_final > 0).map(({ r, qty_final: n }) => `${r.order_as ? r.label.replace(/^เซ็ต/, "") : r.label} ${n} ${r.unit_th}` + (r.sets != null ? ` (${Math.round(n / step[r.product_id])} เซ็ต)` : "")).join("\n"); };
  const prev = () => { $("prev").textContent = text(order.sent_at ? "แก้ไขใบสั่ง" : "สั่งของ"); };
  $("items").oninput = (ev) => { if (ev.target.dataset.i !== undefined) mark(+ev.target.dataset.i); prev(); label(); }; prev(); label();
  const tick = () => { const [h, m] = String(autoAt).split(":").map(Number); const t = new Date(Date.now() + 7 * 3600e3); let s = (h * 60 + m) * 60 - (t.getUTCHours() * 3600 + t.getUTCMinutes() * 60 + t.getUTCSeconds()); if (s < 0) s += 86400; $("cd").textContent = `${autoAt} น. (อีก ${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")} ชม.)`; };
  tick(); setInterval(tick, 30000);
  show("form"); show("when"); document.querySelector(".topbar .sub").hidden = true;
  $("send").onclick = async () => {
    $("send").disabled = true; $("copy").hidden = true; $("msg").className = "muted"; $("msg").textContent = "กำลังส่ง…";
    try {
      const r = await App.fn("send-order", { order_id: orderId, mode: "manual", items: cur().map(({ product_id, qty_final }) => ({ product_id, qty_final })) });
      if (r.ok) { $("msg").className = "muted"; $("msg").textContent = ""; UXM.toast("ส่งใบสั่งให้เซลล์แล้ว ✓"); $("pill").textContent = "ส่งแล้ว"; $("pill").dataset.tone = "ok"; order.status = "sent"; order.sent_at = order.sent_at || new Date().toISOString(); prev(); label(); }
      else { $("msg").className = "err"; $("msg").textContent = "ส่งไม่ออก\nกดคัดลอก แล้วไปวางในกลุ่มสั่งของเอง"; $("pill").textContent = "ส่งไม่ออก"; $("pill").dataset.tone = "bad"; $("copy").hidden = false; $("copy").onclick = async () => { await navigator.clipboard.writeText(r.message || text("สั่งของ")); $("copy").textContent = "คัดลอกแล้ว"; }; }
    } catch (e) { $("msg").className = "err"; $("msg").textContent = "ส่งไม่ออก ลองกดอีกครั้ง\n" + App.errText(e); }
    label();
  };
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
