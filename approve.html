pre{white-space:pre-wrap;font:15px/1.6 var(--font-body);margin:0;font-variant-numeric:tabular-nums}
/* 0033 ×2 lot: red strip (lasts until) */
.ux-lot{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;padding:10px 14px;border-radius:14px;background:var(--tint-destructive);color:var(--color-destructive);box-shadow:inset 3px 0 0 var(--color-destructive)}
.ux-lot b{font:600 16px/1.35 var(--font-head);text-wrap:balance;font-variant-numeric:tabular-nums}.ux-lot span{font-size:14px;color:var(--color-ink-soft)}
.ux-nopack{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:var(--tint-wait);color:var(--on-wait);font-size:14px;line-height:1.5;text-wrap:pretty}.ux-nopack a{color:inherit;font-weight:600}
.ux-2l{display:flex;flex-direction:column}.ux-2l b{color:var(--color-foreground);font-weight:600;font-variant-numeric:tabular-nums}
</style></head><body class="grouped" ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1 id="ttl">อนุมัติใบสั่ง</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div><div class="sk"><i class="sk-b" style="--w:150px;--h:12px;margin:3px 0"></i></div><div id="when" class="ld" hidden><div class="sub ux-2l"><span>สั่ง <span id="sd"></span></span><b>ของถึง <span id="d"></span></b></div><div class="sub" id="cdl">ถ้าไม่กด แอปส่งตอน <span id="cd"></span></div></div></div></header>
<p id="blocked" class="err" hidden></p>
<div class="sk"><span class="vh">กำลังเปิด…</span><div class="chips sk-row"><i class="sk-b" style="--w:72px;--h:34px;--r:999px"></i><i class="sk-b" style="--w:160px;--h:44px;--r:999px"></i></div><div class="card list" style="margin-top:0"><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div><div class="orow"><div class="grow"><i class="sk-b" style="--w:62%;--h:17px"></i><i class="sk-b" style="--w:78%;--h:12px;--gap:7px"></i></div><div class="sk-row" style="gap:4px"><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i><i class="sk-b" style="--w:60px;--h:52px;--r:12px"></i><i class="sk-b" style="--w:44px;--h:48px;--r:12px"></i></div></div></div><div class="sticky"><i class="sk-b" style="--w:100%;--h:52px;--r:14px"></i></div></div>
<div id="repeat" class="ld" hidden>
  <div class="empty"><p>ยังไม่มีใบสั่ง CPF คืนนี้</p><p class="muted">พนักงานยังไม่กดปิดร้าน</p></div>
  <button id="rep" class="btn primary">สั่งเหมือนครั้งก่อน</button>
  <button id="skip" class="btn">คืนนี้ไม่สั่ง</button>
</div>
<div id="none" class="ld empty" hidden></div>
<div id="form" class="ld" hidden>
  <div class="chips"><span id="pill" class="pill"></span><span id="self" hidden></span></div>
  <div id="lot"></div>
  <p id="nopack" class="ux-nopack" role="note" hidden></p>
  <div id="items"></div>
  <div id="buy"></div>
  <details class="fold"><summary>ข้อความที่เซลล์จะเห็น<span class="chip">เปิดดู</span></summary>
    <div class="card preview"><pre id="prev"></pre></div></details>
  <div class="sticky"><p id="chg" class="ux-chg" aria-live="polite"></p><button id="send" class="btn primary">ส่งใบสั่งให้เซลล์</button>
    <p id="msg" class="muted"></p><button id="copy" class="btn" hidden>คัดลอกไปส่งเอง</button></div>
</div>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const E = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const show = (id, t) => { $(id).hidden = false; if (t) $(id).textContent = t; };
  const { supabase, me } = await App.ready();
  if (me.role !== "owner" && me.role !== "manager") return show("blocked", "หน้านี้สำหรับเจ้าของและผู้จัดการ");
  const bkk = (add = 0) => { const d = new Date(Date.now() + 7 * 3600e3 + add * 864e5); return d.toISOString().slice(0, 10); };
  const today = bkk(), q = new URLSearchParams(location.search);
  // Mos 26 ต.ค.: every order is named by its delivery day ("ศ. 6 พ.ย.") · the sales text says "ส่งศุกร์ 6 พ.ย."
  const day = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  const dayLong = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "long", timeZone: "UTC" }).replace(/^วัน/, "") + " " + new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "UTC" });
  const ST = { proposed: "รอส่ง", approved: "รอส่ง", sent: "ส่งแล้ว", failed: "ส่งไม่ออก" };
  let orderId = q.get("order"), order = null, rows = [], step = {}, shop = "", autoAt = "21:00";

  async function findOrder() {
    // 0033: tonight's order is for its arrival day (lead 2 → day after tomorrow) · without ?order = the newest one still to come
    let r = supabase.from("orders").select("id,status,for_date,sent_at,plan");
    r = orderId ? r.eq("id", orderId) : r.gt("for_date", today).in("status", ["proposed", "approved", "failed", "sent"]).order("created_at", { ascending: false });
    const { data, error } = await r.limit(1).maybeSingle();
    if (error) throw error; // qa: shown as "เปิดไม่ขึ้น", not "ยังไม่มีใบสั่ง"
    return data;
  }
  order = await findOrder();
  if (!order) {
    if (q.get("repeat") !== "1") {
      // 0033: a night whose delivery day has no CPF delivery (Saturday → Monday) has no order → say why, in delivery days
      const { data: pl } = await supabase.rpc("night_plan", { d: today });
      $("none").innerHTML = pl && pl.none
        ? `<p>คืนนี้ไม่มีใบสั่ง</p><p class="muted">${day(pl.arrive)} ${pl.reason === "holiday" ? "ร้านหยุด ไม่มีคนรับของ" : "CPF ไม่ส่ง"}</p><p class="muted">ของ ${day(pl.arrive)} อยู่ในล็อต ${day(pl.covered_by)} แล้ว</p><p class="muted">ใบถัดไป ใบสั่งของ ${day(pl.next_arrive)}</p>`
        : `<p>ยังไม่มีใบสั่ง CPF คืนนี้</p><p class="muted">รอพนักงานกดปิดร้านก่อน</p>`;
      return show("none");
    }
    show("repeat");
    $("skip").onclick = () => { $("repeat").innerHTML = "<p>คืนนี้ไม่สั่ง CPF</p>"; };
    $("rep").onclick = async () => {
      $("rep").disabled = true;
      try {
        const { data: prev } = await supabase.from("orders").select("id").eq("status", "sent").lte("for_date", bkk()).order("for_date", { ascending: false }).limit(1).maybeSingle();
        if (!prev) throw new Error("ยังไม่เคยส่งใบสั่ง ไม่มีครั้งก่อนให้ใช้");
        const { data: old } = await supabase.from("order_items").select("product_id,qty_final,qty_proposed").eq("order_id", prev.id);
        const { data: pl, error } = await supabase.rpc("night_order", { d: today });
        const nid = pl && pl.order_id;
        if (error || !nid) throw error || new Error(`คืนนี้ไม่มีใบสั่ง ${day(pl.arrive)} CPF ไม่ส่ง`);
        await supabase.from("order_items").delete().eq("order_id", nid);
        const { error: e2 } = await supabase.from("order_items").insert(old.map((o) => ({ order_id: nid, product_id: o.product_id, qty_proposed: o.qty_final ?? o.qty_proposed, qty_final: o.qty_final ?? o.qty_proposed })));
        if (e2) throw e2;
        location.replace("approve.html?order=" + nid);
      } catch (e) { $("rep").disabled = false; $("rep").insertAdjacentHTML("afterend", `<p class="err">${App.errText(e)}</p>`); }
    };
    return;
  }
  orderId = order.id;
  const { data: st } = await supabase.from("settings").select("key,value").in("key", ["shop_name", "auto_send_at", "sales_mention"]);
  let mention = "@new";
  for (const s of st || []) { if (s.key === "shop_name") shop = s.value; else if (s.key === "sales_mention") mention = String(s.value || "").trim(); else autoAt = s.value; }
  // order_review = order_display + เหลือ (latest closed sheet) · ควรมี · proposed qty · pack size
  const { data: disp, error: dErr } = await supabase.rpc("order_review", { oid: orderId });
  if (dErr) throw dErr;
  rows = (disp || []).sort((a, b) => a.sort - b.sort);
  // items without a bag size go to the sales group as a plain qty: ask the owner to set ถุงละ (pack_size 1 on a non-chicken item)
  const nop = rows.filter((r) => Number(r.pack_size || 1) <= 1);
  if (nop.length) { $("nopack").hidden = false; $("nopack").innerHTML = `ยังไม่ได้ใส่ถุงละ ${nop.length} รายการ เซลล์จะเห็นแค่จำนวน<br>${nop.map((r) => E(r.name || r.label)).join(" ")}<br><a href="settings.html?tab=prod">ไปใส่ถุงละในหน้าสินค้า</a>`; }
  step = Object.fromEntries(rows.map((r) => [r.product_id, r.pack_size || 1]));
  const plan = order.plan;
  // 0033: ของใช้ต้องซื้อเอง = ticked ใกล้หมด/หมด at close · own section under the order, never sent to CPF
  const sb = plan ? plan.self_buy || [] : ((await supabase.from("self_buy_today").select("name,status")).data || []);
  if (sb.length) $("buy").innerHTML = `<h2 class="ux-gh" data-tone="${sb.some((s) => s.status === "out") ? "bad" : "wait"}">ของใช้ต้องซื้อเอง<span class="n">${sb.length} รายการ</span></h2>
    <div class="card list">${sb.map((s) => `<div class="orow"><div class="grow"><div class="nm">${E(s.name)}</div></div><span class="chip ${s.status === "out" ? "bad" : "wait"}">${s.status === "out" ? "หมดแล้ว" : "ใกล้หมด"}</span></div>`).join("")}</div>
    <p class="gf">ไม่อยู่ในใบสั่ง CPF ซื้อเองที่ช้อปปี้หรือแม็คโคร</p>`;
  const cutDay = new Date(Date.parse(order.for_date + "T00:00:00Z") - 864e5).toISOString().slice(0, 10);
  $("ttl").textContent = "ใบสั่งของ"; document.title = `ใบสั่งของ ${day(order.for_date)}`;
  $("d").textContent = `${day(order.for_date)}${plan ? ` ${plan.deliver_at} น.` : ""}`; $("sd").textContent = day(cutDay);
  if (plan && plan.opening) $("cdl").textContent = "ใบสั่งแรก กดส่งให้เซลล์เอง";
  // 0035 weekly holiday night: the order uses the last open day's sales (same line as the card)
  // 0036: the night after a no-order night (Sat → Mon no delivery) uses that day's sales
  const salesDay = plan && plan.sales_day ? new Date(plan.sales_day + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "long", timeZone: "UTC" }) : "";
  if (salesDay) $("cdl").textContent = plan.sales_why === "prev_none" ? `ใช้ยอดขาย${salesDay} (คืน${salesDay}ไม่มีใบสั่ง)` : `ร้านปิดวันนี้ ใช้ยอดขาย${salesDay}`;
  // ×2 lot (a no-delivery / closed day in between): one red strip · no "ร้านเปิดไหม" (0034: the weekly holiday is a setting)
  const mult = plan ? Number(plan.mult || 1) : 1;
  // Mos 26 ต.ค. (iPhone): no formula text anywhere · the strip says the time the way people say it
  // ponytail: only whole afternoon hours get words (delivery is 14:00), anything else stays "HH:MM น."
  const hmTh = (hm) => { const [h, m] = String(hm).split(":").map(Number); return h >= 13 && h <= 15 && !m ? `บ่าย ${h - 12}` : `${hm} น.`; };
  if (mult > 1) $("lot").innerHTML = `<div class="ux-lot" role="note"><b>ล็อตนี้ต้องพอขายถึง ${dayLong(plan.until)} ${hmTh(plan.deliver_at)}</b></div>`;
  $("pill").textContent = ST[order.status] || order.status; $("pill").dataset.tone = { sent: "ok", failed: "bad" }[order.status] || "wait";
  const n = (v) => Number(v).toLocaleString("th-TH", { maximumFractionDigits: 1 });
  // 0033: plan rows say how the number came about: left tonight, sold today (× mult) · no sold today = the old owner's average, in grey
  const left = (r) => r.remaining == null ? "" : `เหลือ ${n(r.remaining)} ${E(r.unit_th)} · `;
  // 0038: เหลือ · กำลังมา · ขายวันละ (เฉลี่ย 7 วัน หรือค่าตั้งต้น) · ควรมี (เป้า) — the same numbers the rule in settings describes
  const base = (r) => r.kind === "consumable" ? `ของใช้ CPF ติ๊กใกล้หมดตอนปิดร้าน 1 ถุง` : r.daily_use != null
    ? `${left(r)}${Number(r.incoming) > 0 ? `กำลังมา ${n(r.incoming)} · ` : ""}ขายวันละ ${r.daily_use < 1 ? n(r.daily_use) : Math.round(r.daily_use)}${r.use_src === "seed" ? " (ค่าตั้งต้น)" : ""}${r.par != null ? ` · ควรมี ${n(r.par)}` : ""}`
    : `เหลือ ${r.remaining == null ? "-" : n(r.remaining)} · ควรมี ${r.par == null ? "-" : n(r.par)} ${E(r.unit_th)}`;
  const meta = (r, q) => base(r) + (r.sets != null ? ` · ${Math.round(q / r.pack_size)} เซ็ต` : "") + (q !== Number(r.qty_proposed) ? `<br><b>แก้จาก ${n(r.qty_proposed)}</b>` : "");
  const rowH = (r, i) => `<div class="orow" id="r${i}"><div class="grow"><div class="nm">${E(r.label)}</div><div class="meta"></div></div>
    <div class="step"><button type="button" data-d="-1" data-s="${i}" aria-label="ลด ${E(r.label)}">−</button><input type="number" inputmode="decimal" min="0" step="${step[r.product_id]}" value="${Number(r.qty)}" data-i="${i}" aria-label="${E(r.label)} จำนวนสั่ง (${E(r.unit_th)})"><button type="button" data-d="1" data-s="${i}" aria-label="เพิ่ม ${E(r.label)}">+</button></div></div>`;
  // round 6 (Mos 23 ต.ค.): "ต้องดู" (edited / low / no stock figure) = white card on top · "ตามที่ระบบเสนอ" (at the proposal and เหลือ ≥ ควรมี)
  // = its own grey box after a clear gap, folded by default ("ดู N รายการ"); opened rows render inside that box and stay editable
  // ponytail: the split is decided once per render (stored qty), so a row edited here never jumps under the finger; it moves after reload
  // every row keeps its input (data-i), folded rows only hide, cur() still walks rows in order → the same send payload
  const same = (r) => Number(r.qty) === Number(r.qty_proposed) && r.remaining != null && r.par != null && Number(r.remaining) >= Number(r.par);
  const top = rows.map((r, i) => same(r) ? "" : rowH(r, i)).join(""), sys = rows.map((r, i) => same(r) ? rowH(r, i) : "").join(""), nSame = rows.filter(same).length, nTop = rows.length - nSame;
  $("items").innerHTML = (!rows.length ? '<div class="card"><p class="muted">ใบนี้ไม่มีของต้องสั่ง</p></div>'
    : (nTop ? `<h2 class="ux-gh" data-tone="wait">ต้องดู<span class="n">${nTop} รายการ</span></h2><div class="card list">${top}</div>` : "")
    + (nSame ? `<section class="ux-sys" aria-labelledby="sysH"><div class="ux-sysh"><div class="grow"><h2 id="sysH">ของยังพอ ${nSame} รายการ</h2><p>ไม่ได้แก้จำนวน</p></div><button type="button" id="sysT" class="chip" aria-expanded="false" aria-controls="sysL">ดู ${nSame} รายการ</button></div><div id="sysL" hidden>${sys}<button type="button" id="sysB" class="ux-sysend">ซ่อน ${nSame} รายการ</button></div></section>` : ""));
  // impeccable: a long open box gets a second "ซ่อน" at its end · folding from there brings the box header back into view
  const fold = (open, back) => { $("sysL").hidden = !open; $("sysT").setAttribute("aria-expanded", open); $("sysT").textContent = open ? "ซ่อน" : `ดู ${nSame} รายการ`; if (back) document.querySelector(".ux-sys").scrollIntoView({ block: "center" }); };
  if (nSame) { $("sysT").onclick = () => fold($("sysL").hidden); $("sysB").onclick = () => fold(false, true); }
  const qv = (i) => Math.max(0, Number(document.querySelector(`[data-i="${i}"]`).value) || 0);
  const cur = () => rows.map((r, i) => ({ product_id: r.product_id, qty_final: qv(i), r }));
  // ง3: how far the owner moved from what the system proposed (order_review qty_proposed)
  const label = () => { const e = rows.filter((r, i) => qv(i) !== Number(r.qty_proposed)).length; $("chg").textContent = e ? `แก้จำนวน ${e} รายการ` : "";
    const k = cur().filter((x) => x.qty_final > 0).length; $("send").disabled = k === 0; $("send").textContent = k === 0 ? "ไม่มีของที่จะสั่ง" : `ส่งใบสั่งให้เซลล์${order.status === "sent" ? "อีกครั้ง" : ""} ${k} รายการ`; };
  const mark = (i) => { const q = qv(i), r = rows[i], row = $("r" + i); row.classList.toggle("chg", q !== Number(r.qty_proposed)); row.querySelector(".meta").innerHTML = meta(r, q); };
  rows.forEach((_, i) => mark(i));
  $("items").onclick = (ev) => {
    const b = ev.target.closest("button[data-d]"); if (!b) return;
    const i = +b.dataset.s, s = step[rows[i].product_id], inp = document.querySelector(`[data-i="${i}"]`);
    const was = qv(i); inp.value = Math.max(0, Math.round((was + s * +b.dataset.d) / s) * s);
    UXM.roll(inp, Math.sign(qv(i) - was)); inp.dispatchEvent(new Event("input", { bubbles: true })); // ก3: the number slides, never jumps
  };
  // the sales text = the previous owner's format (same as message.ts buildOrderMessage, Mos 26 ต.ค.)
  const dmy = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const wd = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "long", timeZone: "UTC" });
  const cut = new Date(Date.parse(order.for_date + "T00:00:00Z") - 864e5).toISOString().slice(0, 10);
  const text = (edit) => [...(edit ? ["แก้ไขใบสั่ง"] : []), shop, `สั่งของประจำ${wd(cut)} ${dmy(cut)}`, `(มาส่ง${wd(order.for_date)} ${dmy(order.for_date)})`, "",
    ...cur().filter((x) => x.qty_final > 0).map(({ r, qty_final: n }, i) => `${i + 1}. ${r.name || r.label} ${n} ${r.unit || r.unit_th}${r.pack_size > 1 ? ` (${Math.ceil(n / r.pack_size)}ถุง)` : ""}`), ...(mention ? [mention] : [])].join("\n");
  const prev = () => { $("prev").textContent = text(!!order.sent_at); };
  $("items").oninput = (ev) => { if (ev.target.dataset.i !== undefined) mark(+ev.target.dataset.i); prev(); label(); }; prev(); label();
  const tick = () => { const [h, m] = String(autoAt).split(":").map(Number); const t = new Date(Date.now() + 7 * 3600e3); let s = (h * 60 + m) * 60 - (t.getUTCHours() * 3600 + t.getUTCMinutes() * 60 + t.getUTCSeconds()); if (s < 0) s += 86400; $("cd").textContent = `${autoAt} น. (อีก ${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")} ชม.)`; };
  if (!(plan && plan.opening)) { tick(); setInterval(tick, 30000); }
  show("form"); show("when"); document.querySelector(".topbar .sub").hidden = true;
  $("send").onclick = async () => {
    $("send").disabled = true; $("copy").hidden = true; $("msg").className = "muted"; $("msg").textContent = "กำลังส่ง…";
    try {
      const r = await App.fn("send-order", { order_id: orderId, mode: "manual", items: cur().map(({ product_id, qty_final }) => ({ product_id, qty_final })) });
      if (r.ok) { $("msg").className = "muted"; $("msg").textContent = ""; UXM.toast("ส่งใบสั่งให้เซลล์แล้ว ✓"); $("pill").textContent = "ส่งแล้ว"; $("pill").dataset.tone = "ok"; order.status = "sent"; order.sent_at = order.sent_at || new Date().toISOString(); prev(); label(); }
      else { $("msg").className = "err"; $("msg").textContent = "ส่งไม่ออก\nกดคัดลอก แล้วไปวางในกลุ่มสั่งของเอง"; $("pill").textContent = "ส่งไม่ออก"; $("pill").dataset.tone = "bad"; $("copy").hidden = false; $("copy").onclick = async () => { await navigator.clipboard.writeText(r.message || text(false)); $("copy").textContent = "คัดลอกแล้ว"; }; }
    } catch (e) { $("msg").className = "err"; $("msg").textContent = "ส่งไม่ออก ลองกดอีกครั้ง\n" + App.errText(e); }
    label();
  };
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
