<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const E = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const show = (id, t) => { $(id).hidden = false; if (t) $(id).textContent = t; };
  const { supabase, me, jwt } = await App.ready();
  if (me.role !== "owner" && me.role !== "manager") return show("blocked", "หน้านี้สำหรับเจ้าของและผู้จัดการ");
  const bkk = (add = 0) => { const d = new Date(Date.now() + 7 * 3600e3 + add * 864e5); return d.toISOString().slice(0, 10); };
  const today = bkk(), q = new URLSearchParams(location.search);
  // Mos 26 ต.ค.: every order is named by its delivery day ("ศ. 6 พ.ย.") · the sales text says "ส่งศุกร์ 6 พ.ย."
  const day = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  const dayLong = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "long", timeZone: "UTC" }).replace(/^วัน/, "") + " " + new Date(iso + "T00:00:00Z").toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "UTC" });
  const SV = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICO = { warn: SV('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.5"/>'), ok: SV('<path d="M20 6 9 17l-5-5"/>'), cal: SV('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'), box: SV('<path d="m3 7 9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10"/>'), bag: SV('<path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>') };
  const hm = (iso) => new Date(iso).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
  let orderId = q.get("order"), order = null, rows = [], shop = "", autoAt = "12:30";
  // Mos 1 พ.ย. (0060): category headers · rows already sort by products.sort (= category × 100)
  const CAT = Object.fromEntries(((await supabase.from("product_names").select("id,category")).data || []).map((p) => [p.id, p.category]));

  async function findOrder() {
    // 0033: tonight's order is for its arrival day (lead 2 → day after tomorrow) · without ?order = the newest one still to come
    let r = supabase.from("orders").select("id,status,for_date,sent_at,plan");
    r = orderId ? r.eq("id", orderId) : r.gt("for_date", today).in("status", ["proposed", "approved", "failed", "sent", "skipped"]).order("created_at", { ascending: false });
    const { data, error } = await r.limit(1).maybeSingle();
    if (error) throw error; // qa: shown as "เปิดไม่ขึ้น", not "ยังไม่มีใบสั่ง"
    return data;
  }
  order = await findOrder();

    $("addB").disabled = true;
    const { data, error } = await supabase.rpc("order_add_list", { oid: orderId });
    $("addB").disabled = false;
    if (error) { UXM.toast("เปิดรายการไม่ได้ " + App.errText(error)); return; }
    choices = data || []; pick = null; $("addQ").value = 1; $("addM").textContent = "";
    $("addL").innerHTML = choices.length ? choices.map((c, i) => `<label class="ux-addr"><input type="radio" name="addP" value="${i}"><span class="grow"><span class="nm">${E(c.name)}</span>${c.pack_size > 1 ? `<span class="meta">${c.sets ? "เซ็ตละ" : "ถุงละ"} ${c.pack_size} ${E(c.unit_th)}</span>` : ""}</span>${c.active ? "" : '<span class="chip">เลิกขายแล้ว</span>'}</label>`).join("")
      : '<p class="muted">สินค้า CPF ทุกอย่างอยู่ในใบนี้แล้ว</p>';
    $("addF").value = ""; addFind(); addEq(); addS.open();
  };
  // Mos 2 พ.ย.: type to narrow the list (ไก่ → every row with ไก่) · spaces and case ignored
  const addFind = () => { const q = $("addF").value.replace(/\s+/g, "").toLowerCase(); let k = 0;
    $("addL").querySelectorAll(".ux-addr").forEach((l) => { const hit = !q || l.querySelector(".nm").textContent.replace(/\s+/g, "").toLowerCase().includes(q); l.style.display = hit ? "" : "none"; k += hit; });
    $("addNo").hidden = k > 0 || !choices.length; };
  $("addF").oninput = addFind;
  $("addL").onchange = (ev) => { pick = choices[+ev.target.value]; addEq(); };
  $("addQ").oninput = addEq;
  $("addGo").onclick = async () => {
    const k = Math.round(Number($("addQ").value) || 0); if (!pick || k < 1) return;
    $("addGo").disabled = true; $("addM").textContent = "";
    const { error } = await supabase.rpc("order_item_add", { oid: orderId, pid: pick.product_id, qty: k * pick.pack_size });
    if (error) { $("addM").textContent = App.errText(error); addEq(); return; }
    const nm = pick.name; addS.close(); await reload(); UXM.toast(`เพิ่ม ${nm} แล้ว ✓`);
  };
  // audit 11: cron-tick sends by itself at auto_send_at the day after the order's night (0038), first order included (0046)
  const autoDay = plan && plan.night ? new Date(Date.parse(plan.night + "T00:00:00Z") + 864e5).toISOString().slice(0, 10) : cutDay;
  const autoMs = Date.parse(`${autoDay}T${String(autoAt).padStart(5, "0")}:00+07:00`);
  const past = () => live() && autoMs - Date.now() <= 0;
  // A2 pill: 5 levels · รอส่ง = สำคัญ (the app sends by itself) · เลยเวลา / ส่งไม่ออก = เร่งด่วน (the owner must act) · ส่งแล้ว = เสร็จ · ไม่สั่ง = ไม่เร่งด่วน
  // the pill says a result, never "รอส่ง": an order still to send shows the red button instead (Mos 4 พ.ย. รอบ 2)
  const pill = () => { const st = order.status, lv = st === "sent" ? "fin" : st === "failed" ? "urgent" : "later";
    $("pill").hidden = live() && st !== "failed"; $("pill").className = "pp " + lv; $("pill").textContent = st === "sent" ? `ส่งให้เซลล์แล้ว${order.sent_at ? ` ${hm(order.sent_at)} น.` : ""}` : st === "failed" ? "ส่งเข้ากลุ่มไม่ออก" : "ไม่สั่งใบนี้"; };
  const tick = () => { const s = Math.floor((autoMs - Date.now()) / 1000), at = plan ? `ของถึง ${plan.deliver_at} น.` : "";
    pill();
    if (!live()) { $("cdl").textContent = at; return; }
    const when = autoDay === bkk() ? "วันนี้" : autoDay === bkk(1) ? "พรุ่งนี้" : day(autoDay), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    $("cdl").textContent = [at, s <= 0 ? "เลยเวลาที่แอปส่งเองแล้ว กดส่งเอง" : `แอปส่งเอง ${autoAt} น. ${when} · อีก ${h >= 48 ? `${Math.floor(h / 24)} วัน` : h ? `${h} ชม.` : `${m} นาที`}`].filter(Boolean).join(" · "); };
  tick(); setInterval(tick, 30000);
  show("form"); show("when");
  let busy = false;
  const doSend = async () => {
    if (busy) return; busy = true;
    $("copy").hidden = true; $("msg").className = "muted"; $("msg").textContent = "กำลังส่ง…";
    await flush();   // pending rows saved first (the send carries every number too, written by send-order only when it holds the send key)
    $("send").disabled = true;
    try {
      const r = await App.fn("send-order", { order_id: orderId, mode: "manual", resend: order.status === "sent", items: cur().map(({ product_id, qty_final }) => ({ product_id, qty_final })) });
      // 0046 (audit 31): the app's 12:30 send got there first (or another phone pressed): say so, never post twice
      // another press or the 12:30 send holds the send key right now: wait 3 s and read the real status
      if (r.sending) { $("msg").className = "muted"; $("msg").textContent = "กำลังส่งใบนี้อยู่ รอสักครู่";
        setTimeout(async () => { const { data: o } = await supabase.from("orders").select("status,sent_at").eq("id", orderId).maybeSingle();
          if (o) Object.assign(order, o); $("msg").textContent = order.status === "sent" ? "ใบนี้ส่งให้เซลล์แล้ว ไม่ได้ส่งซ้ำ" : "ยังส่งไม่สำเร็จ กดส่งอีกครั้ง"; pill(); keep(); render(); tick(); }, 3000); return; }
      if (r.already) { $("msg").className = "muted"; $("msg").textContent = "ใบนี้ส่งให้เซลล์แล้ว ไม่ได้ส่งซ้ำ"; if (r.status) { order.status = r.status; order.sent_at = order.sent_at || new Date().toISOString(); } pill(); keep(); render(); tick(); return; }
      if (r.ok) { $("msg").className = "muted"; $("msg").textContent = ""; UXM.toast("ส่งใบสั่งให้เซลล์แล้ว ✓"); order.status = "sent"; order.sent_at = order.sent_at || new Date().toISOString(); pill(); keep(); render(); tick();
        setTimeout(() => location.replace("index.html"), 900); }   // Mos 4 พ.ย.: sent = done, back to the hub
      else { $("msg").className = "err"; $("msg").textContent = "ส่งเข้ากลุ่มไม่ออก กดคัดลอกไปวางเอง"; order.status = "failed"; pill(); }
    } catch (e) { $("msg").className = "err"; $("msg").textContent = "ส่งไม่ออก ลองกดอีกครั้ง\n" + App.errText(e); } finally { busy = false; }
    label();
  };
  // Mos 29 ต.ค.: the first order sent as proposed (nothing edited, nothing added) asks once · the proposal covers plan.cover days
  const okS = UXD.sheet($("okS"));
  $("okT").textContent = `ยังไม่ได้แก้ตัวเลข ระบบเสนอเผื่อ ${n((plan && plan.cover) || 2.5)} วัน ส่งเลยไหม`;
  const skS = UXD.sheet($("skS"));
  const askSkip = () => { $("skT").textContent = `ของ ${day(order.for_date)} จะไม่มา`; $("skM").textContent = ""; skS.open(); };
  $("skipB").onclick = askSkip;
  $("skBack").onclick = () => skS.close();
  $("skGo").onclick = async () => {
    $("skGo").disabled = true; await flush();
    const { error } = await supabase.rpc("order_skip", { oid: orderId });
    $("skGo").disabled = false;
    if (error) { $("skM").textContent = App.errText(error); return; }
    skS.close(); order.status = "skipped"; pill(); keep(); render(); tick(); UXM.toast("ไม่สั่งใบนี้แล้ว"); setTimeout(() => location.replace("index.html"), 900);
  };
  $("send").onclick = () => !live() && !unlocked ? (unlocked = true, label()) : live() && !cur().some((x) => x.qty_final > 0) ? askSkip()
    : plan && plan.opening && order.status !== "sent" && !rows.some((r, i) => added(r) || qv(i) !== Number(r.qty_proposed)) ? okS.open() : doSend();
  $("okGo").onclick = () => { okS.close(); doSend(); };
  $("okBack").onclick = () => okS.close();
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
