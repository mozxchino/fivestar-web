<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วันนี้ (เจ้าของ)</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<link rel="stylesheet" href="lib/ux-owner.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/photo.js"></script><script src="lib/ux-owner.js"></script>
<style>
@media (min-width:360px){.tabs button{font-size:15px}}
.th{width:72px;height:72px;object-fit:cover;border-radius:10px;margin:8px 8px 0 0;background:var(--color-muted);border:1px solid var(--color-border);cursor:zoom-in}
input.ed{width:58px;min-height:44px;padding:6px 2px;font-size:18px;font-weight:500;text-align:center;flex:none}
input.ed.cash{width:120px;text-align:right;padding-right:10px}
td+td{font-weight:600}
#bar input{margin-bottom:12px}
#out{font-variant-numeric:tabular-nums}
#out .row .grow,.panel .row .grow{text-wrap:balance}
.iss .day-head{margin-bottom:2px}
.iss .who{font-size:14px;color:var(--color-ink-soft);display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
</style></head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>วันนี้</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></header>
<p id="blocked" class="err" hidden></p>
<div id="app" hidden>
  <div class="tabs" id="tabs"><button data-t="day" class="on">วัน</button><button data-t="iss">ปัญหา</button><button data-t="mon">สรุปเดือน</button></div>
  <div id="bar"></div><div id="out"></div>
</div>
<div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="ph" hidden></div>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const U = window.UxOwner, esc = U.esc;
  const { supabase, me } = await App.ready();
  if (me.role !== "owner") { $("blocked").hidden = false; $("blocked").textContent = "หน้านี้สำหรับเจ้าของ"; return; }
  $("app").hidden = false;
  const TODAY = U.today();
  const hm = (t) => t ? new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" }) : "-";
  const when = (d) => d === TODAY ? "วันนี้" : d === U.plus(TODAY, -1) ? "เมื่อวาน" : U.dayName(d);
  const names = Object.fromEntries(((await supabase.from("users").select("id,name")).data || []).map((u) => [u.id, u.name]));
  const P = (await supabase.from("products").select("id,name,unit")).data || [];
  const prods = Object.fromEntries(P.map((p) => [p.id, p.name])), unit = Object.fromEntries(P.map((p) => [p.id, p.unit || ""]));
  const remindAt = String(((await supabase.from("settings").select("key,value").eq("key", "remind_at").maybeSingle()).data || {}).value || "20:30");
  const TYPE = { waste: "ของเสีย/หมดอายุ", equipment: "เครื่องพัง", customer: "ลูกค้าร้องเรียน", cpf: "ของ CPF มาผิด", edit_request: "กรอกผิด ขอแก้", other: "เรื่องอื่น" };
  const CS = { low: "ใกล้หมด", out: "หมด" };
  const money = (n) => n == null ? "-" : Number(n).toLocaleString("th-TH");
  const baht = (n) => n == null ? "-" : money(n) + " บาท";
  const thumbs = async (ps) => (await Promise.all((ps || []).filter(Boolean).map(async (p) => { try { return `<img class="th" alt="รูปจากร้าน" src="${await Photo.url(supabase, p)}">`; } catch { return ""; } }))).join("");
  document.addEventListener("click", (e) => { const im = e.target.closest("img.th"); if (im) Photo.view(im.src); });

  // ---- state: ?d=YYYY-MM-DD · ?tab=day|iss|month (LINE cards deep-link here) ----
  const q = new URLSearchParams(location.search);
  let D = /^\d{4}-\d{2}-\d{2}$/.test(q.get("d") || "") && q.get("d") <= TODAY ? q.get("d") : TODAY;
  let TAB = { iss: "iss", month: "mon", mon: "mon" }[q.get("tab")] || "day";
  let CHIP = "open";
  const sync = () => {
    const p = new URLSearchParams();
    if (TAB !== "day") p.set("tab", TAB === "mon" ? "month" : TAB);
    if (TAB === "day" && D !== TODAY) p.set("d", D);
    try { history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : "")); } catch (_) { /* LIFF webview without history: fine */ }
  };
  const show = (t) => { TAB = t; document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.t === t)); $("out").innerHTML = ""; $("bar").innerHTML = ""; sync(); return V[t](); };

  // ---- day ----
  let ctx = null; // last loaded day (used by the edit panel)
  async function loadDay(d) {
    const isToday = d === TODAY;
    const [{ data: days }, { data: sl }, { data: cc }, { data: od }, { data: iss }, { data: lv }] = await Promise.all([
      supabase.from("shop_days").select("*").gte("date", U.plus(d, -7)).lte("date", d).order("date", { ascending: false }),
      supabase.from("stock_lines").select("*").eq("date", d),
      supabase.from("consumable_checks").select("product_id,status").eq("date", d).neq("status", "ok"),
      supabase.from("orders").select("order_items(product_id,qty_proposed,qty_final,qty_received,received_at)").eq("for_date", d).eq("status", "sent").maybeSingle(),
      supabase.from("issues").select("id,date,type,text,photos,created_by,created_at,status").eq("status", "open").order("created_at", { ascending: false }),
      isToday ? supabase.from("leave_requests").select("id,user_id,date,type,note,status,users(name)").gte("date", TODAY.slice(0, 8) + "01").lte("date", U.plus(TODAY, 31)).order("date") : Promise.resolve({ data: [] }),
    ]);
    const byDate = Object.fromEntries((days || []).map((x) => [x.date, x]));
    return { d, isToday, sd: byDate[d] || null, yday: byDate[U.plus(d, -1)] || null, days: days || [], sl: sl || [], cc: cc || [], items: od?.order_items || [],
      iss: (iss || []).filter((i) => i.status === "open" && (isToday || (i.date || "").slice(0, 10) === d)), lv: lv || [] };
  }
  const cashOf = (s) => s && s.cash_expected != null && s.cash_counted != null ? s.cash_counted - s.cash_expected : null;

  function todos(c) {
    const T = [];
    for (const i of c.iss) {
      const n = (i.photos || []).filter(Boolean).length, line = String(i.text || "").split("\n")[0];
      T.push({ r: 0, bad: 1, at: i.created_at, key: "i" + i.id,
        t: `${TYPE[i.type] || esc(i.type)} · ${esc(line.length > 40 ? line.slice(0, 40) + "…" : line)}`,
        s: `${esc(names[i.created_by] || "-")} · ${(i.date || "").slice(0, 10) !== c.d ? when((i.date || "").slice(0, 10)) + " " : ""}${hm(i.created_at)} น.${n ? ` · มีรูป ${n} รูป` : ""}`,
        a: `${n ? `<button class="btn sm" data-a="photos" data-i="${i.id}">ดูรูป</button>` : ""}<button class="btn sm" data-a="ack" data-i="${i.id}">รับทราบ</button>` });
    }
    for (const s of [c.sd, c.isToday ? c.yday : null].filter(Boolean)) {
      const x = cashOf(s); if (x == null || x >= 0) continue;
      T.push({ r: 1, bad: 1, at: s.date, key: "c" + s.date, t: `เงินสดขาด ${baht(-x)} · ${when(s.date)}`, s: `ควรมี ${baht(s.cash_expected)} · นับได้ ${baht(s.cash_counted)}`,
        a: s.date !== c.d ? `<button class="btn sm go" data-a="go" data-d="${s.date}">ดู${when(s.date)}</button>` : "" });
    }
    const short = c.items.filter((i) => i.received_at != null && (+i.qty_received || 0) < (+(i.qty_final ?? i.qty_proposed) || 0));
    if (short.length) T.push({ r: 2, bad: 1, key: "g", t: `ของมาไม่ครบ · ขาด ${short.length} รายการ`, s: esc(short.slice(0, 3).map((i) => prods[i.product_id]).join(" · ") + (short.length > 3 ? " …" : "")),
      a: `<button class="btn sm go" data-a="recv">ดูที่ขาด</button>` });
    for (const l of c.lv.filter((l) => l.status === "pending" && l.date >= TODAY)) {
      const off = c.lv.filter((x) => x.user_id === l.user_id && x.status === "approved" && x.date.slice(0, 7) === l.date.slice(0, 7)).length;
      T.push({ r: 3, at: l.date, key: "l" + l.id, t: `${U.LEAVE[l.type] || esc(l.type)} ${U.dayName(l.date)} · ${esc(l.users?.name || names[l.user_id] || "-")}`,
        s: (l.note ? esc(l.note) + " · " : "") + `เดือนนั้นหยุดแล้ว ${off} วัน`,
        a: `<button class="btn sm" data-a="leave" data-ok="0" data-i="${l.id}">ไม่อนุมัติ</button><button class="btn sm" data-a="leave" data-ok="1" data-i="${l.id}">อนุมัติ</button>` });
    }
    const ot = c.days.filter((s) => +s.ot_hours > 0 && !s.ot_approved_at && (c.isToday ? s.date >= U.plus(c.d, -7) && s.date <= c.d : s.date === c.d)).sort((a, b) => a.date.localeCompare(b.date));
    if (ot.length === 1) { const s = ot[0];
      T.push({ r: 4, at: s.date, key: "o" + s.date, t: `โอที ${+s.ot_hours} ชม. · ${when(s.date)}`, s: s.closed_at ? `ปิดร้าน ${hm(s.closed_at)} น. · ${esc(names[s.closed_by] || "-")}` : "ยังไม่ปิดร้าน",
        a: `<button class="btn sm" data-a="ot" data-d="${s.date}">อนุมัติโอที</button>` }); }
    // several days waiting → one card, one press (approve_ot per day)
    if (ot.length > 1) T.push({ r: 4, at: ot[0].date, key: "o", t: `โอทีรออนุมัติ ${ot.length} วัน · รวม ${ot.reduce((n, s) => n + +s.ot_hours, 0)} ชม.`,
      s: `${U.short(ot[0].date)} – ${U.short(ot[ot.length - 1].date)}`, a: `<button class="btn sm" data-a="ot" data-d="${ot.map((s) => s.date).join(",")}">อนุมัติโอทีทั้ง ${ot.length} วัน</button>` });
    return T.sort((a, b) => a.r - b.r || String(a.at || "").localeCompare(String(b.at || "")));
  }

  function strip(c) {
    const { sd, items, isToday } = c;
    if (sd?.status === "holiday") return `<div class="tl"><div><b>ร้านหยุด</b>&nbsp;</div><div><b>-</b>รับของ</div><div><b>-</b>ปิดร้าน</div></div>`;
    const recvd = items.filter((i) => i.received_at != null), short = recvd.filter((i) => (+i.qty_received || 0) < (+(i.qty_final ?? i.qty_proposed) || 0));
    const rAt = recvd.length ? hm(recvd.map((i) => i.received_at).sort()[0]) : "";
    const cells = [
      sd?.opened_at ? ["ok", `เปิด ${hm(sd.opened_at)}`, esc(names[sd.opened_by] || "-")] : ["", "ยังไม่เปิด", isToday ? "รอเปิดร้าน" : "ไม่ได้เปิดในแอป"],
      !items.length ? ["", "ไม่มีใบสั่ง", "รับของ"] : !recvd.length ? ["", "ยังไม่รับของ", `ใบสั่ง ${items.length} รายการ`]
        : short.length ? ["bad", `ของขาด ${short.length}`, `รับของ ${rAt}`] : ["ok", `ครบ ${items.length} รายการ`, `รับของ ${rAt}`],
      sd?.closed_at ? ["ok", `ปิด ${hm(sd.closed_at)}`, esc(names[sd.closed_by] || "-")] : isToday ? ["", "ยังไม่ปิด", `เตือน ${esc(remindAt)}`] : ["bad", "ไม่ได้ปิด", "ในแอป"],
    ];
    if (isToday) { const n = cells.findIndex((x) => !x[0] && !/ไม่มีใบสั่ง/.test(x[1])); if (n >= 0) cells[n][0] = "now"; }
    return `<div class="tl">${cells.map(([k, b, s]) => `<div class="${k}"><b>${b}</b>${s}</div>`).join("")}</div>`;
  }

  async function dayView() {
    const d = D;
    $("bar").innerHTML = `<div class="daynav"><button id="prev" aria-label="วันก่อน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="d"><span>${U.dayName(d)}</span><small>${d === TODAY ? "วันนี้ · " : d === U.plus(TODAY, -1) ? "เมื่อวาน · " : ""}แตะเลือกวัน</small><input id="pd" type="date" value="${d}" max="${TODAY}" aria-label="เลือกวัน"></div>
      <button id="next" aria-label="วันถัดไป" ${d >= TODAY ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>`;
    $("prev").onclick = () => go(U.plus(D, -1));
    $("next").onclick = () => go(U.plus(D, 1));
    $("pd").onchange = () => { const v = $("pd").value; if (v) go(v > TODAY ? TODAY : v); };
    $("pd").onclick = () => { try { $("pd").showPicker(); } catch (_) { /* iOS opens the picker on tap anyway */ } };
    $("out").innerHTML = `<p class="muted">กำลังเปิด…</p>`;
    const c = ctx = await loadDay(d);
    if (d !== D || TAB !== "day") return; // user moved on while loading
    const { sd, sl, cc, items } = c;
    const T = todos(c);
    const todo = `<h3 class="sec" id="todoh">${T.length ? `ต้องจัดการ ${T.length} เรื่อง` : "ต้องจัดการ"}</h3>` + (T.length
      ? T.map((x) => `<div class="card todo${x.bad ? " bad" : ""}" data-k="${x.key}"><div class="t">${x.t}</div><div class="s">${x.s}</div>${x.a ? `<div class="acts">${x.a}</div>` : ""}</div>`).join("")
      : `<p class="alldone">ไม่มีเรื่องต้องจัดการ</p>`);
    if (!sd) {
      $("out").innerHTML = strip(c) + todo + `<div class="card muted">ไม่มีบันทึกของ${when(d)}</div>` + (c.isToday ? `<a class="btn sm" href="approve.html">ดูใบสั่งพรุ่งนี้</a>` : "");
      return;
    }
    const x = cashOf(sd);
    const cash = x == null ? `<div class="v">ยังไม่นับ</div>` : x < 0 ? `<div class="v err">ขาด ${baht(-x)}</div>` : x > 0 ? `<div class="v">เกิน ${baht(x)}</div>` : `<div class="v ok">ครบ</div>`;
    const waste = sl.filter((l) => +l.waste > 0);
    const recv = items.map((i) => {
      const o = +(i.qty_final ?? i.qty_proposed) || 0;
      if (i.received_at == null) return `<div class="ln">${esc(prods[i.product_id])} สั่ง ${o} ${esc(unit[i.product_id])} <span class="muted">ยังไม่รับของ</span></div>`;
      const r = +i.qty_received || 0;
      return `<div class="ln">${esc(prods[i.product_id])} สั่ง ${o} · ได้ ${r} ${esc(unit[i.product_id])}${r < o ? ` <b class="err">ขาด ${o - r} ${esc(unit[i.product_id])}</b>` : ""}</div>`;
    }).join("");
    const nShort = items.filter((i) => i.received_at != null && (+i.qty_received || 0) < (+(i.qty_final ?? i.qty_proposed) || 0)).length;
    const nLow = cc.filter((x) => x.status === "low").length, nOut = cc.filter((x) => x.status === "out").length;
    const photos = [sd.open_photo, ...(sd.photos || []), sd.pos_photo].filter(Boolean);
    const fold = (id, head, body) => `<button class="fold" aria-expanded="false" data-f="${id}">${head}</button><div class="fold-body"><div id="f-${id}">${body}</div></div>`;
    $("out").innerHTML = strip(c) + todo
      + `<div class="two"><div class="card"><div class="k">เงินสด${when(d) === "วันนี้" ? "วันนี้" : ""}</div>${cash}<div class="m">${x == null ? "" : `นับได้ ${baht(sd.cash_counted)}`}</div></div>
         <div class="card"><div class="k">ของเสีย</div><div class="v">${waste.length ? `${waste.length} รายการ` : "ไม่มี"}</div><div class="m">${+sd.ot_hours ? `โอที ${+sd.ot_hours} ชม.${sd.ot_approved_at ? " · อนุมัติแล้ว" : ""}` : "ไม่มีโอที"}</div></div></div>`
      + (sd.note ? `<div class="card"><div class="k muted">พนักงานฝากบอก</div>${esc(sd.note)}</div>` : "")
      + `<div class="card folds">`
      + fold("recv", items.length ? `<b>รับของ ${items.length} รายการ${nShort ? ` · ขาด ${nShort}` : ""}</b>` : `<b>ไม่มีใบสั่ง</b>`, recv || `<p class="muted">ไม่มีใบสั่ง</p>`)
      + (waste.length ? fold("waste", `<b>ของเสีย ${waste.length} รายการ</b>`, waste.map((l) => `<div class="ln">${esc(prods[l.product_id])} ${l.waste} ${esc(unit[l.product_id])}</div>`).join("")) : "")
      + fold("cons", `<b>ของใช้ในร้าน${cc.length ? ` · ${[nLow ? `ใกล้หมด ${nLow}` : "", nOut ? `หมด ${nOut}` : ""].filter(Boolean).join(" · ")}` : " · มีครบ"}</b>`,
        cc.map((c) => `<div class="ln">${esc(prods[c.product_id])} <span class="pill" data-tone="${c.status === "out" ? "bad" : "wait"}">${CS[c.status] || esc(c.status)}</span></div>`).join("") || `<p class="muted">มีครบ</p>`)
      + (photos.length ? fold("pics", `<b>รูปจากร้าน ${photos.length} รูป</b>`, `<p class="muted">กำลังโหลดรูป…</p>`) : "")
      + `</div>`
      + (c.isToday ? `<a class="btn sm" href="approve.html">ดูใบสั่งพรุ่งนี้</a>` : "")
      + `<button class="btn sm" id="edit">แก้ตัวเลข${c.isToday ? "วันนี้" : "วันนั้น"}</button>`;
    $("edit").onclick = () => openEdit(c);
    U.folds($("out").querySelector(".folds"), async (b) => {
      if (b.dataset.f !== "pics" || b.dataset.done) return;
      b.dataset.done = 1; $("f-pics").innerHTML = (await thumbs(photos)) || `<p class="muted">เปิดรูปไม่ขึ้น</p>`;
    });
  }
  const go = (d) => { D = d; sync(); dayView(); };

  // in-place decisions on the to-do cards (R10: press → done → card leaves)
  const gone = (card) => {
    card.classList.add("gone");
    setTimeout(() => { card.remove(); const n = document.querySelectorAll("#out .todo").length; $("todoh").textContent = n ? `ต้องจัดการ ${n} เรื่อง` : "ต้องจัดการ";
      if (!n) $("todoh").insertAdjacentHTML("afterend", `<p class="alldone">ไม่มีเรื่องต้องจัดการ</p>`); }, 200);
  };
  const say = (card, text, ok) => { let p = card.querySelector(".say"); if (!p) { p = document.createElement("p"); card.appendChild(p); } p.className = "say " + (ok ? "ok" : "err"); p.textContent = text; };
  $("out").addEventListener("click", async (e) => {
    if (TAB !== "day") return;
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const card = b.closest(".todo"), a = b.dataset.a;
    if (a === "go") return go(b.dataset.d);
    if (a === "recv") { const f = document.querySelector('.fold[data-f="recv"]'); if (f && f.getAttribute("aria-expanded") !== "true") f.click(); f?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (a === "photos") {
      const i = ctx.iss.find((x) => String(x.id) === b.dataset.i); b.disabled = true;
      card.insertAdjacentHTML("beforeend", `<div>${await thumbs(i?.photos)}</div>`); b.remove(); return;
    }
    b.disabled = true;
    if (a === "ack") {
      const { error } = await supabase.from("issues").update({ status: "ack", ack_by: me.userId, ack_at: new Date().toISOString() }).eq("id", b.dataset.i);
      if (error) { b.disabled = false; return say(card, "รับทราบไม่ได้ ลองกดอีกครั้ง\n" + App.errText(error)); }
      return gone(card);
    }
    if (a === "ot") {
      let error = null;
      for (const d of b.dataset.d.split(",")) { error = (await supabase.rpc("approve_ot", { d })).error; if (error) break; }
      if (error) { b.disabled = false; return say(card, "อนุมัติโอทีไม่ได้ ลองกดอีกครั้ง\n" + App.errText(error)); }
      return gone(card);
    }
    if (a === "leave") {
      card.querySelectorAll("button").forEach((x) => x.disabled = true);
      const r = await U.decideLeave(supabase, b.dataset.i, b.dataset.ok === "1");
      say(card, r.text, r.ok);
      if (!r.ok) { card.querySelectorAll("button").forEach((x) => x.disabled = false); return; }
      setTimeout(() => gone(card), 1200);
    }
  });

  // ---- edit panel (P2-4): numbers of one day, save button sticky at the bottom ----
  function openEdit(c) {
    const { d, sd, sl } = c, pn = $("panel");
    pn.innerHTML = `<div class="panel-head"><h2 id="ph">แก้ตัวเลข ${U.dayName(d)}</h2><button class="x" id="px" aria-label="ปิด">✕</button></div>
      <div class="panel-body"><div class="colhead"><span>สินค้า</span><span>เหลือสด</span><span>เหลือสุก</span><span>เสีย</span></div>
      ${sl.map((l) => `<div class="row" data-p="${l.product_id}"><div class="grow">${esc(prods[l.product_id])}</div>
        <input class="ed" type="number" inputmode="decimal" aria-label="${esc(prods[l.product_id])} เหลือสด" data-f="remain_fresh" value="${l.remain_fresh ?? ""}"><input class="ed" type="number" inputmode="decimal" aria-label="${esc(prods[l.product_id])} เหลือสุก" data-f="remain_cooked" value="${l.remain_cooked ?? ""}"><input class="ed" type="number" inputmode="decimal" aria-label="${esc(prods[l.product_id])} เสีย" data-f="waste" value="${l.waste ?? ""}"></div>`).join("") || `<p class="muted">ไม่มีตัวเลขสินค้าของวันนี้</p>`}
      <h2>เงินสด</h2>
      <div class="row"><label class="grow" for="ce">เงินสดควรมี (บาท)</label><input id="ce" class="ed cash" type="number" inputmode="decimal" value="${sd.cash_expected ?? ""}"></div>
      <div class="row"><label class="grow" for="cn">เงินสดนับได้ (บาท)</label><input id="cn" class="ed cash" type="number" inputmode="decimal" value="${sd.cash_counted ?? ""}"></div>
      <label class="field" for="nt">พนักงานฝากบอก</label><textarea id="nt" rows="2">${esc(sd.note)}</textarea>
      <div class="sticky"><button class="btn primary" id="sv">บันทึกที่แก้</button><p id="sm" class="muted"></p></div></div>`;
    pn.hidden = false; document.body.style.overflow = "hidden";
    requestAnimationFrame(() => requestAnimationFrame(() => pn.classList.add("on")));
    const close = () => { pn.classList.remove("on"); document.body.style.overflow = ""; setTimeout(() => { pn.hidden = true; pn.innerHTML = ""; }, 200); };
    $("px").onclick = close;
    $("sv").onclick = async () => {
      const num = (v) => v === "" ? null : +v; let err = null;
      $("sv").disabled = true; $("sm").className = "muted"; $("sm").textContent = "กำลังบันทึก…";
      for (const r of pn.querySelectorAll("[data-p]")) {
        const old = sl.find((l) => String(l.product_id) === r.dataset.p) || {};
        const u = {}; r.querySelectorAll("input").forEach((i) => u[i.dataset.f] = i.dataset.f === "waste" ? +i.value || 0 : num(i.value));
        if (Object.keys(u).every((k) => (old[k] ?? null) === u[k] || (k === "waste" && (+old[k] || 0) === u[k]))) continue; // unchanged row: skip the call
        const { error } = await supabase.from("stock_lines").update(u).eq("date", d).eq("product_id", r.dataset.p); err = err || error;
      }
      const { error } = await supabase.from("shop_days").update({ cash_expected: num($("ce").value), cash_counted: num($("cn").value), note: $("nt").value || null }).eq("date", d);
      $("sv").disabled = false;
      $("sm").textContent = (err || error) ? "บันทึกไม่ได้ ลองกดอีกครั้ง\n" + App.errText(err || error) : "บันทึกแล้ว ✓"; $("sm").className = (err || error) ? "err" : "ok";
      if (!(err || error)) { close(); if (TAB === "day") dayView(); }
    };
  }

  // ---- issues (P2-6): chips ใหม่ · รับทราบ · ปิดแล้ว · date taps through to that day ----
  async function issView() {
    const { data, error } = await supabase.from("issues").select("*").order("created_at", { ascending: false }).limit(200);
    if (error) { $("out").innerHTML = `<p class="err">เปิดไม่ขึ้น: ${esc(App.errText(error))}</p>`; return; }
    const all = data || [], CH = [["open", "ใหม่"], ["ack", "รับทราบ"], ["closed", "ปิดแล้ว"]];
    const draw = async () => {
      $("bar").innerHTML = `<div class="chips" role="group" aria-label="กรองเรื่อง">${CH.map(([k, t]) => `<button data-c="${k}" aria-pressed="${k === CHIP}">${t} ${all.filter((i) => i.status === k).length}</button>`).join("")}</div>`;
      const rows = all.filter((i) => i.status === CHIP);
      $("out").innerHTML = (await Promise.all(rows.map(async (i) => {
        const d = (i.date || new Date(new Date(i.created_at).getTime() + 7 * 3600e3).toISOString()).slice(0, 10);
        return `<div class="card iss"><div class="day-head"><b>${TYPE[i.type] || esc(i.type)}</b><span class="pill" data-tone="${{ open: "bad", ack: "wait", closed: "ok" }[i.status] || ""}">${{ open: "ใหม่", ack: "รับทราบแล้ว", closed: "ปิดแล้ว" }[i.status] || esc(i.status)}</span></div>
        <div style="white-space:pre-line">${esc(i.text)}</div>
        <div class="who"><button class="daylink" data-day="${d}">${U.dayName(d)}</button><span>${hm(i.created_at)} น. · ${esc(names[i.created_by] || "-")}</span></div><div>${await thumbs(i.photos)}</div>
        ${i.status === "open" ? `<button class="btn sm" data-i="${i.id}" data-s="ack">รับทราบ</button>` : ""}${i.status !== "closed" ? `<button class="btn sm" data-i="${i.id}" data-s="closed">ปิดเรื่อง</button>` : ""}</div>`;
      }))).join("") || `<p class="muted">${{ open: "ไม่มีเรื่องใหม่", ack: "ไม่มีเรื่องที่รับทราบค้างอยู่", closed: "ยังไม่มีเรื่องที่ปิดแล้ว" }[CHIP]}</p>`;
    };
    $("bar").onclick = (e) => { const b = e.target.closest("button[data-c]"); if (b) { CHIP = b.dataset.c; draw(); } };
    $("out").onclick = async (e) => {
      if (TAB !== "iss") return;
      const dl = e.target.closest("button[data-day]"); if (dl) { D = dl.dataset.day; return show("day"); }
      const b = e.target.closest("button[data-i]"); if (!b) return;
      b.disabled = true;
      const u = b.dataset.s === "ack" ? { status: "ack", ack_by: me.userId, ack_at: new Date().toISOString() } : { status: "closed" };
      const { error } = await supabase.from("issues").update(u).eq("id", b.dataset.i);
      if (error) { b.disabled = false; return alert("ทำไม่ได้\n" + App.errText(error)); }
      Object.assign(all.find((i) => String(i.id) === b.dataset.i) || {}, u); draw();
    };
    await draw();
  }

  const V = {
    day: dayView,
    iss: issView,
    async mon() {
      $("bar").innerHTML = `<input id="pm" type="month" value="${TODAY.slice(0, 7)}">`;
      const go = async () => {
        const [y, m] = $("pm").value.split("-").map(Number); if (!y) return;
        const next = m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`;
        const [{ data: s, error }, { data: days }] = await Promise.all([supabase.rpc("month_summary", { y, m }),
          supabase.from("shop_days").select("opened_by").gte("date", $("pm").value + "-01").lt("date", next)]);
        if (error) { $("out").innerHTML = `<p class="err">เปิดไม่ขึ้น: ${esc(App.errText(error))}</p>`; return; }
        const r = (Array.isArray(s) ? s[0] : s) || {};
        const L = [["เปิดร้าน", r.days_worked, "วัน"], ["ปิดร้านในแอป", r.days_closed_sent, "วัน"], ["ร้านหยุด", r.days_holiday, "วัน"], ["โอที", r.ot_hours, "ชม."], ["โอทีที่อนุมัติแล้ว", r.ot_approved_hours, "ชม."], ["ของเสียรวม", r.waste_total, "หน่วย"], ["เงินสดขาดรวม", r.cash_short_total, "บาท"], ["วันที่ของมาไม่ครบ", r.cpf_short_days, "วัน"]];
        const cnt = {}; (days || []).forEach((x) => { if (x.opened_by) cnt[x.opened_by] = (cnt[x.opened_by] || 0) + 1; });
        $("out").innerHTML = `<div class="card"><table>${L.map(([k, v, u]) => `<tr><td>${k}</td><td>${money(v ?? 0)} ${u}</td></tr>`).join("")}</table></div>
          <h2>ใครเปิดร้านกี่วัน</h2><div class="card"><table>${Object.entries(cnt).map(([u, n]) => `<tr><td>${esc(names[u] || u)}</td><td>${n} วัน</td></tr>`).join("") || '<tr><td class="muted">ยังไม่มีใครเปิดร้าน</td></tr>'}</table></div>`;
      };
      $("pm").onchange = go; await go();
    },
  };
  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b || b.dataset.t === TAB) return; $("bar").onclick = null; $("out").onclick = null; show(b.dataset.t); };
  await show(TAB);
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
