<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>วันนี้ (เจ้าของ)</title><link rel="stylesheet" href="lib/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/photo.js"></script>
<style>
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:10px 2px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.th{width:72px;height:72px;object-fit:cover;border-radius:8px;margin:4px 4px 0 0}
.sm{display:inline-block;width:auto;padding:8px 14px;font-size:16px;margin:6px 6px 0 0}
.ed{width:72px!important;padding:6px 2px!important;font-size:16px!important;text-align:center}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line)}td+td{text-align:right;font-weight:600}
</style></head><body>
<div class="topbar"><div class="logo">5</div><div><h1>วันนี้</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></div>
<p id="blocked" class="err" hidden></p>
<div id="app" hidden>
  <div class="tabs" id="tabs"><button data-t="today" class="on">วันนี้</button><button data-t="hist">ย้อนหลัง</button><button data-t="iss">ปัญหา</button><button data-t="mon">สรุปเดือน</button></div>
  <div id="bar"></div><div id="out"></div>
</div>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const { supabase, me } = await App.ready();
  if (me.role !== "owner") { $("blocked").hidden = false; $("blocked").textContent = "เฉพาะเจ้าของ"; return; }
  $("app").hidden = false;
  const bkk = (add = 0) => new Date(Date.now() + 7 * 3600e3 + add * 864e5).toISOString().slice(0, 10);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hm = (t) => t ? new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" }) : "-";
  const dt = (t) => t ? new Date(t).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Bangkok" }) : "-";
  const thumbs = async (ps) => (await Promise.all((ps || []).filter(Boolean).map(async (p) => { try { return `<img class="th" src="${await Photo.url(supabase, p)}">`; } catch { return ""; } }))).join("");
  const names = Object.fromEntries(((await supabase.from("users").select("id,name")).data || []).map((u) => [u.id, u.name]));
  const prods = Object.fromEntries(((await supabase.from("products").select("id,name")).data || []).map((p) => [p.id, p.name]));
  const TYPE = { waste: "ของเสีย/หมดอายุ", equipment: "เครื่องพัง", customer: "ลูกค้าร้องเรียน", cpf: "ของ CPF ผิด", edit_request: "ขอแก้ข้อมูล", other: "อื่นๆ" };
  const CS = { low: "ใกล้หมด", out: "หมด" };
  const money = (n) => n == null ? "-" : Number(n).toLocaleString("th-TH");

  async function dayCard(d, edit) {
    const [{ data: sd }, { data: sl }, { data: cc }, { data: od }] = await Promise.all([
      supabase.from("shop_days").select("*").eq("date", d).maybeSingle(),
      supabase.from("stock_lines").select("*").eq("date", d),
      supabase.from("consumable_checks").select("product_id,status").eq("date", d).neq("status", "ok"),
      supabase.from("orders").select("order_items(product_id,qty_proposed,qty_final,qty_received,received_at)").eq("for_date", d).eq("status", "sent").maybeSingle()]);
    if (!sd) return `<div class="card muted">ไม่มีข้อมูลวันที่ ${d}</div>`;
    const items = od?.order_items || [];
    const recv = !items.length ? "ไม่มีใบสั่ง" : items.map((i) => {
      const o = +(i.qty_final ?? i.qty_proposed) || 0;
      if (i.received_at == null) return `<div>${esc(prods[i.product_id])} สั่ง ${o} <span class="muted">ยังไม่รับของ</span></div>`;
      const r = +i.qty_received || 0;
      return `<div>${esc(prods[i.product_id])} สั่ง ${o} · รับ ${r}${r < o ? ` <b class="err">ขาด ${o - r}</b>` : ""}</div>`;
    }).join("");
    const diff = sd.cash_expected != null && sd.cash_counted != null ? sd.cash_counted - sd.cash_expected : null;
    const stockRows = (sl || []).filter((l) => l.remain_fresh != null || +l.waste || edit);
    const waste = stockRows.filter((l) => +l.waste > 0).map((l) => `<div>${esc(prods[l.product_id])} ${l.waste}</div>`).join("") || "ไม่มี";
    const lines = edit ? stockRows.map((l) => `<div class="row" data-p="${l.product_id}"><div style="flex:1">${esc(prods[l.product_id])}</div>
      <input class="ed" type="number" data-f="remain_fresh" value="${l.remain_fresh ?? ""}"><input class="ed" type="number" data-f="remain_cooked" value="${l.remain_cooked ?? ""}"><input class="ed" type="number" data-f="waste" value="${l.waste ?? ""}"></div>`).join("") : "";
    const ot = +sd.ot_hours || 0;
    return `<div class="card"><b>${d}</b> <span class="pill">${esc(sd.status)}</span>
      <h2>เปิดร้าน</h2>${hm(sd.opened_at)} · ${esc(names[sd.opened_by] || "-")}<div>${await thumbs([sd.open_photo])}</div>
      <h2>รับของ</h2>${recv}
      <h2>ปิดร้าน</h2>${sd.closed_at ? `ส่งตอน ${hm(sd.closed_at)} · ${esc(names[sd.closed_by] || "-")}` : '<span class="muted">ยังไม่ส่ง</span>'}
      <div>เงินควรมี ${money(sd.cash_expected)} · นับได้ ${money(sd.cash_counted)}${diff == null ? "" : diff < 0 ? ` <b class="err">ขาด ${-diff}</b>` : diff > 0 ? ` เกิน ${diff}` : " ครบ"}</div>
      <h2>ของเสีย</h2>${waste}
      <h2>ของสิ้นเปลือง</h2>${(cc || []).map((c) => `<div>${esc(prods[c.product_id])} <span class="pill">${CS[c.status] || c.status}</span></div>`).join("") || "มีครบ"}
      ${sd.note ? `<h2>โน้ต</h2>${esc(sd.note)}` : ""}<div>${await thumbs([...(sd.photos || []), sd.pos_photo])}</div>
      <h2>OT</h2>${ot} ชม. ${sd.ot_approved_at ? '<span class="ok">รับรองแล้ว</span>' : ot > 0 ? `<button class="btn sm" id="ot">รับรอง OT</button>` : ""}
      <a class="btn sm" href="approve.html">อนุมัติใบสั่ง</a></div>`
      + (edit ? `<div class="card"><h2>แก้ไข (เหลือสด / เหลือสุก / เสีย)</h2>${lines}
      <div class="row"><div style="flex:1">เงินควรมี</div><input id="ce" class="ed" style="width:110px!important" type="number" value="${sd.cash_expected ?? ""}"></div>
      <div class="row"><div style="flex:1">นับได้</div><input id="cn" class="ed" style="width:110px!important" type="number" value="${sd.cash_counted ?? ""}"></div>
      <textarea id="nt" rows="2">${esc(sd.note)}</textarea><button class="btn primary sm" id="sv">บันทึก</button> <span id="sm" class="muted"></span></div>` : "");
  }
  function wire(d, redraw) {
    if ($("ot")) $("ot").onclick = async () => { const { error } = await supabase.rpc("approve_ot", { d }); if (error) return alert(error.message); redraw(); };
    if ($("sv")) $("sv").onclick = async () => {
      const num = (v) => v === "" ? null : +v; let err = null;
      for (const r of document.querySelectorAll("[data-p]")) {
        const u = {}; r.querySelectorAll("input").forEach((i) => u[i.dataset.f] = i.dataset.f === "waste" ? +i.value || 0 : num(i.value));
        const { error } = await supabase.from("stock_lines").update(u).eq("date", d).eq("product_id", r.dataset.p); err = err || error;
      }
      const { error } = await supabase.from("shop_days").update({ cash_expected: num($("ce").value), cash_counted: num($("cn").value), note: $("nt").value || null }).eq("date", d);
      $("sm").textContent = (err || error) ? "ไม่สำเร็จ: " + (err || error).message : "บันทึกแล้ว"; $("sm").className = (err || error) ? "err" : "ok";
    };
  }
  const V = {
    async today() { $("bar").innerHTML = ""; const d = bkk(); $("out").innerHTML = await dayCard(d); wire(d, V.today); },
    async hist() {
      if (!$("pd")) $("bar").innerHTML = `<input id="pd" type="date" value="${bkk(-1)}" max="${bkk()}" style="width:100%;padding:12px;font-size:19px">`;
      const go = async () => { $("out").innerHTML = await dayCard($("pd").value, true); wire($("pd").value, go); };
      $("pd").onchange = go; await go();
    },
    async iss() {
      $("bar").innerHTML = "";
      const { data } = await supabase.from("issues").select("*").in("status", ["open", "ack"]).order("created_at", { ascending: false });
      $("out").innerHTML = (await Promise.all((data || []).map(async (i) => `<div class="card"><b>${TYPE[i.type] || esc(i.type)}</b> <span class="pill">${i.status === "ack" ? "รับทราบแล้ว" : "ใหม่"}</span>
        <div>${esc(i.text)}</div><div class="muted">${esc(names[i.created_by] || "-")} · ${dt(i.created_at)}</div><div>${await thumbs(i.photos)}</div>
        ${i.status === "open" ? `<button class="btn sm" data-i="${i.id}" data-s="ack">รับทราบ</button>` : ""}<button class="btn sm" data-i="${i.id}" data-s="closed">ปิดเรื่อง</button></div>`))).join("") || '<p class="muted">ไม่มีเรื่องค้าง</p>';
      $("out").onclick = async (e) => {
        const b = e.target.closest("button[data-i]"); if (!b) return;
        const u = b.dataset.s === "ack" ? { status: "ack", ack_by: me.userId, ack_at: new Date().toISOString() } : { status: "closed" };
        const { error } = await supabase.from("issues").update(u).eq("id", b.dataset.i); if (error) return alert(error.message); V.iss();
      };
    },
    async mon() {
      $("bar").innerHTML = `<input id="pm" type="month" value="${bkk().slice(0, 7)}" style="width:100%;padding:12px;font-size:19px">`;
      const go = async () => {
        const [y, m] = $("pm").value.split("-").map(Number); if (!y) return;
        const next = m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`;
        const [{ data: s, error }, { data: days }] = await Promise.all([supabase.rpc("month_summary", { y, m }),
          supabase.from("shop_days").select("opened_by").gte("date", $("pm").value + "-01").lt("date", next)]);
        if (error) { $("out").innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
        const r = (Array.isArray(s) ? s[0] : s) || {};
        const L = [["วันที่เปิดร้าน", r.days_worked], ["วันที่ส่งปิดร้าน", r.days_closed_sent], ["วันหยุด", r.days_holiday], ["OT (ชม.)", r.ot_hours], ["OT ที่รับรองแล้ว (ชม.)", r.ot_approved_hours], ["ของเสียรวม", r.waste_total], ["เงินขาดรวม", r.cash_short_total], ["วันที่ CPF ส่งขาด", r.cpf_short_days]];
        const cnt = {}; (days || []).forEach((x) => { if (x.opened_by) cnt[x.opened_by] = (cnt[x.opened_by] || 0) + 1; });
        $("out").innerHTML = `<div class="card"><table>${L.map(([k, v]) => `<tr><td>${k}</td><td>${v ?? 0}</td></tr>`).join("")}</table></div>
          <h2>วันทำงานรายคน</h2><div class="card"><table>${Object.entries(cnt).map(([u, n]) => `<tr><td>${esc(names[u] || u)}</td><td>${n} วัน</td></tr>`).join("") || '<tr><td class="muted">ไม่มีข้อมูล</td></tr>'}</table></div>`;
      };
      $("pm").onchange = go; await go();
    },
  };
  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); $("out").innerHTML = ""; V[b.dataset.t](); };
  V.today();
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เกิดข้อผิดพลาด: " + e.message; } });
</script></body></html>
