</div>

<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const U = window.UxOwner, esc = U.esc;
  const { supabase, me } = await App.ready();
  if (me.role !== "owner" && me.role !== "manager") { $("blocked").hidden = false; $("blocked").textContent = "หน้านี้สำหรับเจ้าของ"; return; }
  // round 6: a manager gets วัน + ปัญหา only (no month money, no number edits, no โอที) · the DB refuses those anyway
  const MGR = me.role === "manager";
  if (MGR) document.querySelectorAll('.tabs [data-t="mon"], .tabs.sk button:last-child').forEach((b) => b.remove());
  $("app").hidden = false; $("tabs").hidden = false;
  const TODAY = U.today();
  const hm = (t) => t ? new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" }) : "-";
  const when = (d) => d === TODAY ? "วันนี้" : d === U.plus(TODAY, -1) ? "เมื่อวาน" : U.dayName(d);
  const names = Object.fromEntries(((await supabase.from("user_public").select("id,name")).data || []).map((u) => [u.id, u.name]));
  const P = (await supabase.from("product_names").select("id,name,unit")).data || [];
  const prods = Object.fromEntries(P.map((p) => [p.id, p.name])), unit = Object.fromEntries(P.map((p) => [p.id, UXM.unit(p.unit)]));
  const remindAt = String(((await supabase.from("settings").select("key,value").eq("key", "remind_at").maybeSingle()).data || {}).value || "20:30");
  const TYPE = { waste: "ของเสีย/หมดอายุ", equipment: "เครื่องพัง", customer: "ลูกค้าร้องเรียน", cpf: "ของ CPF มาผิด", edit_request: "กรอกผิด ขอแก้", other: "เรื่องอื่น" };
  const CS = { low: "ใกล้หมด", out: "หมด" };
  const money = (n) => n == null ? "-" : Number(n).toLocaleString("th-TH");
  const baht = (n) => n == null ? "-" : money(n) + " บาท";
  const thumbs = async (ps) => (await Promise.all((ps || []).filter(Boolean).map(async (p) => { try { return `<img class="th" alt="รูปจากร้าน" src="${await Photo.url(supabase, p)}">`; } catch { return ""; } }))).join("");
  document.addEventListener("click", (e) => { const im = e.target.closest("img.th"); if (im) Photo.view(im.src); });
  // skeletons (รอบ 2): grey shapes in the tab's own boxes until its data arrives · same shapes as the static one in the HTML
  const sb = (w, h, x = "") => `<i class="sk-b" style="--w:${w};--h:${h}px${x}"></i>`;
  const SK_TODO = `<div class="card todo">${sb("62%", 18)}${sb("84%", 14, ";--gap:8px")}<div class="acts sk-row">${sb("calc(50% - 4px)", 44, ";--r:12px")}${sb("calc(50% - 4px)", 44, ";--r:12px")}</div></div>`;
  const SK = {
    day: `<span class="vh">กำลังเปิด…</span><div class="bento trio">${`<div class="bt">${sb("70%", 13)}${sb("62%", 20, ";--gap:6px")}${sb("84%", 12, ";--gap:6px")}${sb("60%", 12, ";--gap:5px")}</div>`.repeat(3)}</div><h3 class="sec">${sb("38%", 15)}</h3>${SK_TODO.repeat(2)}`,
    iss: `<span class="vh">กำลังเปิด…</span>` + `<div class="card iss"><div class="day-head sk-row">${sb("42%", 18)}${sb("64px", 22, ";--r:999px")}</div>${sb("90%", 15, ";--gap:12px")}${sb("50%", 14, ";--gap:10px")}<div class="sk-row" style="margin-top:14px">${sb("96px", 44, ";--r:12px")}${sb("96px", 44, ";--r:12px")}</div></div>`.repeat(3),
    mon: `<span class="vh">กำลังเปิด…</span><div class="card">${`<div class="sk-row" style="justify-content:space-between;padding:14px 2px">${sb("42%", 15)}${sb("22%", 15)}</div>`.repeat(8)}</div>`,
  };
  const SKB = { iss: `<div class="chips sk-row">${sb("78px", 44, ";--r:999px").repeat(3)}</div>` };
  const EMPTY = (t, m = "") => `<div class="empty tight"><img class="mascot sm" src="img/mascot-240.png" alt="" width="56" height="56"><p>${t}</p>${m ? `<p class="muted">${m}</p>` : ""}</div>`;
  const ALLDONE = EMPTY("ไม่มีเรื่องต้องจัดการ", "ร้านเรียบร้อยดี");

  // ---- state: ?d=YYYY-MM-DD · ?tab=day|iss|month (LINE cards deep-link here) ----
  const q = new URLSearchParams(location.search);
  let D = /^\d{4}-\d{2}-\d{2}$/.test(q.get("d") || "") && q.get("d") <= TODAY ? q.get("d") : TODAY;
  let TAB = { iss: "iss", month: MGR ? "day" : "mon", mon: MGR ? "day" : "mon" }[q.get("tab")] || "day";
  let CHIP = "open";
  const sync = () => {
    const p = new URLSearchParams();
    if (TAB !== "day") p.set("tab", TAB === "mon" ? "month" : TAB);
    if (TAB === "day" && D !== TODAY) p.set("d", D);
    try { history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : "")); } catch (_) { /* LIFF webview without history: fine */ }
  };
  // ง2: "อัปเดต HH:MM น." under the bar · tap = load this tab again (pending undo jobs commit first so the reload sees them)
  const stamp = () => { $("upd").hidden = false; $("upd").disabled = false; $("upd").textContent = `อัปเดต ${hm(new Date())} น. แตะเพื่อโหลดใหม่`; };
  const show = async (t) => { await UXM.flush(); TAB = t; document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.t === t)); $("out").innerHTML = SK[t] || ""; $("bar").innerHTML = SKB[t] || ""; sync(); await V[t](); stamp(); };
  $("upd").onclick = () => { $("upd").disabled = true; $("upd").textContent = "กำลังโหลดใหม่…"; $("bar").onclick = null; $("out").onclick = null; show(TAB); };

  // ---- day ----
  let ctx = null; // last loaded day (used by the edit panel)
  async function loadDay(d) {
    const isToday = d === TODAY;
    const res = await Promise.all([
      supabase.from("shop_days").select("*").gte("date", U.plus(d, -7)).lte("date", d).order("date", { ascending: false }),
      supabase.from("stock_lines").select("*").eq("date", d),
      supabase.from("consumable_checks").select("product_id,status").eq("date", d).neq("status", "ok"),
      supabase.from("orders").select("order_items(product_id,qty_proposed,qty_final,qty_received,received_at)").eq("for_date", d).eq("status", "sent").maybeSingle(),
      supabase.from("issues").select("id,date,type,text,photos,created_by,created_at,status").eq("status", "open").order("created_at", { ascending: false }),
      isToday ? supabase.from("leave_requests").select("id,user_id,date,type,note,status,users:user_public(name)").gte("date", TODAY.slice(0, 8) + "01").lte("date", U.plus(TODAY, 31)).order("date") : Promise.resolve({ data: [] }),
    ]);
    const bad = res.find((r) => r.error); if (bad) throw bad.error; // qa: a failed read must not read as "ไม่มีเรื่องต้องจัดการ"
    const [{ data: days }, { data: sl }, { data: cc }, { data: od }, { data: iss }, { data: lv }] = res;
    const byDate = Object.fromEntries((days || []).map((x) => [x.date, x]));
    return { d, isToday, sd: byDate[d] || null, yday: byDate[U.plus(d, -1)] || null, days: days || [], sl: sl || [], cc: cc || [], items: od?.order_items || [],
      iss: (iss || []).filter((i) => i.status === "open" && (isToday || (i.date || "").slice(0, 10) === d)), lv: lv || [] };
  }
  const cashOf = (s) => s && s.cash_expected != null && s.cash_counted != null ? s.cash_counted - s.cash_expected : null;

  function todos(c) {
    const T = [];
    for (const i of c.iss) {
      const n = (i.photos || []).filter(Boolean).length, line = String(i.text || "").split("\n")[0];
      T.push({ r: 0, bad: 1, at: i.created_at, key: "i" + i.id,
        t: TYPE[i.type] || esc(i.type), b: esc(line.length > 80 ? line.slice(0, 80) + "…" : line),
        s: `${esc(names[i.created_by] || "-")} · ${(i.date || "").slice(0, 10) !== c.d ? when((i.date || "").slice(0, 10)) + " " : ""}${hm(i.created_at)} น.${n ? ` · มีรูป ${n} รูป` : ""}`,
        a: `${n ? `<button class="btn sm" data-a="photos" data-i="${i.id}">ดูรูป</button>` : ""}<button class="btn sm" data-a="ack" data-i="${i.id}">รับทราบ</button>` });
    }
    for (const s of [c.sd, c.isToday ? c.yday : null].filter(Boolean)) {
      const x = cashOf(s); if (x == null || x >= 0) continue;
      T.push({ r: 1, bad: 1, at: s.date, key: "c" + s.date, t: `${when(s.date)} เงินสดขาด ${baht(-x)}`, s: `ควรมี ${baht(s.cash_expected)}<br>นับได้ ${baht(s.cash_counted)}`,
        a: s.date !== c.d ? `<button class="btn sm go" data-a="go" data-d="${s.date}">ดู${when(s.date)}</button>` : "" });
    }
    const short = c.items.filter((i) => i.received_at != null && (+i.qty_received || 0) < (+(i.qty_final ?? i.qty_proposed) || 0));
    if (short.length) T.push({ r: 2, bad: 1, key: "g", t: `ของมาไม่ครบ ขาด ${short.length} รายการ`, s: esc(short.slice(0, 3).map((i) => prods[i.product_id]).join(" · ") + (short.length > 3 ? " …" : "")),
      a: `<button class="btn sm go" data-a="recv">ดูที่ขาด</button>` });
    for (const l of c.lv.filter((l) => l.status === "pending" && l.date >= TODAY)) {
      const off = c.lv.filter((x) => x.user_id === l.user_id && x.status === "approved" && x.date.slice(0, 7) === l.date.slice(0, 7)).length;
      T.push({ r: 3, at: l.date, key: "l" + l.id, t: `${esc(l.users?.name || names[l.user_id] || "-")} ${U.LEAVE[l.type] || esc(l.type)} ${U.dayName(l.date)}`,
        b: l.note ? esc(l.note) : "", s: `เดือนนั้นหยุดแล้ว ${off} วัน`,
        a: `<button class="btn sm" data-a="leave" data-ok="0" data-i="${l.id}">ไม่อนุมัติ</button><button class="btn sm" data-a="leave" data-ok="1" data-i="${l.id}">อนุมัติ</button>` });
    }
    const ot = MGR ? [] : c.days.filter((s) => +s.ot_hours > 0 && !s.ot_approved_at && (c.isToday ? s.date >= U.plus(c.d, -7) && s.date <= c.d : s.date === c.d)).sort((a, b) => a.date.localeCompare(b.date));
    if (ot.length === 1) { const s = ot[0];
      T.push({ r: 4, at: s.date, key: "o" + s.date, t: `${when(s.date)} โอที ${+s.ot_hours} ชม.`, s: s.closed_at ? `ปิดร้าน ${hm(s.closed_at)} น. · ${esc(names[s.closed_by] || "-")}` : "ยังไม่ปิดร้าน",
        a: `<button class="btn sm" data-a="ot" data-d="${s.date}">อนุมัติโอที</button>` }); }
    // several days waiting → one card, one press (approve_ot per day)
    if (ot.length > 1) T.push({ r: 4, at: ot[0].date, key: "o", t: `โอทีรออนุมัติ ${ot.length} วัน รวม ${ot.reduce((n, s) => n + +s.ot_hours, 0)} ชม.`,
      s: `${U.short(ot[0].date)} – ${U.short(ot[ot.length - 1].date)}`, a: `<button class="btn sm" data-a="ot" data-d="${ot.map((s) => s.date).join(",")}">อนุมัติโอทีทั้ง ${ot.length} วัน</button>` });
    return T.sort((a, b) => a.r - b.r || String(a.at || "").localeCompare(String(b.at || "")));
  }

  // trio (Mos 23 ต.ค. รอบ 2): เงินสด / ของขาด / สถานะร้าน in one row · the to-do list sits right under it (no "ต้องจัดการ N" tile)
  // narrow tiles: each meta part on its own line instead of a dot
  function bento(c) {
    const { sd, items, isToday } = c;
    const tile = (cls, k, v, m, a) => `<${a ? `button type="button" data-a="${a}"` : "div"} class="bt ${cls}"><span class="k"><i class="dot" aria-hidden="true"></i>${k}</span><span class="v">${v}</span>${m ? `<span class="m">${m}</span>` : ""}</${a ? "button" : "div"}>`;
    const x = cashOf(sd);
    const cash = !sd ? tile("", "เงินสด", "-", "ไม่มีบันทึก") : x == null ? tile("", "เงินสด", "ยังไม่นับ", "")
      : tile(x < 0 ? "bad" : "ok", "เงินสด", x < 0 ? `ขาด ${money(-x)} <small>บาท</small>` : x > 0 ? `เกิน ${money(x)} <small>บาท</small>` : "ครบ", `นับได้ ${baht(sd.cash_counted)}`);
    const recvd = items.filter((i) => i.received_at != null), short = recvd.filter((i) => (+i.qty_received || 0) < (+(i.qty_final ?? i.qty_proposed) || 0));
    const rAt = recvd.length ? hm(recvd.map((i) => i.received_at).sort()[0]) : "", fold = sd && items.length ? "recv" : "";
    const recv = !items.length ? tile("", "ของขาด", "ไม่มีใบสั่ง", "")
      : !recvd.length ? tile(isToday ? "wait" : "", "ของขาด", "ยังไม่รับของ", `ใบสั่ง ${items.length} รายการ`, fold)
      : short.length ? tile("bad", "ของขาด", `${short.length} <small>รายการ</small>`, `รับของ ${rAt} น.`, fold) : tile("ok", "ของขาด", "ครบ", `${items.length} รายการ<br>รับ ${rAt} น.`, fold);
    const ot = sd && +sd.ot_hours ? `<br>โอที ${+sd.ot_hours} ชม.` : "";
    const shop = sd?.status === "holiday" ? tile("", "สถานะร้าน", "ร้านหยุด", "")
      : sd?.closed_at ? tile("ok", "สถานะร้าน", `ปิด ${hm(sd.closed_at)}`, esc(names[sd.closed_by] || "-") + ot)
      : sd?.opened_at ? tile(isToday ? "wait" : "bad", "สถานะร้าน", isToday ? "เปิดอยู่" : "ไม่ได้ปิดในแอป", `เปิด ${hm(sd.opened_at)}<br>${esc(names[sd.opened_by] || "-")}${ot}`)

  const undoable = (card, text, call) => { card.querySelectorAll("button").forEach((x) => x.disabled = true); gone(card);

      if (e.target.closest("#ackall")) { const list = all.filter((i) => i.status === "open"); return change(list, ackU(), `รับทราบแล้ว ${list.length} เรื่อง`); }
      const b = e.target.closest("button[data-i]"); if (!b) return;
      const i = all.find((x) => String(x.id) === b.dataset.i); if (!i) return;
      change([i], b.dataset.s === "ack" ? ackU() : { status: "closed" }, b.dataset.s === "ack" ? "รับทราบแล้ว" : "ปิดเรื่องแล้ว");
    };
    await draw();
  }

  const V = {
    day: dayView,
    iss: issView,
    // round 4: every number that has days behind it opens them · a day opens the day view · ร้านหยุด → holiday · ต้นทุน/กำไร of the same month
    async mon() {
      $("bar").innerHTML = `<input id="pm" type="month" value="${TODAY.slice(0, 7)}" max="${TODAY.slice(0, 7)}" aria-label="เลือกเดือน">`;
      const go = async () => {
        const ym = $("pm").value, [y, m] = ym.split("-").map(Number); if (!y) return;
        const first = ym + "-01", next = m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`, inM = (d) => String(d || "").slice(0, 7) === ym;
        const [{ data: s, error }, { data: days }, { data: wl }, { data: od }] = await Promise.all([supabase.rpc("month_summary", { y, m }),
          supabase.from("shop_days").select("date,status,opened_at,opened_by,cash_expected,cash_counted").gte("date", first).lt("date", next).order("date"),
          supabase.from("stock_lines").select("date,waste").gte("date", first).lt("date", next).gt("waste", 0),
          supabase.from("orders").select("for_date,order_items(qty_proposed,qty_final,qty_received)").gte("for_date", first).lt("for_date", next)]);
        if (error) { $("out").innerHTML = `<p class="err">เปิดไม่ขึ้น: ${esc(App.errText(error))}</p>`; return; }
        const r = (Array.isArray(s) ? s[0] : s) || {};
        const D0 = (days || []).filter((x) => inM(x.date));
        // day lists behind the numbers (same rules as month_summary) · newest first
        const openD = D0.filter((x) => x.opened_at && x.status === "open" && x.date < TODAY).map((x) => [x.date]); // opened, never closed in the app
        const cashD = D0.map((x) => [x.date, -cashOf(x)]).filter(([, v]) => v > 0);
        const wasteD = {}; (wl || []).filter((l) => inM(l.date) && +l.waste > 0).forEach((l) => { wasteD[l.date] = (wasteD[l.date] || 0) + 1; });
        const shortD = {}; (od || []).filter((o) => inM(o.for_date)).forEach((o) => { const n = (o.order_items || []).filter((i) => i.qty_received != null && +i.qty_received < +(i.qty_final ?? i.qty_proposed)).length; if (n) shortD[o.for_date] = (shortD[o.for_date] || 0) + n; });
        const day = (d, v) => `<button type="button" class="ux-mday" data-day="${d}"><span>${U.dayName(d)}</span><span class="v">${v}</span><span class="go" aria-hidden="true">›</span></button>`;
        const newest = (a) => a.sort((x, z) => z[0].localeCompare(x[0]));
        const val = (v, u, bad) => `<span class="v${bad && v ? " bad" : ""}">${money(v ?? 0)} ${u}</span>`;
        const plain = (k, v, u) => `<div class="ux-mrow"><span>${k}</span>${val(v, u)}</div>`;
        const drill = (id, k, v, u, list) => list.length ? `<button class="fold ux-mrow" aria-expanded="false" data-f="${id}"><span>${k}</span>${val(v, u, 1)}</button><div class="fold-body"><div>${list.join("")}</div></div>` : plain(k, v, u);
        const cnt = {}; D0.forEach((x) => { if (x.opened_by) cnt[x.opened_by] = (cnt[x.opened_by] || 0) + 1; });
        const mn = `${U.MON[m - 1]} ${y + 543}`;
        $("out").innerHTML = `<div class="card folds ux-mon">`
          + plain("เปิดร้าน", r.days_worked, "วัน") + plain("ปิดร้านในแอป", r.days_closed_sent, "วัน")
          + (openD.length ? drill("open", "เปิดแต่ไม่ได้ปิดในแอป", openD.length, "วัน", newest(openD).map(([d]) => day(d, "ดูวันนั้น"))) : "")
          + `<a class="ux-mrow" href="holiday.html"><span>ร้านหยุด<small>ดูวันหยุดและวันลา</small></span><span class="v">${money(r.days_holiday ?? 0)} วัน</span><span class="go" aria-hidden="true">›</span></a>`
          + plain("โอที", r.ot_hours, "ชม.") + plain("โอทีที่อนุมัติแล้ว", r.ot_approved_hours, "ชม.")
          + drill("cash", "เงินสดขาดรวม", r.cash_short_total, "บาท", newest(cashD).map(([d, v]) => day(d, `ขาด ${money(v)} บาท`)))
          + drill("waste", "ของเสียรวม", r.waste_total, "หน่วย", newest(Object.entries(wasteD)).map(([d, n]) => day(d, `เสีย ${n} อย่าง`)))
          + drill("short", "วันที่ของมาไม่ครบ", r.cpf_short_days, "วัน", newest(Object.entries(shortD)).map(([d, n]) => day(d, `ขาด ${n} รายการ`)))
          + `</div><a class="btn tonal ux-costs" href="costs.html?m=${ym}">ดูต้นทุน/กำไร ${mn}</a>`
          + `<h2>ใครเปิดร้านกี่วัน</h2><div class="card"><table>${Object.entries(cnt).map(([u, n]) => `<tr><td>${esc(names[u] || u)}</td><td>${n} วัน</td></tr>`).join("") || '<tr><td class="muted">ยังไม่มีใครเปิดร้าน</td></tr>'}</table></div>`;
        U.folds($("out").querySelector(".ux-mon"));
      };
      $("out").onclick = (e) => { const b = e.target.closest("button[data-day]"); if (b && TAB === "mon") { D = b.dataset.day; show("day"); } };
      $("pm").onchange = go; await go();
    },
  };
  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b || b.dataset.t === TAB) return; $("bar").onclick = null; $("out").onclick = null; show(b.dataset.t); };
  await show(TAB);
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
