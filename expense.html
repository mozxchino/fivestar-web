<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายจ่าย</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css?v=r1101"><link rel="stylesheet" href="lib/ux-data.css">
<style>
/* 0070 (Mos 31 ต.ค. แบบ MKT): find a remembered name → sheet → amount + who paid · tabs like waste.html */
.pg-exp .tabs button b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; font: 600 12px/1 var(--font-head); font-variant-numeric: tabular-nums; color: #fff; background: var(--color-primary); }
.pg-exp .tabs button b:empty { display: none; }
.el { padding: 4px 16px; }
.el .it { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.el .it + .it, .el h3 + .it { border-top: .5px solid var(--color-separator); }
.el h3 + .it { border-top: 0; }
.el .it .grow { flex: 1; min-width: 0; }
.el .it .grow b { display: block; font-weight: 500; }
.el .it .grow small { display: block; font-size: 14px; color: var(--color-ink-soft); font-variant-numeric: tabular-nums; }
.el .it .amt { flex: none; font: 500 17px/1.2 var(--font-head); font-variant-numeric: tabular-nums; }
.el .it .go { flex: none; color: var(--color-ink-soft); font-size: 22px; }
.el .it.add .grow b { color: var(--color-primary-dark); }
.el .del { flex: none; width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; font-size: 18px; color: var(--color-ink-soft); cursor: pointer; }
.el h3.day { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.el h3.day > span:first-of-type { flex: 1; }
.el h3.sec { margin: 18px 0 4px; font: 600 17px/1.35 var(--font-head); color: var(--color-foreground); } /* design round 1 พ.ย.: a heading, not grey small print */
.sum { padding: 12px 16px; }
.sum .tot { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; font: 600 17px/1.3 var(--font-head); font-variant-numeric: tabular-nums; }
.sum .tot > :last-child { font-size: 30px; line-height: 1.15; } /* the month total is the one number to see first */
.sum .kv b { font-variant-numeric: tabular-nums; }
.sum hr { border: 0; border-top: .5px solid var(--color-separator); margin: 6px 0; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pg-exp .in > #q { -webkit-appearance: none; appearance: none; border: 0; border-radius: 0; padding: 0 14px; font-size: 17px; text-align: left; }
.pg-exp .in > #q::-webkit-search-decoration { -webkit-appearance: none; }
#es .body label.fl { display: block; margin: 14px 0 0; font-weight: 500; }
#es .body .seg { margin-top: 6px; }
/* design round 1 พ.ย. (Mos: "จืดมาก"): shadcn Item with a media icon per category · a share bar like a shadcn stacked chart ·
   the month total counts up once (Magic UI number-ticker idea, plain JS, off for reduced motion) */
[data-c=raw] { --ci: #9A6200; --cb: #FFF1D6; } [data-c=supply] { --ci: #2F6DB5; --cb: #E6F0FB; } [data-c=gas] { --ci: #C2410C; --cb: #FDE8E2; }
[data-c=fee] { --ci: #2A7A4B; --cb: #E3F3E8; } [data-c=other] { --ci: #4B5563; --cb: #ECEEF1; } [data-c=fixed] { --ci: #7A4E9C; --cb: #F1E9F7; } [data-c=new] { --ci: var(--color-primary); --cb: var(--tint-primary); }
.ci { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--ci); background: var(--cb); }
.ci svg { width: 22px; height: 22px; }
.sum .tot { flex-wrap: wrap; }
.sum .tot b { font: inherit; }
.sum .bar { display: flex; gap: 3px; height: 12px; margin: 4px 0 10px; border-radius: 6px; overflow: hidden; }
.sum .bar i { min-width: 6px; background: var(--ci); }
.sum .kv { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.sum .kv > span { flex: 1; display: flex; align-items: center; gap: 10px; }
.sum .kv > span::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--ci, transparent); }
.sum .kv small { min-width: 40px; text-align: right; font-size: 14px; color: var(--color-ink-soft); font-variant-numeric: tabular-nums; }
.sum .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.sum .pay > div { padding: 10px 12px; border-radius: 12px; background: var(--color-fill); }
.sum .pay small { display: block; font-size: 14px; color: var(--color-ink-soft); }
.sum .pay b { font: 600 19px/1.3 var(--font-head); font-variant-numeric: tabular-nums; }
.sum .pay > .cash { background: var(--tint-success); } .sum .pay > .cash small, .sum .pay > .cash b { color: var(--color-success); }
.el .it .grow small:has(.pill) { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 2px; white-space: nowrap; }
.el .it .grow small .pill { padding-block: 1px; }
/* round 3 (Mos: aim for 9.5): tiles 3 a row so the list fits one screen · "ลงล่าสุด" chips with the last amount ·
   summary rows filter the list · last month for scale · a door to ต้นทุน/กำไร */
#items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 4px 12px 12px; }
#items > h3 { grid-column: 1 / -1; margin-inline: 0; }
#items .it { border-top: 0; }
#items .it.tile { flex-direction: column; justify-content: center; gap: 6px; min-height: 100px; padding: 10px 6px; border-radius: 14px; background: var(--color-card); box-shadow: inset 0 0 0 1px var(--color-separator); text-align: center; transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out); }
#items .it.tile:active { transform: scale(.97); background: var(--color-fill); }
#items .it.tile b { font: 500 15px/1.3 var(--font-body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
#items .it.tile small { font-size: 12px; color: var(--ci); font-weight: 600; }
#items .it.tile.new { box-shadow: inset 0 0 0 1.5px var(--color-field-edge); background: var(--color-fill); }
#items .it.tile.new b { color: var(--color-primary-dark); }
#items .it.add { grid-column: 1 / -1; }
.recent { margin: 12px 0 12px; }
.recent h3 { margin: 0 4px 6px; font: 600 15px/1.3 var(--font-head); color: var(--color-foreground); }
.recent .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.recent .row::-webkit-scrollbar { display: none; }
.recent button { flex: none; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 14px 8px 8px; border: 0; border-radius: 14px; background: var(--color-card); box-shadow: var(--shadow-raised, 0 1px 2px rgba(32, 24, 24, .06)); font: inherit; color: inherit; text-align: left; cursor: pointer; touch-action: manipulation; transition: transform 160ms var(--ease-out); }
.recent button:active { transform: scale(.97); }
.recent button .ci { width: 36px; height: 36px; border-radius: 10px; }
.recent button .ci svg { width: 20px; height: 20px; }
.recent button b { display: block; font-weight: 500; white-space: nowrap; }
.recent button small { display: block; font-size: 13px; color: var(--color-ink-soft); font-variant-numeric: tabular-nums; }
.sum .cmp { margin: -4px 0 8px; font-size: 14px; color: var(--color-ink-soft); font-variant-numeric: tabular-nums; }
.sum .cmp b { font-weight: 600; } .sum .cmp b.up { color: var(--on-wait); } .sum .cmp b.down { color: var(--color-success); }
.sum button.kv { width: 100%; margin: 0 -8px; padding: 0 8px; width: calc(100% + 16px); border: 0; border-radius: 10px; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; touch-action: manipulation; }
.sum button.kv[aria-pressed=true] { background: var(--cb); }
.sum button.kv[aria-pressed=true] b { color: var(--ci); }
.only { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 8px; font-size: 14px; color: var(--color-ink-soft); }
.only button { min-height: 44px; padding: 0 4px; border: 0; background: none; font: 500 14px/1 var(--font-body); color: var(--color-primary-dark); cursor: pointer; }
.go-costs { margin-top: 10px; }
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head><body class="pg-exp pg-fill" ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>รายจ่าย</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></header>
<p id="blocked" class="err" hidden></p>
<div class="tabs sk" aria-hidden="true"><button class="on" tabindex="-1">ลงรายจ่าย</button><button tabindex="-1">ลงแล้ว</button></div>
<div class="sk"><span class="vh">กำลังเปิด…</span><i class="sk-b" style="--w:100%;--h:52px;--r:12px"></i><i class="sk-b" style="--w:100%;--h:240px;--r:14px"></i></div>
<div id="form" class="ld" hidden>
  <div class="tabs" id="tabs" role="tablist" aria-label="รายจ่าย"><button type="button" role="tab" data-t="new" class="on" aria-selected="true">ลงรายจ่าย</button><button type="button" role="tab" data-t="list" aria-selected="false" id="tList">ลงแล้ว<b id="cnt"></b></button></div>
  <div id="pNew" role="tabpanel">
    <p class="fhint">จ่ายเงินแล้วลงเลย<br>บิล CPF กับเงินเดือน แอปคิดให้ ไม่ต้องลง</p>
    <div class="recent" id="recent" hidden></div>
    <div class="in"><input id="q" type="search" enterkeyhint="search" placeholder="ค้นหา หรือพิมพ์ชื่อใหม่" autocomplete="off" aria-label="ค้นหารายการ"></div>
    <div class="card el" id="items"></div>
  </div>
  <div id="pList" role="tabpanel" hidden></div>
  <dialog id="es" class="bsheet" aria-labelledby="esH"><div class="body"><div class="grab"></div>
    <div class="hd"><b id="esH"></b><button class="x" type="button" aria-label="ปิด">✕</button></div>
    <div id="fCat" hidden><label class="fl">หมวด</label><div class="cats" id="cats"></div></div>
    <div id="fQty" hidden><label class="fl" for="qty" id="qtyL">ได้มากี่</label><div class="in"><input id="qty" type="number" inputmode="decimal" placeholder="0"><span class="sfx" id="qtyU"></span></div></div>
    <label class="fl" for="amt">ยอดเงิน</label><div class="in"><input id="amt" type="number" inputmode="decimal" placeholder="0"><span class="sfx">บาท</span></div><p id="amtH" class="muted" hidden>ยอดครั้งก่อน ใส่ไว้ให้ แก้ได้</p>
    <label class="fl">จ่ายด้วย</label><div class="seg" id="paid"><button type="button" data-p="cash">เงินสดหน้าร้าน</button><button type="button" data-p="owner">เจ้าของโอนจ่าย</button></div>
    <div id="fDate" hidden><label class="fl" for="dt">วันที่จ่าย</label><input id="dt" type="date"></div>
    <label class="btn" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>ถ่ายรูปใบเสร็จ (ไม่บังคับ) <input id="ph" type="file" accept="image/*" capture="environment" hidden></label>
    <p id="phS" class="muted"></p></div>
    <div class="foot"><button id="save" class="btn primary" type="button">บันทึกรายจ่าย</button><p id="msg" class="muted"></p></div></dialog>
</div>
<script>
(async () => {
  const { supabase, me } = await App.ready();
  if (UXS.only(me, ["staff", "owner"], "หน้านี้สำหรับพนักงานในร้านและเจ้าของ", "ผู้จัดการดูงานของร้านได้ที่หน้าวันนี้", "owner.html", "ไปหน้าวันนี้")) return;
  const OWN = me.role === "owner", esc = UXS.esc;
  const CAT = { raw: "วัตถุดิบ", supply: "ของใช้", gas: "แก๊ส", fee: "ค่าธรรมเนียม", other: "ซ่อม/อื่นๆ", fixed: "ค่าคงที่รายเดือน" }, KEYS = Object.keys(CAT);
  const PAID = { cash: "เงินสดหน้าร้าน", owner: "เจ้าของโอนจ่าย" }, PAY_S = { cash: "เงินสด", owner: "เจ้าของโอน" }; // PAY_S: row grey line stays one line
  // lucide icons, one per category (shadcn Item media)
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICO = { raw: svg('<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>'),
    supply: svg('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
    gas: svg('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),
    fee: svg('<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>'),
    other: svg('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'),
    fixed: svg('<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>'),
    new: svg('<path d="M5 12h14"/><path d="M12 5v14"/>') };
  // ลงล่าสุด: per-phone memory of the last amount per item (localStorage, may be empty in private mode)
  const LK = "fs_exp_last_v1", keyOf = (x) => x.pid ? "p" + x.pid : x.iid ? "i" + x.iid : "n" + x.name;
  const last = () => { try { return JSON.parse(localStorage.getItem(LK)) || {}; } catch (_) { return {}; } };
  const remember = (x, a) => { try { const L = last(); L[keyOf(x)] = { a, t: Date.now() }; localStorage.setItem(LK, JSON.stringify(L)); } catch (_) {} };
  const ci = (c) => `<span class="ci" data-c="${c}">${ICO[c] || ICO.other}</span>`;
  // Magic UI number-ticker idea: the total counts up once when the list is on screen · reduced motion = the number as is
  // review-animations: 400 ms, once per month shown (not on every tab switch or after a delete)
  let ticked = "";
  const tick = () => { const el = pList.querySelector(".tick"); if (!el || pList.hidden || ticked === ym) return; ticked = ym; if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const n = +el.dataset.n, t0 = performance.now(), f = (t) => { const p = Math.min(1, (t - t0) / 400); el.textContent = p < 1 ? Math.round(n * (1 - (1 - p) ** 3)).toLocaleString("th-TH") : n.toLocaleString("th-TH", { maximumFractionDigits: 2 }); if (p < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f); };
  const baht = (n) => (+n).toLocaleString("th-TH", { maximumFractionDigits: 2 }) + " บาท";
  const hm = (t) => new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
  const bday = new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10); // 0047: the shop day runs until 05:00 (Bangkok − 5 h)
  const stop = (t) => { blocked.hidden = false; blocked.innerHTML = t + '<br><a class="btn" href="index.html">กลับหน้าหลัก</a>'; };

  // the list = remembered names + self-bought products (ตั้งค่า › สินค้า) · CPF goods never (their cost is received × price)
  let ITEMS = [];
  const load = async () => {
    const [p, e] = await Promise.all([
      supabase.from("products").select("id,name,unit,kind,count_mode,supplier,made_here").eq("active", true).eq("supplier", "self").eq("made_here", false).in("kind", ["self", "consumable"]).order("sort"),
      supabase.from("expense_items").select("id,name,category").eq("active", true).order("name")]);
    if (p.error || e.error) throw p.error || e.error;
    ITEMS = [...p.data.map((x) => ({ pid: x.id, name: x.name, cat: x.kind === "self" ? "raw" : "supply", count: x.count_mode === "count", unit: UXM.unit(x.unit) })),
      ...e.data.map((x) => ({ iid: x.id, name: x.name, cat: x.category }))]
      .map((x, i) => ({ ...x, i })).sort((a, b) => KEYS.indexOf(a.cat) - KEYS.indexOf(b.cat) || a.i - b.i);
  };
  const draw = () => {
    // "ค่าแก๊ส" finds แก๊สปิกนิก: a leading ค่า is optional both ways
    const t = q.value.trim(), f = t.toLowerCase().replace(/^ค่า/, ""), list = ITEMS.filter((x) => !f || x.name.toLowerCase().replace(/^ค่า/, "").includes(f));
    const add = t && !ITEMS.some((x) => x.name === t) ? `<button type="button" class="it add" data-new="1">${ci("new")}<span class="grow"><b>+ เพิ่ม "${esc(t)}"</b><small>รายการใหม่ ครั้งหน้าค้นเจอเลย</small></span><span class="go" aria-hidden="true">›</span></button>` : "";
    // matches first, "+ เพิ่ม" last: a near match is picked before a duplicate name is made
    // tiles flow without category bands (a band per 1-item category left empty cells) · the icon colour is the category, the order stays by category
    items.innerHTML = (list.length ? list.map((x) => `<button type="button" class="it tile" data-k="${ITEMS.indexOf(x)}" data-c="${x.cat}">${ci(x.cat)}<b>${esc(x.name)}</b>${x.count ? `<small>+ เข้าสต็อก</small>` : ""}</button>`).join("") : "")
      + (list.length && add ? `<h3 class="sec">ไม่ใช่รายการข้างบน</h3>` : "") + add
      + (t ? "" : `<button type="button" class="it tile new" data-focus="1">${ci("new")}<b>รายการใหม่</b></button>`);
    // ลงล่าสุด: the last 4 used on this phone, with the amount paid last time
    const L = last(), rc = Object.entries(L).sort((a, b) => b[1].t - a[1].t).map(([k, v]) => [ITEMS.find((x) => keyOf(x) === k), v]).filter(([x]) => x).slice(0, 4);
    recent.hidden = !!t || !rc.length;
    recent.innerHTML = rc.length ? `<h3>ลงล่าสุด</h3><div class="row">${rc.map(([x, v]) => `<button type="button" data-k="${ITEMS.indexOf(x)}">${ci(x.cat)}<span><b>${esc(x.name)}</b><small>${baht(v.a)}</small></span></button>`).join("")}</div>` : "";
  };
  q.oninput = draw;
  recent.onclick = (e) => { const b = e.target.closest("[data-k]"); if (b) open(ITEMS[+b.dataset.k]); };

  // ---- the sheet: one expense
  const sheet = UXD.sheet(es), photo = [];
  Photo.picker(supabase, ph, { paths: photo, type: "expense", name: "รูปใบเสร็จ", max: 1, status: phS });
  let cur = null, cat = null, paidBy = null;
  const pick = (p) => { paidBy = p; paid.querySelectorAll("button").forEach((b) => { b.classList.toggle("on-ok", b.dataset.p === p); b.setAttribute("aria-pressed", b.dataset.p === p); }); };
  paid.onclick = (e) => { const b = e.target.closest("[data-p]"); if (b) pick(b.dataset.p); };
  const pickCat = (c) => { cat = c; cats.querySelectorAll("button").forEach((b) => { b.classList.toggle("on", b.dataset.c === c); b.setAttribute("aria-pressed", b.dataset.c === c); }); };
  cats.innerHTML = KEYS.map((k) => `<button type="button" class="chip" data-c="${k}" aria-pressed="false">${CAT[k]}</button>`).join("");
  cats.onclick = (e) => { const b = e.target.closest("[data-c]"); if (b) pickCat(b.dataset.c); };
  if (OWN) { fDate.hidden = false; dt.max = UXS.today(); dt.value = bday; UXM.dateTh(dt); }
  const open = (x) => {
    cur = x; esH.textContent = x.name; fCat.hidden = !x.isNew; fQty.hidden = !x.count;
    qtyL.textContent = `ได้มากี่${x.unit || "หน่วย"}`; qtyU.textContent = x.unit || "";
    pickCat(x.isNew ? null : x.cat); pick(OWN ? "owner" : "cash");   // staff mostly pay from the drawer, the owner by transfer · one tap to change
    const l = last()[keyOf(x)]; qty.value = ""; amt.value = l ? l.a : ""; amtH.hidden = !l; msg.textContent = ""; msg.className = "muted";
    es.querySelectorAll(".thumb .x").forEach((b) => b.click());
    sheet.open();
  };
  items.onclick = (e) => { const b = e.target.closest(".it"); if (!b) return; if (b.dataset.focus) { q.focus(); q.placeholder = "พิมพ์ชื่อรายการใหม่"; return; } open(b.dataset.new ? { name: q.value.trim(), isNew: true } : ITEMS[+b.dataset.k]); };
  const bad = (t, el) => { msg.textContent = t; msg.className = "err"; if (el) UXM.shake(el); };
  save.onclick = async () => {
    if (cur.isNew && !cat) return bad("เลือกหมวดก่อน", cats);
    if (cur.count && !(+qty.value > 0)) return bad(`ใส่จำนวน${cur.name}ที่ได้มา`, qty);
    if (!(+amt.value > 0)) return bad("ใส่ยอดเงินที่จ่าย", amt);
    if (+amt.value > 100000) return bad("ยอดเงินเกิน 100,000 บาท ตรวจตัวเลขอีกครั้ง", amt);
    const p = { amount: amt.value, paid_by: paidBy, photo: photo[0] || null, ...(OWN && dt.value ? { date: dt.value } : {}) };
    if (cur.pid) Object.assign(p, { product_id: cur.pid, qty: cur.count ? qty.value : null });
    else if (cur.iid) p.item_id = cur.iid; else Object.assign(p, { name: cur.name, category: cat });
    save.disabled = true; msg.textContent = "กำลังบันทึก…"; msg.className = "muted";
    const { error } = await supabase.rpc("add_expense", { p });
    save.disabled = false;
    if (error) return bad(App.errText(error));
    sheet.close(); remember(cur, +amt.value);
    UXM.toast(cur.count ? `ลง${cur.name}แล้ว ✓ เข้าสต็อก ${+qty.value} ${cur.unit || ""}` : "ลงรายจ่ายแล้ว ✓");
    q.value = "";
    if (cur.isNew) await load();
    draw(); await list();
  };

  // ---- ลงแล้ว: staff = today · owner = a month with totals per category
  let ym = bday.slice(0, 7), only = null;
  const list = async () => {
    const m0 = ym + "-01", m1 = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 1)).toISOString().slice(0, 10);
    let rq = supabase.from("expenses").select("id,date,category,name,qty,amount,paid_by,photo,created_by,created_at,product_id").order("date", { ascending: false }).order("created_at", { ascending: false });
    rq = OWN ? rq.gte("date", m0).lt("date", m1) : rq.eq("date", bday);
    const p0 = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 2, 1)).toISOString().slice(0, 10);
    const [{ data, error }, day, prev] = await Promise.all([rq, supabase.from("shop_days").select("status").eq("date", bday).maybeSingle(),
      OWN ? supabase.from("expenses").select("amount").gte("date", p0).lt("date", m0) : { data: null }]);
    if (error) { pList.innerHTML = `<p class="err">เปิดรายการไม่ขึ้น ลองเปิดหน้าใหม่</p>`; return; }
    const rows = data || [], sent = day.data?.status === "sent", sum = (f) => rows.filter(f).reduce((s, r) => s + +r.amount, 0);
    cnt.textContent = rows.length || ""; tList.firstChild.textContent = OWN ? "เดือนนี้" : "ลงแล้ววันนี้";
    const nav = OWN ? `<div class="monthnav"><button type="button" id="mp" aria-label="เดือนก่อน">‹</button><div class="m">${new Date(m0 + "T00:00:00Z").toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" })}</div><button type="button" id="mn" aria-label="เดือนถัดไป"${ym >= bday.slice(0, 7) ? " disabled" : ""}>›</button></div>` : "";
    const all = sum(() => true), used = KEYS.filter((k) => sum((r) => r.category === k)), was = (prev.data || []).reduce((t, r) => t + +r.amount, 0);
    if (only && !used.includes(only)) only = null;
    // last month for scale · % only once this month is over (a part month against a whole one would mislead)
    const cmp = OWN && was ? `<div class="cmp">เดือนก่อน ${baht(was)}${ym < bday.slice(0, 7) ? ` <b class="${all > was ? "up" : "down"}">${all > was ? "↑" : "↓"} ${Math.abs(Math.round((all - was) / was * 100))}%</b>` : ""}</div>` : "";
    const head = rows.length ? `<div class="card sum"><div class="tot"><span>รวม${OWN ? "ทั้งเดือน" : "วันนี้"}</span><span><b class="tick" data-n="${all}">${baht(all).replace(" บาท", "")}</b> บาท</span></div>${cmp}`
      + (OWN ? `<div class="bar" aria-hidden="true">${used.map((k) => `<i data-c="${k}" style="flex:${sum((r) => r.category === k)}"></i>`).join("")}</div>`
        + used.map((k) => { const v = sum((r) => r.category === k); return `<button type="button" class="kv" data-c="${k}" data-f="${k}" aria-pressed="${only === k}"><span>${CAT[k]}</span><b>${baht(v)}</b><small>${Math.round(v / all * 100)}%</small></button>`; }).join("") + "<hr>" : "")
      + `<div class="pay">${Object.keys(PAID).map((k) => `<div class="${k}"><small>${PAID[k]}</small><b>${baht(sum((r) => r.paid_by === k))}</b></div>`).join("")}</div>${OWN ? `<a class="btn tonal sm go-costs" href="costs.html">ดูต้นทุน/กำไร</a>` : ""}</div>` : "";
    const shown = only ? rows.filter((r) => r.category === only) : rows;
    const can = (r) => OWN ? !(r.qty != null && r.date === bday && sent) : r.created_by === me.userId && !sent; // server re-checks (a stock row of any sent day is refused)
    const row = (r) => `<div class="it" data-id="${r.id}">${ci(r.category)}<span class="grow"><b>${esc(r.name)}${r.qty != null ? ` ${+r.qty}` : ""}</b><small><span class="pill"${r.paid_by === "cash" ? ' data-tone="ok"' : ""}>${PAY_S[r.paid_by]}</span>${hm(r.created_at)} น.${r.photo ? ` · <a href="#" data-ph="${esc(r.photo)}">ดูใบเสร็จ</a>` : ""}</small></span><span class="amt">${baht(r.amount)}</span>${can(r) ? `<button type="button" class="del" data-del="${r.id}" aria-label="ลบ ${esc(r.name)}">✕</button>` : ""}</div>`;
    let body = "";
    if (!rows.length) body = `<div class="empty"><img class="mascot sm" src="img/mascot-240.png" alt="" width="56" height="56"><p>${OWN ? "เดือนนี้ยังไม่มีรายจ่าย" : "วันนี้ยังไม่มีรายจ่าย"}</p></div>`;
    else if (OWN) { const g = {}; shown.forEach((r) => (g[r.date] ||= []).push(r)); body = (only ? `<div class="only"><span>แสดงเฉพาะ${CAT[only]}</span><button type="button" data-all="1">ดูทั้งหมด</button></div>` : "") + `<div class="card el">` + Object.entries(g).map(([d, rs]) => `<h3 class="sec day"><span>${UXS.thd(d, { weekday: "short" })}</span><span>${baht(rs.reduce((s, r) => s + +r.amount, 0))}</span></h3>` + rs.map(row).join("")).join("") + `</div>`; }
    else body = `<div class="card el">${rows.map(row).join("")}</div>`;
    pList.innerHTML = nav + head + body; tick();
    pList.querySelectorAll("[data-f], [data-all]").forEach((b) => { b.onclick = () => { only = b.dataset.all || only === b.dataset.f ? null : b.dataset.f; list(); }; });
    if (OWN) { const step = (k) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + k, 1)); ym = d.toISOString().slice(0, 7); list(); }; mp.onclick = () => step(-1); mn.onclick = () => step(1); }
    pList.querySelectorAll("[data-ph]").forEach((a) => { a.onclick = async (e) => { e.preventDefault(); try { Photo.view(await Photo.url(supabase, a.dataset.ph)); } catch (_) { UXM.toast("เปิดรูปไม่ได้"); } }; });
    pList.querySelectorAll("[data-del]").forEach((b) => { b.onclick = () => {
      const el = b.closest(".it"), r = rows.find((x) => x.id === b.dataset.del); el.hidden = true;
      UXM.later(`ลบ ${r.name} แล้ว`, async () => { const { error } = await supabase.rpc("delete_expense", { eid: r.id }); if (error) UXM.toast(App.errText(error)); await list(); }, () => { el.hidden = false; });
    }; });
  };

  const tab = (t) => { tabs.querySelectorAll("button").forEach((b) => { const on = b.dataset.t === t; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    pNew.hidden = t !== "new"; pList.hidden = t !== "list"; scrollTo(0, 0); if (t === "list") tick(); };
  tabs.onclick = (e) => { const b = e.target.closest("[data-t]"); if (b) tab(b.dataset.t); };
  try { await load(); } catch (_) { return stop("เปิดไม่ขึ้น ลองเปิดหน้าใหม่"); }
  draw(); await list();
  form.hidden = false;
  tab(new URLSearchParams(location.search).get("tab") === "list" ? "list" : "new");
})().catch(() => { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น ลองเปิดหน้าใหม่"; });
</script></body></html>
