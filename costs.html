<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ต้นทุน/กำไร (เจ้าของ)</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script>
<style>
td.n{font-weight:600}
tr.net td{font:600 20px/1.3 var(--font-head);padding:14px 2px;border-top:2px solid var(--color-foreground)}
tr.net td+td{white-space:nowrap}
#prod .row{min-height:64px}
#prod .row b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
#prod .meta{margin-top:2px}
#prod .meta .err{white-space:nowrap;font-weight:600}
</style></head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>ต้นทุน/กำไร</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></header>
<p id="blocked" class="err" hidden></p>
<div id="app" hidden>
  <input id="pm" type="month" aria-label="เลือกเดือน">
  <h2>สรุปทั้งเดือน</h2><div id="sum" class="card muted">กำลังโหลด…</div>
  <h2>กรอกยอดขายและค่าใช้จ่าย (บาท)</h2><div class="card form">
    <div class="g"><label>ยอดหน้าร้าน (POS ไม่รวมเดลิเวอรี่)<input type="number" id="store_sales"></label><label>ยอด LINE MAN<input type="number" id="lineman_sales"></label>
    <label>ยอด Grab<input type="number" id="grab_sales"></label><label>ยอด Shopee<input type="number" id="shopee_sales"></label>
    <label>ค่าเช่า<input type="number" id="rent"></label><label>ค่าแรง<input type="number" id="wages"></label>
    <label>ค่าน้ำไฟ<input type="number" id="utilities"></label><label>ค่าแก๊ส<input type="number" id="gas"></label>
    <label>จิปาถะ<input type="number" id="misc"></label></div>
    <label class="field" for="note">โน้ต</label><textarea id="note" rows="2"></textarea>
    <button class="btn primary" id="save">บันทึกยอด</button><span id="smsg" class="muted"></span></div>
  <h2>ค่า GP แอปส่งอาหาร (%)</h2><div class="card">
    <div class="g"><label>LINE MAN<input type="number" id="lineman_gp"></label><label>Grab<input type="number" id="grab_gp"></label><label>Shopee<input type="number" id="shopee_gp"></label></div>
    <button class="btn" id="gsave">บันทึกค่า GP</button><span id="gmsg" class="muted"></span></div>
  <h2>ต้นทุนรายสินค้า</h2><div id="prod" class="card muted">กำลังโหลด…</div>
</div>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const { supabase, me } = await App.ready();
  if (me.role !== "owner") { $("blocked").hidden = false; $("blocked").textContent = "หน้านี้สำหรับเจ้าของ"; return; }
  $("app").hidden = false;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n) => n == null ? "-" : Number(n).toLocaleString("th-TH", { maximumFractionDigits: 0 });
  const IN = ["store_sales", "lineman_sales", "grab_sales", "shopee_sales", "rent", "wages", "utilities", "gas", "misc"];
  const GP = ["lineman_gp", "grab_gp", "shopee_gp"];
  $("pm").value = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 7);
  const ym = () => $("pm").value;

  async function load() {
    const [y, m] = ym().split("-").map(Number); if (!y) return;
    const { data: r, error } = await supabase.rpc("month_costs", { y, m });
    if (error) { $("sum").innerHTML = `<p class="err">เปิดไม่ขึ้น: ${esc(App.errText(error))}</p>`; return; }
    IN.forEach((k) => $(k).value = r.inputs[k] ?? "");
    $("note").value = r.inputs.note || "";
    GP.forEach((k) => $(k).value = r.gp[k] ?? "");
    const diff = r.revenue > 0 && r.stock_sales_est > 0 ? Math.round((r.stock_sales_est - r.revenue) / r.revenue * 100) : null;
    const rows = [["ยอดขายรวม", money(r.revenue)], ["ค่า GP แอปส่ง", money(r.gp_cost)], ["ค่าของ CPF", money(r.cpf_cost)], ["ค่าใช้จ่ายประจำ", money(r.fixed)]];
    const after = [["ของเสีย (รวมอยู่ในค่าของ CPF แล้ว)", money(r.waste_cost), "บาท"], ["เปิดร้าน", r.days_open, "วัน"], ["ยอดขายเฉลี่ยต่อวัน", money(r.avg_daily_sales), "บาท"], ["ยอดขายคิดจากสต็อก (ประมาณ)", money(r.stock_sales_est), "บาท"]];
    $("sum").className = "card";
    $("sum").innerHTML = `${r.has_inputs ? "" : '<p class="muted">เดือนนี้ยังไม่กรอกยอด · ค่าเช่า ค่าแรง ใช้ตัวเลขประมาณไปก่อน</p>'}<table>
      ${rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${v} บาท</td></tr>`).join("")}
      <tr class="net"><td>กำไรสุทธิ</td><td class="${r.net >= 0 ? "ok" : "err"}">${money(r.net)} บาท</td></tr>
      ${after.map(([k, v, u]) => `<tr><td>${k}</td><td class="n">${v ?? 0} ${u}</td></tr>`).join("")}</table>
      ${diff == null ? "" : `<p class="muted">ยอดขายคิดจากสต็อก ต่างจากยอดขายรวม ${diff > 0 ? "+" : ""}${diff}%</p>`}
      ${r.missing_cost.length ? `<p class="err">ยังไม่ได้ใส่ราคาทุน: ${esc(r.missing_cost.join(", "))} <a class="btn sm" href="settings.html">ไปใส่ราคาทุน</a></p>` : ""}`;
    $("prod").className = "card list";
    $("prod").innerHTML = r.per_product.length ? r.per_product.map((p) => `<div class="row"><div class="grow"><div class="nm">${esc(p.name)}</div><div class="meta">รับ ${money(p.received)} · ขาย ${money(p.sold)} · เสีย ${money(p.waste)}<br>${p.cost_price == null ? '<b class="err">ยังไม่ใส่ราคาทุน</b>' : "ทุนต่อหน่วย " + money(p.cost_price) + " บาท"}</div></div><b>${money(p.cost)} บาท</b></div>`).join("")
      : '<p class="muted">เดือนนี้ยังไม่มีการนับของ</p>';
  }
  const msg = (id, error) => { $(id).className = error ? "err" : "ok"; $(id).textContent = error ? "บันทึกไม่ได้: " + App.errText(error) : "บันทึกแล้ว ✓"; };
  $("save").onclick = async () => {
    const row = { ym: ym(), note: $("note").value.trim() || null, updated_at: new Date().toISOString() };
    IN.forEach((k) => row[k] = +$(k).value || 0);
    const { error } = await supabase.from("month_inputs").upsert(row); msg("smsg", error); if (!error) load();
  };
  $("gsave").onclick = async () => {
    const { error } = await supabase.from("settings").upsert(GP.map((key) => ({ key, value: +$(key).value || 0 }))); msg("gmsg", error); if (!error) load();
  };
  $("pm").onchange = load; await load();
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
