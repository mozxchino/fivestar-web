<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css"><link rel="stylesheet" href="lib/ux-data.css">

<style>
.g{align-items:end}
a.cell{text-decoration:none;color:inherit}
#hd{min-height:44px}
/* 0033 รอบสั่ง CPF: 7 weekday toggles in one row, each a full-height tap target */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;width:calc(100% + 20px);margin:0 -10px;padding:4px 0}
.dow .chip{justify-content:center;padding:0;box-shadow:none;background:var(--color-fill)}
.dow .chip.on{background:var(--color-foreground)} /* qa: the add-holiday field sits in a plain row (not a label), so the field itself is the tap target */
.g label.chk{display:flex;align-items:center;gap:10px;min-height:var(--field);margin:0;align-self:end;font-size:16px;color:var(--fg)}
</style></head><body class="grouped" ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>ตั้งค่า</h1><div class="sub">สำหรับเจ้าของ</div></div>
  <div class="tabs sk" aria-hidden="true"><button class="on" tabindex="-1">พนักงาน</button><button tabindex="-1">สินค้า</button><button tabindex="-1">ร้าน</button></div><div class="tabs ld" id="tabs" hidden><button data-t="staff" class="on">พนักงาน</button><button data-t="prod">สินค้า</button><button data-t="sys">ร้าน</button></div></header>
<p id="blocked" class="err" hidden></p>
<div class="sk"><span class="vh">กำลังเปิด…</span><h2 style="display:flow-root"><i class="sk-b" style="--w:30%;--h:13px;margin:4px 0"></i></h2><div class="gl"><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div></div><h2 style="display:flow-root"><i class="sk-b" style="--w:36%;--h:13px;margin:4px 0"></i></h2><div class="gl"><div class="cell has-av"><i class="sk-b" style="--w:36px;--h:36px;--r:50%"></i><i class="sk-b" style="--w:30%;--h:17px;margin:0"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div></div></div>
<div id="app" class="ld" hidden>
  <section id="staff"><span class="vh">กำลังเปิด…</span><h2 style="display:flow-root"><i class="sk-b" style="--w:30%;--h:13px;margin:4px 0"></i></h2><div class="gl"><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div></div><h2 style="display:flow-root"><i class="sk-b" style="--w:36%;--h:13px;margin:4px 0"></i></h2><div class="gl"><div class="cell has-av"><i class="sk-b" style="--w:36px;--h:36px;--r:50%"></i><i class="sk-b" style="--w:30%;--h:17px;margin:0"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div><div class="cell"><i class="sk-b" style="--w:38%;--h:16px"></i><i class="sk-b" style="--w:22%;--h:16px;margin:0 0 0 auto"></i></div></div></section>
  <section id="prod" hidden>
    <div class="search"><input type="text" id="q" placeholder="ค้นหาสินค้า เช่น จ๊อ" aria-label="ค้นหาสินค้า" enterkeyhint="search"><button class="btn sm" id="add">+ เพิ่มสินค้า</button></div>
    <div id="pf" class="chips" style="margin-top:10px"></div>
    <div id="plist" class="card list"></div>
  </section>
  <section id="sys" hidden></section>
</div>
<dialog id="ps" class="bsheet full" role="dialog" aria-modal="true" aria-labelledby="psh"><div class="hd"><button class="txt-btn" type="button" data-close>ยกเลิก</button><b id="psh"></b><span aria-hidden="true"></span></div>
  <div class="body" id="psb"></div>
  <div class="foot"><button class="btn primary" id="pss">บันทึกสินค้า</button><p id="psm" class="err" role="alert"></p></div></dialog>
<dialog id="us" class="bsheet" aria-labelledby="ush"><div class="body"><div class="grab"></div>
  <div class="hd"><b id="ush"></b><button class="x" type="button" aria-label="ปิด">✕</button></div><p id="usm" class="meta ux-usm"></p><div id="usb" class="ux-4" aria-live="polite"></div></div>
  <div class="foot ux-2b"><a class="btn tonal" href="history.html">ดูประวัติ</a><a class="btn" href="holiday.html">ดูวันลา</a></div></dialog>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const E = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const { supabase, me } = await App.ready();
  if (me.role !== "owner" && me.role !== "manager") { $("blocked").hidden = false; $("blocked").textContent = "หน้านี้สำหรับเจ้าของ"; return; }
  // round 6: a manager only edits staff off-days (set_off_days) · no pay, no access cards, no products, no shop settings (the DB refuses those anyway)
  const MGR = me.role === "manager";
  $("app").hidden = false; $("tabs").hidden = MGR;
  if (MGR) { document.querySelector(".topbar h1").textContent = "พนักงาน"; document.title = "พนักงาน"; document.querySelector(".topbar .sub").textContent = "วันหยุดของพนักงาน"; document.querySelector(".topbar .tabs.sk").remove(); }
  const tabs = document.querySelectorAll("#tabs button"); // #tabs: the skeleton track in the header has look-alike buttons
  tabs.forEach((b) => b.onclick = () => { tabs.forEach((x) => { x.classList.toggle("on", x === b); $(x.dataset.t).hidden = x !== b; }); });
  const qs = new URLSearchParams(location.search);
  const fail = (e) => alert("บันทึกไม่ได้\n" + App.errText(e));
  const money = (n) => Number(n).toLocaleString("th-TH", { maximumFractionDigits: 2 }); // qa: openSum (manager too) needs it before the manager return

  // M9: pay boxes show 15,000 · digits only while the cursor is in the box, so the saved number is plain
  // the box is type=text (number can't show 15,000), so ux-motion's select-on-focus skips it: select here, or typing appends (iOS sim: 15000 → 150001)
  document.addEventListener("focusin", (e) => { const el = e.target; if (!el.classList?.contains("money-in")) return; el.value = el.value.replace(/,/g, ""); try { el.select(); } catch (_) {} });
  document.addEventListener("input", (e) => { if (e.target.classList?.contains("money-in")) e.target.value = e.target.value.replace(/[^\d.]/g, ""); });
  document.addEventListener("focusout", (e) => { const el = e.target; if (el.classList?.contains("money-in") && el.value !== "" && !isNaN(el.value)) el.value = money(el.value); });
  // generic save-on-blur for any input with data-t/data-id/data-f
  document.addEventListener("change", async (ev) => {
    const el = ev.target, { t, id, f } = el.dataset;
    if (el.dataset.offd) { // owner or manager · staff off-days only
      const { error } = await supabase.rpc("set_off_days", { p_user_id: el.dataset.offd, n: el.value === "" ? null : Number(el.value) });
      if (error) return fail(error);
      return UXM.toast("บันทึกแล้ว ✓");
    }
    if (!t) return;
    const v = el.type === "checkbox" ? el.checked : el.value === "" ? null : el.type === "number" || el.inputMode === "decimal" ? Number(el.value) : el.value;
    const { error } = await supabase.from(t).update({ [f]: v }).eq("id", id);
    if (error) return fail(error);
    UXM.toast("บันทึกแล้ว ✓"); // ก4: one toast instead of the flash under the group
  });

  // ---- พนักงาน
  async function staff() {
    if (MGR) return staffMgr();
    const { data: pend, error: e1 } = await supabase.from("pending_users").select("*").order("first_seen");
    const { data: us, error: e2 } = await supabase.from("users").select("*").order("name");
    if (e1 || e2) { $("staff").innerHTML = `<p class="err">เปิดรายชื่อไม่ขึ้น ลองเปิดหน้าใหม่\n${E(App.errText(e1 || e2))}</p>`; return; }
    // owner row: name + เจ้าของ only (no pay fields, can't be switched off · DB guard 0024)
    // mock ก: one grouped list per person · label left, value right, unit after the number · save on change (toast at the bottom)
    const ci = (id, f, val, label, unit, type = "number") => `<label class="cell"><span class="k">${label}</span><input class="${type === "number" ? "num-in" : type === "money" ? "num-in money-in" : ""}" type="${type === "money" ? "text" : type}" ${type === "number" ? 'inputmode="decimal" step="any" placeholder="ยังไม่ใส่"' : type === "money" ? 'inputmode="decimal" placeholder="ยังไม่ใส่"' : ""} value="${E(type === "money" && val != null && val !== "" ? money(val) : val)}" data-t="users" data-id="${id}" data-f="${f}" aria-label="${label}">${unit ? `<span class="unit">${unit}</span>` : ""}</label>`;
    const av = (x) => `<span class="av${x.active ? "" : " off"}" aria-hidden="true">${E((x.name || "?").slice(0, 1).toUpperCase())}</span>`;
    const head = (x, pill) => `<div class="cell has-av${x.active ? "" : " dim"}">${av(x)}<span class="k name">${E(x.name)}</span>${pill}</div>`;
    // round 4: a working staff member's name row opens this month's summary (bottom sheet)
    const who = (x) => `<button class="cell has-av ux-who" type="button" data-sum="${x.id}" data-n="${E(x.name)}" aria-haspopup="dialog">${av(x)}<span class="k name">${E(x.name)}<small>ดูสรุปเดือนนี้</small></span><span class="pill"${x.role === "manager" ? ' data-tone="ok"' : ""}>${x.role === "manager" ? "ผู้จัดการ" : "พนักงาน"}</span><span class="go" aria-hidden="true">›</span></button>`;
    // round 6: owner only · an active staff row (claimed in the staff group) can become ผู้จัดการ and back · undo for 5 s like ปิดสิทธิ์
    const last = (us || []).filter((x) => x.active && x.role === "staff").length === 1; // impeccable: promoting the only staff stops shop work in the app
    const mgr = (x) => `<button class="cell act ux-mgr" type="button" data-mgr="${x.role === "manager" ? 0 : 1}" data-id="${x.id}" data-n="${E(x.name)}"><span class="k">${x.role === "manager" ? "เปลี่ยนกลับเป็นพนักงาน" : "ตั้งเป็นผู้จัดการ"}<small>${x.role === "manager" ? "อนุมัติใบสั่ง ลา และปัญหาแทนเจ้าของไม่ได้แล้ว" : `อนุมัติใบสั่ง ลา และรับทราบปัญหาแทนเจ้าของได้\nเปิดร้าน รับของ ปิดร้านไม่ได้\nไม่เห็นต้นทุน กำไร เงินเดือน${last ? "\nเป็นพนักงานคนเดียว ตั้งแล้วจะไม่มีคนเปิดร้านในแอป" : ""}`}</small></span></button>`;
    const u = (x) => x.role === "owner" ? `<div class="gl">${head(x, '<span class="pill">เจ้าของ</span>')}</div>`
      : !x.active ? `<div class="gl">${head(x, `<button class="txt-btn" type="button" data-on="${x.id}" data-n="${E(x.name)}">เปิดสิทธิ์คืน</button>`)}</div>`
      : `<div class="person"><div class="gl">${who(x)}
      ${ci(x.id, "salary_month", x.salary_month, "เงินเดือน", "บาท", "money")}${ci(x.id, "off_days_per_month", x.off_days_per_month, "หยุดได้", "วัน/เดือน")}
      ${ci(x.id, "std_hours_per_day", x.std_hours_per_day, "ทำงาน", "ชม./วัน")}${ci(x.id, "ot_rate_hour", x.ot_rate_hour, "โอที", "บาท/ชม.", "money")}
      ${ci(x.id, "started_at", x.started_at, "เริ่มงานวันที่", "", "date")}
      ${mgr(x)}
      <button class="cell act danger" type="button" data-off="${x.id}" data-n="${E(x.name)}">ปิดสิทธิ์ใช้แอป</button></div></div>`;
    const off = (us || []).filter((x) => !x.active);
    $("staff").innerHTML = `<h2${(pend || []).length ? ' data-tone="bad"' : ""}>คนขอใช้แอป<span class="n">${(pend || []).length} คน</span></h2>` + ((pend || []).map((p, i) => `<div class="card gl" data-src="${E(p.source_id)}"><label class="cell"><span class="k">ชื่อ</span><input type="text" value="${E(p.display_name)}" placeholder="ชื่อที่เรียกในร้าน" aria-label="ชื่อที่เรียกในร้าน"></label>
      <button class="cell act${i ? "" : " ux-prim"}" type="button" data-ok><span class="k">อนุมัติเป็นพนักงาน</span></button></div>`).join("") || `<p class="gf">ไม่มีคนขอ</p>`)
      + `<h2>คนที่ใช้แอปอยู่<span class="n">${(us || []).filter((x) => x.active).length} คน</span></h2>` + (us || []).filter((x) => x.active).map(u).join("")
      + (off.length ? `<h2>ปิดสิทธิ์แล้ว<span class="n">${off.length} คน</span></h2>` + off.map(u).join("") : "");
  }
  // LINE menu follows the role: manager → เมนูผู้จัดการ · staff / ปิดสิทธิ์ → เมนูร้าน (the role itself is already saved)
  async function syncMenu(id) {
    const r = await App.fn("notify", { menu_user: id }).catch((e) => ({ error: e }));
    if (!r.ok) UXM.toast("บันทึกแล้ว\nเมนู LINE ของคนนี้ยังไม่เปลี่ยน", { ms: 4000 });
  }
  $("staff").onclick = async (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.sum) return openSum(b.dataset.sum, b.dataset.n);
    if (b.dataset.mgr !== undefined) {
      // the row changes now (pill + button), set_manager runs after 5 s unless "เลิกทำ"
      const on = b.dataset.mgr === "1", box = b.closest(".person"), pill = box.querySelector(".pill"), k = b.querySelector(".k"), was = [pill.textContent, pill.dataset.tone, k.innerHTML];
      pill.textContent = on ? "ผู้จัดการ" : "พนักงาน"; if (on) pill.dataset.tone = "ok"; else delete pill.dataset.tone;
      k.textContent = on ? "ตั้งเป็นผู้จัดการแล้ว" : "เปลี่ยนกลับเป็นพนักงานแล้ว"; b.disabled = true;
      return UXM.later(on ? `ตั้ง ${b.dataset.n} เป็นผู้จัดการแล้ว` : `${b.dataset.n} กลับเป็นพนักงานแล้ว`, async () => {
        const r2 = await supabase.rpc("set_manager", { p_user_id: b.dataset.id, p_on: on });
        if (r2.error) UXM.toast("บันทึกไม่ได้\n" + App.errText(r2.error), { ms: 4000 });
        else await syncMenu(b.dataset.id);
        staff();
      }, () => { [pill.textContent] = was; if (was[1]) pill.dataset.tone = was[1]; else delete pill.dataset.tone; k.innerHTML = was[2]; b.disabled = false; });
    }
    let r;
    if (b.dataset.ok !== undefined) {
      const c = b.closest(".card"), name = c.querySelector("input").value.trim();
      if (!name) return fail("ใส่ชื่อก่อน");
      r = await supabase.rpc("approve_user", { p_line_user_id: c.dataset.src, p_name: name, p_role: "staff" });
    } else if (b.dataset.off || b.dataset.on) {
      // ง1: no confirm · the person leaves the list now, the change runs after 5 s unless "เลิกทำ" (both ways can be switched back)
      const box = b.closest(".person") || b.closest(".gl"), off = !!b.dataset.off; box.hidden = true;
      return UXM.later(off ? `ปิดสิทธิ์ ${b.dataset.n} แล้ว` : `เปิดสิทธิ์ ${b.dataset.n} คืนแล้ว`, async () => {
        const r2 = off ? await supabase.rpc("deactivate_user", { p_user_id: b.dataset.off }) : await supabase.from("users").update({ active: true }).eq("id", b.dataset.on);
        if (r2.error) UXM.toast("บันทึกไม่ได้\n" + App.errText(r2.error), { ms: 4000 });
        else await syncMenu(b.dataset.off || b.dataset.on);
        staff();
      }, () => { box.hidden = false; });
    } else return;
    if (r.error) return fail(r.error);
    staff();
  };

  async function staffMgr() {
    const { data: us, error } = await supabase.from("user_public").select("id,name,role,active,off_days_per_month").eq("role", "staff").eq("active", true).order("name");
    if (error) { $("staff").innerHTML = `<p class="err">เปิดไม่ขึ้น: ${E(App.errText(error))}</p>`; return; }
    const av = (x) => `<span class="av" aria-hidden="true">${E((x.name || "?").slice(0, 1).toUpperCase())}</span>`;
    $("staff").innerHTML = `<h2>พนักงาน</h2><p class="gf">ผู้จัดการแก้ได้แค่วันหยุดต่อเดือน</p>` + ((us || []).map((x) => `<div class="person"><div class="gl">
      <button class="cell has-av ux-who" type="button" data-sum="${x.id}" data-n="${E(x.name)}" aria-haspopup="dialog">${av(x)}<span class="k name">${E(x.name)}<small>ดูสรุปเดือนนี้</small></span><span class="pill">พนักงาน</span><span class="go" aria-hidden="true">›</span></button>
      <label class="cell"><span class="k">หยุดได้</span><input class="num-in" type="number" inputmode="numeric" min="0" max="31" step="1" placeholder="ยังไม่ใส่" value="${E(x.off_days_per_month)}" data-offd="${x.id}" aria-label="${E(x.name)} หยุดได้ วันต่อเดือน"><span class="unit">วัน/เดือน</span></label></div></div>`).join("")
      || `<div class="empty tight"><img class="mascot sm" src="img/mascot-240.png" alt="" width="56" height="56"><p>ยังไม่มีพนักงาน</p></div>`);
  }

  // round 4: this month for one person · วันทำงาน = days they opened or closed · โอที and เงินสดขาด = days they closed · หยุด/ลา = approved this month
  const sumS = UXD.sheet($("us"));
  async function openSum(id, name) {
    const today = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10), ym = today.slice(0, 7), nextM = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 1)).toISOString().slice(0, 10);
    const sk = `<div><i class="sk-b" style="--w:46%;--h:26px"></i><i class="sk-b" style="--w:70%;--h:13px;--gap:6px"></i></div>`;
    $("ush").textContent = name; $("usm").textContent = new Date(ym + "-01T00:00:00Z").toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" }) + " ถึงวันนี้";
    $("usb").innerHTML = sk.repeat(4); sumS.open();
    const [d, l] = await Promise.all([
      supabase.from("shop_days").select("date,opened_by,closed_by,ot_hours,cash_expected,cash_counted").gte("date", ym + "-01").lte("date", today),
      supabase.from("leave_requests").select("date,status").eq("user_id", id).eq("status", "approved").gte("date", ym + "-01").lt("date", nextM)]);

  }

  if (MGR) return staff(); // the product and shop tabs never load for a manager

  // ---- สินค้า: ค้นหา + ชิปกรอง + แถวสั้น → หน้าต่างเต็มจอ (เพิ่ม และ แก้ ใช้ฟอร์มเดียวกัน · Mos 29 ต.ค. ถามครบในครั้งเดียว)
  const { data: ps0, error: psErr } = await supabase.from("product_admin").select("*").order("sort");

  // ของขาย/ของใช้ + ซื้อจากไหน → kind / supplier / made_here · ตอนปิดร้าน → count_mode (0045, default from kind)

  const pmeta = (p) => [isCons(p) ? "ของใช้" : "ของขาย", SRC[srcOf(p)], ...(isCons(p) ? [] : [`หน่วยใช้ ${E(UXM.unit(p.unit))}`]), buyTxt(p),
    ...(isCons(p) ? [] : [p.cost_price == null ? '<b class="err">ยังไม่ใส่ทุน</b>' : `ทุน ${money(p.cost_price)} บาท`]), modeOf(p) === "tick" ? "ติ๊กใกล้หมด" : "นับจำนวน"].join(" · ");
  function drawProd() {

      || (!psErr && !q && pf !== "nocost" ? `<div class="empty"><img class="mascot sm" src="img/mascot-240.png" alt="" width="56" height="56"><p>ยังไม่มีสินค้า</p><p class="muted">เพิ่มสินค้าที่ขายหรือใช้ในร้านก่อน</p><button type="button" class="btn sm" data-add-empty>เพิ่มสินค้า</button></div>`

    <h2>รอบสั่ง CPF</h2><div class="gl">
      <label class="cell nav"><span class="k">สั่งคืนนี้ ของมากี่วัน<small>CPF ตัดรอบบ่ายโมง</small></span><span class="v" data-for="lead"></span>${chev}<select id="lead">${[1, 2, 3].map((n) => `<option value="${n}" ${Number(S.order_lead_days ?? 2) === n ? "selected" : ""}>${n === 1 ? "พรุ่งนี้" : n === 2 ? "มะรืน (2 วัน)" : "3 วัน"}</option>`).join("")}</select></label>
      <label class="cell"><span class="k">ของถึงกี่โมง</span><input type="time" id="dlv" value="${E(S.delivery_at ?? "14:00")}"></label>
      <label class="cell"><span class="k">แท็กเซลล์ท้ายใบสั่ง<small>ข้อความนี้ไม่ใช่การแท็กจริง บอกเซลล์ครั้งเดียวว่าใบสั่งมาจากร้านเรา</small></span><input type="text" id="tag" value="${E(S.sales_mention ?? "@new")}" placeholder="@new" style="max-width:9em"></label>
      <div class="cell" style="flex-wrap:wrap"><span class="k">CPF ไม่ส่งของวัน</span>${dowRow("nod", nod, "วันที่ CPF ไม่ส่งของ")}</div>
      <label class="cell"><span class="k">เผื่อวันขายดี<small>เป้า = ขายเฉลี่ย 7 วัน × 2.5 วัน + เผื่อ</small></span><input type="number" id="buf" inputmode="numeric" min="0" max="100" step="5" value="${buf}" style="width:5.5em;text-align:right"> %</label></div>
    <div class="gl"><a class="cell nav" href="order-rules.html"><span class="k">กติกาใบสั่ง<small>ดูแบบเห็นภาพ พร้อมตัวอย่างตัวเลข</small></span>${chev}</a></div>
    <h2>กลุ่ม LINE</h2><div class="gl"><label class="cell nav"><span class="k">กลุ่มสั่งของ<small>มีเซลล์อยู่</small></span><span class="v" data-for="sg"></span>${chev}${sel("sg", S.sales_group_id)}</label>
      <label class="cell nav"><span class="k">กลุ่มพนักงาน</span><span class="v" data-for="fg"></span>${chev}${sel("fg", S.staff_group_id)}</label>
      <button class="cell act" type="button" id="claim"><span class="ic">${send}</span><span class="k">ส่งการ์ดยืนยันตัวตนเข้ากลุ่มพนักงาน</span></button></div>
    <p id="cmsg" class="muted" aria-live="polite"></p>
    <p class="gf"><span>ใช้เมื่อ: น้องยังไม่ได้กด หรือการ์ดจมไปแล้ว</span><span>กดปุ่มนี้ → การ์ดเด้งในกลุ่มพนักงาน</span><span>น้องกด 'ฉันเป็นพนักงาน' ในกลุ่ม → ใช้แอปได้เลย</span></p>
    <h2>ค่าคอมแอปส่งอาหาร</h2><div class="gl">${gp("lineman_gp", "LINE MAN")}${gp("grab_gp", "Grab")}${gp("shopee_gp", "Shopee")}</div><p class="gf">หน้าต้นทุน/กำไรใช้ตัวเลขนี้คิดค่าคอมแอปส่ง</p>
    <h2>วันหยุดร้าน</h2><div class="gl"><div class="cell" style="flex-wrap:wrap"><span class="k">หยุดทุกสัปดาห์</span>${dowRow("cld", cld, "วันหยุดร้านประจำ")}</div></div>
    <p class="gf"><span>วันหยุดประจำ ไม่มีเตือนปิดร้าน</span><span>คืนนั้นแอปสั่งของจากยอดขายวันเปิดล่าสุด</span><span>หน้าหลักพนักงานขึ้น วันนี้ร้านหยุด</span></p>
    <div class="gl"><div class="cell"><span class="k" style="white-space:nowrap">เฉพาะวัน</span><input type="date" id="hd" aria-label="วันหยุดที่จะเพิ่ม"><button class="txt-btn" type="button" id="ha">เพิ่มวันหยุด</button></div></div>
    <div class="gl" id="hl"></div><p class="gf">เพิ่มหรือลบแล้ว กด บันทึกตั้งค่าร้าน ด้านล่าง</p>
    <div class="sticky"><button class="btn primary" id="save">บันทึกตั้งค่าร้าน</button><p id="smsg" class="muted"></p></div>`;
  // picker rows show the chosen group's name as the value
  const showSel = (id) => { const o = $(id).selectedOptions[0]; document.querySelector(`[data-for="${id}"]`).textContent = o ? o.textContent : ""; };
  ["sg", "fg", "lead"].forEach((id) => { showSel(id); $(id).addEventListener("change", () => showSel(id)); });
  const dowTap = (get, put) => (ev) => { const b = ev.target.closest("[data-d]"); if (!b) return; const d = +b.dataset.d, a = get(); put(a.includes(d) ? a.filter((x) => x !== d) : [...a, d].sort()); b.classList.toggle("on"); b.setAttribute("aria-pressed", get().includes(d)); };
  $("nod").onclick = dowTap(() => nod, (a) => (nod = a)); $("cld").onclick = dowTap(() => cld, (a) => (cld = a));
  drawHol();
  UXM.dateTh($("hd")); // Mos 26 ต.ค.: Thai day over the native picker
  $("ha").onclick = () => { const d = $("hd").value; if (d && !hol.includes(d)) { hol.push(d); hol.sort(); drawHol(); } $("hd").value = ""; };
  $("hl").onclick = (ev) => { const i = ev.target.dataset.del; if (i !== undefined) { hol.splice(i, 1); drawHol(); } };
  $("claim").onclick = async () => {
    $("cmsg").className = "muted"; $("cmsg").textContent = "กำลังส่ง…";
    const r = await App.fn("notify", { card: "claim" }).catch((e) => ({ error: e }));
    if (r.ok) UXM.toast("ส่งการ์ดเข้ากลุ่มแล้ว ✓");
    $("cmsg").className = r.ok ? "muted" : "err";
    $("cmsg").textContent = r.ok ? "" : r.error === "staff_group_id not set" ? "ยังไม่ได้ตั้งกลุ่มพนักงาน" : "ส่งไม่ได้: " + App.errText(r.error);
  };
  $("save").onclick = async () => {
    const rows = [["shop_name", $("shop").value.trim()], ["remind_at", $("rem").value || "20:30"], ["auto_send_at", $("auto").value || "12:30"],
      ["sales_group_id", $("sg").value || ""], ["staff_group_id", $("fg").value || ""], ["holidays", hol],
      // 0033 รอบสั่ง CPF · out-of-range numbers fall back to the defaults instead of saving nonsense
      ["order_lead_days", Number($("lead").value) || 2], ["delivery_at", $("dlv").value || "14:00"], ["sales_mention", $("tag").value.trim()], ["cpf_no_delivery_dow", nod], ["shop_closed_dow", cld], ["order_buffer_pct", Math.min(100, Math.max(0, Number($("buf").value) || 0))],
      // GP: blank = keep what is saved (never write 0 by accident)
      ...["lineman_gp", "grab_gp", "shopee_gp"].filter((k) => $(k).value !== "").map((k) => [k, Number($(k).value)])].map(([key, value]) => ({ key, value }));
    const { error } = await supabase.from("settings").upsert(rows);
    $("smsg").className = error ? "err" : "muted"; $("smsg").textContent = error ? "บันทึกไม่ได้: " + App.errText(error) : "";
    if (!error) UXM.toast("บันทึกแล้ว ✓");
  };
  staff();
  const t0 = document.querySelector(`.tabs [data-t="${qs.get("tab")}"]`); if (t0) t0.click();
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
