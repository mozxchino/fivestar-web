<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตั้งค่า</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css"><link rel="stylesheet" href="lib/ux-data.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/ux-data.js"></script>
<style>
.g{align-items:end}
.g label.chk{display:flex;align-items:center;gap:10px;min-height:var(--field);margin:0;align-self:end;font-size:16px;color:var(--fg)}
.card[data-src] > * + *{margin-top:10px}
.card[data-src] .btn{width:100%;margin-right:0}
.hd-add{border:0}.hd-add input{flex:1}
</style></head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>ตั้งค่า</h1><div class="sub">สำหรับเจ้าของ</div></div></header>
<p id="blocked" class="err" hidden></p>
<div id="app" hidden>
  <div class="tabs"><button data-t="staff" class="on">พนักงาน</button><button data-t="prod">สินค้า</button><button data-t="sys">ร้าน</button></div>
  <section id="staff"></section>
  <section id="prod" hidden>
    <div class="search"><input type="text" id="q" placeholder="ค้นหาสินค้า เช่น จ๊อ" aria-label="ค้นหาสินค้า" enterkeyhint="search"><button class="btn sm" id="add">+ เพิ่มสินค้า</button></div>
    <div id="pf" class="chips" style="margin-top:10px"></div>
    <p id="pmsg" class="ok"></p>
    <div id="plist" class="card list"></div>
  </section>
  <section id="sys" hidden></section>
</div>
<dialog id="ps" class="bsheet" aria-labelledby="psh"><div class="body"><div class="grab"></div>
  <div class="hd"><b id="psh"></b><button class="x" type="button" aria-label="ปิด" autofocus>✕</button></div><div id="psb"></div></div>
  <div class="foot"><button class="btn primary" id="pss"></button><p id="psm" class="err"></p></div></dialog>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const E = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const { supabase, me } = await App.ready();
  if (me.role !== "owner") { $("blocked").hidden = false; $("blocked").textContent = "หน้านี้สำหรับเจ้าของ"; return; }
  $("app").hidden = false;
  const tabs = document.querySelectorAll(".tabs button");
  tabs.forEach((b) => b.onclick = () => { tabs.forEach((x) => { x.classList.toggle("on", x === b); $(x.dataset.t).hidden = x !== b; }); });
  const qs = new URLSearchParams(location.search);
  const fail = (e) => alert("บันทึกไม่ได้\n" + App.errText(e));

  // generic save-on-blur for any input with data-t/data-id/data-f
  document.addEventListener("change", async (ev) => {
    const el = ev.target, { t, id, f } = el.dataset;
    if (!t) return;
    const v = el.type === "checkbox" ? el.checked : el.value === "" ? null : el.type === "number" || el.inputMode === "decimal" ? Number(el.value) : el.value;
    const { error } = await supabase.from(t).update({ [f]: v }).eq("id", id);
    if (error) return fail(error);
    const fl = el.closest(".card").querySelector(".flash"); fl.classList.add("on"); setTimeout(() => fl.classList.remove("on"), 1500);
  });
  const inp = (t, id, f, val, label, type = "number") => `<label>${label}<input type="${type}" ${type === "number" ? 'inputmode="decimal" step="any"' : ""} value="${E(val)}" data-t="${t}" data-id="${id}" data-f="${f}"></label>`;

  // ---- พนักงาน
  async function staff() {
    const { data: pend } = await supabase.from("pending_users").select("*").order("first_seen");
    const { data: us } = await supabase.from("users").select("*").order("name");
    // owner row: name + เจ้าของ only (no pay fields, can't be switched off · DB guard 0024)
    const u = (x) => x.role === "owner" ? `<div class="card"><b>${E(x.name)}</b> <span class="pill">เจ้าของ</span></div>` : `<div class="card"><b>${E(x.name)}</b> <span class="pill">พนักงาน</span> <span class="flash">บันทึกแล้ว ✓</span>
      <div class="g">${inp("users", x.id, "salary_month", x.salary_month, "เงินเดือน (บาท)")}${inp("users", x.id, "off_days_per_month", x.off_days_per_month, "หยุดได้ (วัน/เดือน)")}
      ${inp("users", x.id, "std_hours_per_day", x.std_hours_per_day, "ทำงาน (ชม./วัน)")}${inp("users", x.id, "ot_rate_hour", x.ot_rate_hour, "โอที (บาท/ชม.)")}
      ${inp("users", x.id, "started_at", x.started_at, "เริ่มงานวันที่", "date")}</div>
      ${x.active ? `<button class="btn sm" data-off="${x.id}" data-n="${E(x.name)}">ปิดสิทธิ์ใช้แอป</button>` : `<button class="btn sm" data-on="${x.id}">เปิดสิทธิ์คืน</button>`}</div>`;
    $("staff").innerHTML = `<h2>คนขอใช้แอป</h2>` + ((pend || []).map((p) => `<div class="card" data-src="${E(p.source_id)}"><input type="text" value="${E(p.display_name)}" placeholder="ชื่อที่เรียกในร้าน">
      <button class="btn sm" data-ok>อนุมัติเป็นพนักงาน</button></div>`).join("") || `<p class="muted">ไม่มีคนขอ</p>`)
      + `<h2>คนที่ใช้แอปอยู่</h2>` + (us || []).filter((x) => x.active).map(u).join("")
      + `<details><summary class="muted">ปิดสิทธิ์แล้ว (${(us || []).filter((x) => !x.active).length} คน)</summary>${(us || []).filter((x) => !x.active).map(u).join("")}</details>`;
  }
  $("staff").onclick = async (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    let r;
    if (b.dataset.ok !== undefined) {
      const c = b.closest(".card"), name = c.querySelector("input").value.trim();
      if (!name) return fail("ใส่ชื่อก่อน");
      r = await supabase.rpc("approve_user", { p_line_user_id: c.dataset.src, p_name: name, p_role: "staff" });
    } else if (b.dataset.off) {
      if (!confirm("ปิดสิทธิ์ใช้แอปของ " + b.dataset.n + " ใช่ไหม?\nเขาจะเปิดแอปไม่ได้อีก")) return;
      r = await supabase.rpc("deactivate_user", { p_user_id: b.dataset.off });
    } else if (b.dataset.on) {
      r = await supabase.from("users").update({ active: true }).eq("id", b.dataset.on);
    } else return;
    if (r.error) return fail(r.error);
    staff();
  };

  // ---- สินค้า: ค้นหา + ชิปกรอง + แถวสั้น → แผงล่างแก้ · + เพิ่มสินค้า
  const KIND = { cpf: "ของขาย (CPF)", self: "ซื้อเอง", consumable: "ของใช้ในร้าน" };
  // เพิ่มสินค้า: one choice sets kind + supplier together (the DB needs both)
  const ADDK = [["cpf|cpf", "ของขาย (CPF)"], ["self|self", "ของขาย · ซื้อเอง"], ["consumable|cpf", "ของใช้ในร้าน · สั่ง CPF"], ["consumable|self", "ของใช้ในร้าน · ซื้อเอง"]];
  const money = (n) => Number(n).toLocaleString("th-TH", { maximumFractionDigits: 2 });
  const { data: ps0 } = await supabase.from("products").select("*").order("sort");
  let ps = ps0 || [], cur = null;
  const isCons = (p) => p.kind === "consumable";
  const noCost = (p) => p.active && !isCons(p) && p.cost_price == null;
  const FIL = { sell: ["ของขาย", (p) => p.active && !isCons(p)], cons: ["ของใช้ในร้าน", (p) => p.active && isCons(p)], nocost: ["ยังไม่ใส่ทุน", noCost], off: ["ปิดใช้แล้ว", (p) => !p.active] };
  let pf = FIL[qs.get("f")] ? qs.get("f") : "sell";
  const pmeta = (p) => isCons(p) ? `${KIND.consumable} · ${p.supplier === "cpf" ? "สั่ง CPF" : "ซื้อเอง"} · แพ็คละ ${p.pack_size}`
    : `${(p.par_weekday || 0) + (p.par_weekend || 0) === 0 ? "ไม่สั่ง (ควรมี 0)" : `ควรมี ${p.par_weekday} / ${p.par_weekend}`} · ${p.cost_price == null ? '<b class="err">ยังไม่ใส่ทุน</b>' : `ทุน ${money(p.cost_price)} บาท`}${p.kind === "self" ? " · ซื้อเอง" : ""}`;
  function drawProd() {
    const q = $("q").value.trim().toLowerCase();
    $("pf").innerHTML = Object.entries(FIL).map(([k, [t, f]]) => { const c = ps.filter(f).length; return k === "off" && !c ? "" : `<button type="button" class="chip${k === "nocost" ? " bad" : ""}${!q && k === pf ? " on" : ""}" data-f="${k}" aria-pressed="${!q && k === pf}">${t} <b>${c}</b></button>`; }).join("");
    // ponytail: search looks through every product (ignores the chip) so a hit is never hidden by the wrong filter
    const list = q ? ps.filter((p) => p.name.toLowerCase().includes(q)) : ps.filter(FIL[pf][1]);
    $("plist").innerHTML = list.map((p) => `<button type="button" class="prow${p.active ? "" : " off"}" data-id="${p.id}"><div class="grow"><div class="nm">${E(p.name)}</div><div class="meta">${pmeta(p)}</div></div><span class="go" aria-hidden="true">›</span></button>`).join("")
      || `<p class="muted">${q ? "ไม่เจอสินค้าชื่อนี้" : pf === "nocost" ? "ใส่ราคาทุนครบแล้ว ✓" : "ไม่มีสินค้า"}</p>`;
  }
  $("q").oninput = () => { $("pmsg").textContent = ""; drawProd(); };
  $("pf").onclick = (ev) => { const b = ev.target.closest("[data-f]"); if (!b) return; pf = b.dataset.f; $("q").value = ""; drawProd(); };
  const sheet = UXD.sheet($("ps"));
  const num = (f, label, v, int) => `<label>${label}<input type="number" inputmode="${int ? "numeric" : "decimal"}" min="0" step="${int ? 1 : "any"}" name="${f}" value="${v ?? ""}"></label>`;
  const chk = (p) => `<label class="chk"><input type="checkbox" name="active" ${p.active ? "checked" : ""}>ยังใช้อยู่ (เอาติ๊กออก = ปิดใช้)</label>`;
  function openEdit(p) {
    cur = p; $("psm").textContent = "";
    $("psh").textContent = p.name;
    $("psb").innerHTML = `<p class="meta" style="margin:2px 0 0">${KIND[p.kind] || E(p.kind)}${isCons(p) ? ` · ${p.supplier === "cpf" ? "สั่ง CPF" : "ซื้อเอง"}` : ""}</p>` + (isCons(p)
      ? `<div class="g">${num("pack_size", "แพ็คละ (ชิ้น)", p.pack_size, 1)}</div>${chk(p)}`
      : `<div class="g">${num("par_weekday", "ควรมี จ.–พฤ.", p.par_weekday, 1)}${num("par_weekend", "ควรมี ศ.–อา.", p.par_weekend, 1)}
         ${num("cost_price", "ราคาทุน (บาท)", p.cost_price)}${num("store_price", "ขายหน้าร้าน (บาท)", p.store_price)}</div>
         <details class="fold"><summary>แพ็คละ · ราคาเดลิเวอรี · ปิดใช้<span class="chip">เปิดดู</span></summary>
         <div class="g">${num("pack_size", "แพ็คละ (ชิ้น)", p.pack_size, 1)}${num("delivery_price", "ขายเดลิเวอรี (บาท)", p.delivery_price)}</div>${chk(p)}</details>`);
    $("pss").textContent = "บันทึก " + p.name;
    sheet.open();
  }
  function openAdd() {
    cur = null; $("psm").textContent = "";
    $("psh").textContent = "เพิ่มสินค้า";
    $("psb").innerHTML = `<label class="field" for="an">ชื่อสินค้า</label><input type="text" id="an" name="name" required>
      <label class="field" for="ak">เป็นของแบบไหน</label><select id="ak" name="kk">${ADDK.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
      <div class="g"><label>หน่วย<input type="text" name="unit" list="units" placeholder="ชิ้น" required></label>${num("pack_size", "แพ็คละ (ชิ้น)", 1, 1)}</div>
      <datalist id="units"><option value="ตัว"><option value="ชิ้น"><option value="แพ็ค"><option value="ขวด"><option value="กก."><option value="ม้วน"><option value="ซอง"></datalist>
      <p class="muted">ควรมี กับ ราคาทุน ใส่ต่อได้หลังเพิ่ม</p>`;
    $("pss").textContent = "เพิ่มสินค้า";
    sheet.open();
  }
  $("plist").onclick = (ev) => { const b = ev.target.closest(".prow"); if (b) openEdit(ps.find((p) => p.id === b.dataset.id)); };
  $("add").onclick = openAdd;
  $("pss").onclick = async () => {
    const f = Object.fromEntries([...$("psb").querySelectorAll("[name]")].map((el) => [el.name, el.type === "checkbox" ? el.checked : el.value.trim()]));
    const bad = (t) => { $("psm").textContent = t; };
    const n = (k, int) => { if (f[k] === "" || f[k] == null) return null; const v = Number(f[k]); return Number.isFinite(v) && v >= 0 && (!int || Number.isInteger(v)) ? v : NaN; };
    let row;
    if (cur) {
      row = { active: f.active };
      for (const [k, int] of [["par_weekday", 1], ["par_weekend", 1], ["pack_size", 1], ["cost_price"], ["store_price"], ["delivery_price"]]) if (k in f) row[k] = n(k, int);
      if (Object.values(row).some(Number.isNaN)) return bad("ตัวเลขไม่ถูก\nใส่เลข 0 ขึ้นไป (ควรมี กับ แพ็ค ใช้เลขเต็ม)");
      for (const k of ["par_weekday", "par_weekend"]) if (k in row && row[k] == null) row[k] = 0;   // not null in the DB
      if ("pack_size" in row && !(row.pack_size >= 1)) return bad("แพ็คละ ต้องเป็น 1 ขึ้นไป");
    } else {
      const [kind, supplier] = f.kk.split("|"), pk = n("pack_size", 1);
      if (!f.name) return bad("ใส่ชื่อสินค้าก่อน");
      if (ps.some((p) => p.name === f.name)) return bad("มีสินค้าชื่อนี้แล้ว");
      if (!f.unit) return bad("ใส่หน่วยก่อน เช่น ชิ้น");
      if (!(pk >= 1)) return bad("แพ็คละ ต้องเป็นเลขเต็ม 1 ขึ้นไป");
      row = { name: f.name, kind, supplier, unit: f.unit, pack_size: pk, sort: Math.max(0, ...ps.map((p) => p.sort)) + 1, par_weekday: 0, par_weekend: 0, active: true };
    }
    $("pss").disabled = true;
    const r = cur ? await supabase.from("products").update(row).eq("id", cur.id).select().single() : await supabase.from("products").insert(row).select().single();
    $("pss").disabled = false;
    if (r.error) return bad("บันทึกไม่ได้\n" + App.errText(r.error));
    const saved = r.data || { ...cur, ...row };
    ps = cur ? ps.map((p) => p.id === cur.id ? saved : p) : [...ps, saved];
    if (!cur) { pf = isCons(saved) ? "cons" : "sell"; $("q").value = ""; }
    sheet.close(); drawProd(); $("pmsg").textContent = (cur ? "บันทึก " : "เพิ่ม ") + saved.name + " แล้ว";
  };
  drawProd();

  // ---- ระบบ
  const { data: st } = await supabase.from("settings").select("key,value");
  const S = Object.fromEntries((st || []).map((s) => [s.key, s.value]));
  const { data: gs } = await supabase.from("line_sources").select("source_id,display_name").eq("source_type", "group");
  let hol = [...(S.holidays || [])].sort();
  const sel = (id, cur) => `<select id="${id}"><option value="">ยังไม่เลือก</option>${(gs || []).map((g) => `<option value="${E(g.source_id)}" ${g.source_id === cur ? "selected" : ""}>${E(g.display_name || g.source_id)}</option>`).join("")}</select>`;
  const drawHol = () => { $("hl").innerHTML = hol.map((d, i) => `<div class="row"><span class="grow num">${new Date(d + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" })}</span><button class="btn sm" data-del="${i}">ลบ</button></div>`).join("") || `<p class="muted">ยังไม่มีวันหยุด</p>`; };
  $("sys").innerHTML = `<div class="card"><label class="field" for="shop">ชื่อร้าน (ขึ้นหัวใบสั่ง)</label><input type="text" id="shop" value="${E(S.shop_name)}">
    <div class="g"><div><label for="rem">เตือนปิดร้านตอน</label><input type="time" id="rem" value="${E(S.remind_at)}"></div><div><label for="auto">แอปส่งใบสั่งตอน</label><input type="time" id="auto" value="${E(S.auto_send_at)}"></div></div>
    <label class="field" for="sg">กลุ่มสั่งของ (มีเซลล์)</label>${sel("sg", S.sales_group_id)}<label class="field" for="fg">กลุ่มพนักงาน</label>${sel("fg", S.staff_group_id)}
    <button class="btn sm" id="claim">ส่งการ์ดยืนยันตัวตนเข้ากลุ่มพนักงาน</button>
    <p class="muted">ใช้เมื่อ: น้องยังไม่ได้กด หรือการ์ดจมไปแล้ว<br>กดปุ่มนี้ → การ์ดเด้งในกลุ่มพนักงาน<br>น้องกด 'ฉันเป็นพนักงาน' ในกลุ่ม → ใช้แอปได้เลย</p><p id="cmsg" class="muted" aria-live="polite"></p></div>
    <h2>ค่า GP แอปส่งอาหาร (%)</h2><div class="card"><div class="g" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <label>LINE MAN<input type="number" inputmode="decimal" step="any" min="0" id="lineman_gp" value="${E(S.lineman_gp)}"></label><label>Grab<input type="number" inputmode="decimal" step="any" min="0" id="grab_gp" value="${E(S.grab_gp)}"></label><label>Shopee<input type="number" inputmode="decimal" step="any" min="0" id="shopee_gp" value="${E(S.shopee_gp)}"></label></div>
      <p class="muted">หน้าต้นทุน/กำไรใช้ตัวเลขนี้คิดค่า GP</p></div>
    <h2>วันหยุดร้าน</h2><p class="muted">เพิ่มหรือลบแล้ว กด บันทึกตั้งค่าร้าน ด้านล่าง</p><div class="card"><div id="hl"></div><div class="row hd-add"><input type="date" id="hd" aria-label="วันหยุดที่จะเพิ่ม"><button class="btn sm" id="ha">เพิ่มวัน</button></div></div>
    <button class="btn primary" id="save">บันทึกตั้งค่าร้าน</button><p id="smsg" class="muted"></p>`;
  drawHol();
  $("ha").onclick = () => { const d = $("hd").value; if (d && !hol.includes(d)) { hol.push(d); hol.sort(); drawHol(); } $("hd").value = ""; };
  $("hl").onclick = (ev) => { const i = ev.target.dataset.del; if (i !== undefined) { hol.splice(i, 1); drawHol(); } };
  $("claim").onclick = async () => {
    $("cmsg").className = "muted"; $("cmsg").textContent = "กำลังส่ง…";
    const r = await App.fn("notify", { card: "claim" }).catch((e) => ({ error: e }));
    $("cmsg").className = r.ok ? "ok" : "err";
    $("cmsg").textContent = r.ok ? "ส่งการ์ดเข้ากลุ่มแล้ว ✓" : r.error === "staff_group_id not set" ? "ยังไม่ได้ตั้งกลุ่มพนักงาน" : "ส่งไม่ได้: " + App.errText(r.error);
  };
  $("save").onclick = async () => {
    const rows = [["shop_name", $("shop").value.trim()], ["remind_at", $("rem").value || "20:30"], ["auto_send_at", $("auto").value || "21:00"],
      ["sales_group_id", $("sg").value || ""], ["staff_group_id", $("fg").value || ""], ["holidays", hol],
      // GP: blank = keep what is saved (never write 0 by accident)
      ...["lineman_gp", "grab_gp", "shopee_gp"].filter((k) => $(k).value !== "").map((k) => [k, Number($(k).value)])].map(([key, value]) => ({ key, value }));
    const { error } = await supabase.from("settings").upsert(rows);
    $("smsg").className = error ? "err" : "ok"; $("smsg").textContent = error ? "บันทึกไม่ได้: " + App.errText(error) : "บันทึกแล้ว ✓";
  };
  staff();
  const t0 = document.querySelector(`.tabs [data-t="${qs.get("tab")}"]`); if (t0) t0.click();
})().catch((e) => { if (e.message !== "denied") { const b = document.getElementById("blocked"); b.hidden = false; b.textContent = "เปิดไม่ขึ้น: " + App.errText(e); } });
</script></body></html>
