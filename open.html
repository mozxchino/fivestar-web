<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เปิดร้าน</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css"><link rel="stylesheet" href="lib/ux-staff.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/skeleton.js"></script><script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/photo.js"></script><script src="lib/ux-staff.js"></script>
</head><body class="pg-open" ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>เปิดร้าน</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3<span id="d"></span></div></div></header>
<div class="sk"><span class="vh">กำลังเปิด…</span><div class="card steps"><i class="sk-b" style="--w:54%;--h:18px"></i><i class="sk-b" style="--w:44%;--h:18px;--gap:10px"></i><i class="sk-b" style="--w:40%;--h:14px;--gap:10px"></i></div><div class="sticky"><i class="sk-b" style="--w:100%;--h:52px;--r:14px"></i></div></div>
<section id="done" class="done ld" hidden aria-live="polite"><span class="mascot ok-badge"><img src="img/mascot-240.png" alt="" width="80" height="80"></span><h2 id="doneT">เปิดร้านแล้ว</h2><p id="doneS"></p><p class="warm" id="doneW">ขอให้ขายดีทั้งวัน</p><div class="acts"><a class="btn primary" href="index.html">กลับหน้าหลัก</a></div></section>
<div id="form" class="ld" hidden>
  <div class="card steps"><p>1. ถ่ายรูปหน้าร้าน</p><p>2. กดปุ่ม เปิดร้าน</p><p class="muted">ต้องมีรูปทุกวัน รูปนี้บอกเวลาเปิดร้าน</p></div>
  <label id="again" class="btn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>ถ่ายรูปใหม่ <input id="ph" type="file" accept="image/*" capture="environment" hidden></label>
  <p id="phS" class="muted"></p>
  <div class="sticky"><label id="shot" class="btn primary" for="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>ถ่ายรูปหน้าร้าน</label><button id="go" class="btn primary" hidden>เปิดร้าน</button>
  <p id="msg" class="muted"></p></div>
</div>
<script>
(async () => {
  const { supabase, me } = await App.ready();
  if (UXS.only(me, ["staff", "owner"], "หน้านี้สำหรับพนักงานในร้าน", "ผู้จัดการดูงานของร้านได้ที่หน้าวันนี้", "owner.html", "ไปหน้าวันนี้")) return;
  const today = Photo.todayPrefix().slice(0, 10).replaceAll("/", "-");
  d.textContent = " · " + new Date(today + "T00:00:00Z").toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "UTC" });
  const hm = (t) => new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
  const { data: day } = await supabase.from("shop_days").select("opened_at").eq("date", today).maybeSingle();
  if (day?.opened_at) { doneS.textContent = "เปิดตอน " + hm(day.opened_at) + " น."; done.hidden = false; return; }
  form.hidden = false;
  // Mos 26 ต.ค.: the storefront photo is the opening time stamp · no photo = no opening (server 0031 refuses it too)
  // the red button opens the camera until a photo exists, then it becomes เปิดร้าน · "ถ่ายรูปใหม่" swaps the photo
  const shot = []; // 0 or 1 path
  const sync = () => { const has = shot.length > 0; again.hidden = !has; shotL.hidden = has; go.hidden = !has; };
  const shotL = document.getElementById("shot");
  Photo.picker(supabase, ph, { paths: shot, type: "open", name: "รูปหน้าร้าน", max: 1, status: phS, onChange: sync });
  go.onclick = async () => {
    if (!shot[0]) { msg.textContent = "ต้องถ่ายรูปหน้าร้านก่อน"; msg.className = "err"; return sync(); }
    go.disabled = true; msg.textContent = "กำลังเปิดร้าน…"; msg.className = "muted";
    const { error } = await supabase.rpc("open_shop", { photo: shot[0] });
    if (error) { msg.textContent = "เปิดร้านไม่ได้ ลองกดอีกครั้ง\n" + App.errText(error); msg.className = "err"; go.disabled = false; return; }
    form.hidden = true; doneS.textContent = "เปิดตอน " + hm(Date.now()) + " น."; done.hidden = false; scrollTo(0, 0);
  };
})();
</script></body></html>
