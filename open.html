<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เปิดร้าน</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css"><link rel="stylesheet" href="lib/ux-staff.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/skeleton.js"></script><script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/photo.js"></script><script src="lib/ux-staff.js"></script>
</head><body class="pg-open" ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>เปิดร้าน</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3<span id="d"></span></div></div></header>
<div class="sk"><span class="vh">กำลังเปิด…</span><i class="sk-b" style="--w:100%;--h:44px;--r:14px"></i><i class="sk-b" style="--w:52%;--h:26px;--gap:18px"></i><i class="sk-b op-frame-sk" style="--w:100%;--r:20px;--gap:12px"></i><div class="sticky"><i class="sk-b" style="--w:100%;--h:52px;--r:14px"></i></div></div>
<section id="done" class="done ld" hidden aria-live="polite"><span class="mascot ok-badge"><img src="img/mascot-240.png" alt="" width="80" height="80"></span><h2 id="doneT">เปิดร้านแล้ว</h2><p id="doneS"></p><p class="warm" id="doneW">ขอให้ขายดีทั้งวัน</p><div class="acts"><a class="btn primary" href="index.html">กลับหน้าหลัก</a></div></section>
<section id="late" class="done ld" hidden aria-live="polite"><span class="mascot"><img src="img/mascot-240.png" alt="" width="80" height="80"></span><h2>เมื่อวานยังไม่ได้ปิดร้าน</h2><p id="lateS"></p><p class="muted">ปิดเสร็จแล้วค่อยเปิดร้านวันนี้</p><div class="acts"><a id="lateGo" class="btn primary" href="close.html">ปิดร้านของเมื่อวานก่อน</a></div></section>
<div id="lE" class="ld" hidden><p class="err" role="alert"></p><button type="button" id="retry" class="btn primary">ลองอีกครั้ง</button></div>
<div id="form" class="ld" hidden>
  <ol class="ux-steps op-steps" aria-label="ขั้นเปิดร้าน"><li id="st1" class="on" aria-current="step"><i>1</i>ถ่ายรูปหน้าร้าน</li><li id="st2"><i>2</i>กดเปิดร้าน</li></ol>
  <h2 class="op-t" id="opT" tabindex="-1">ถ่ายรูปหน้าร้าน</h2>
  <label id="frame" class="op-frame" for="ph"><svg class="op-store" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>แตะเพื่อถ่ายรูป</b><small>ให้เห็นหน้าร้านทั้งร้าน</small><input id="ph" type="file" accept="image/*" capture="environment" hidden></label>
  <label id="again" class="btn" for="ph" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>ถ่ายรูปใหม่</label>
  <p id="phS" class="muted"></p>
  <div class="op-kv"><div class="kv"><span>คนเปิดร้าน</span><b id="who"></b></div><div class="kv"><span>เวลาตอนนี้</span><b id="now"></b></div><p class="muted">ต้องมีรูปทุกวัน รูปนี้บอกเวลาเปิดร้าน</p></div>
  <div class="sticky"><label id="shot" class="btn primary" for="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>ถ่ายรูปหน้าร้าน</label><button id="go" class="btn primary" hidden>เปิดร้าน</button>
  <p id="msg" class="muted"></p></div>
</div>
<script>
(async () => {
  // audit 27: a failed read shows โหลดไม่ขึ้น + retry, never the form on blank data
  const failed = (e) => { form.hidden = true; lE.hidden = false; lE.querySelector(".err").textContent = "โหลดไม่ขึ้น\n" + App.errText(e);
    retry.onclick = () => { retry.disabled = true; location.reload(); }; };
  try {
  const { supabase, me } = await App.ready();
  if (UXS.only(me, ["staff", "owner"], "หน้านี้สำหรับพนักงานในร้าน", "ผู้จัดการดูงานของร้านได้ที่หน้าวันนี้", "owner.html", "ไปหน้าวันนี้")) return;
  const today = Photo.todayPrefix().slice(0, 10).replaceAll("/", "-");
  d.textContent = " · " + new Date(today + "T00:00:00Z").toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "UTC" });
  const hm = (t) => new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
  const { data: day, error: dErr } = await supabase.from("shop_days").select("opened_at").eq("date", today).maybeSingle();
  if (dErr) return failed(dErr);   // unknown = not "ยังไม่เปิด": a shop already open must not get a second open
  if (day?.opened_at) { doneS.textContent = "เปิดตอน " + hm(day.opened_at) + " น."; done.hidden = false; return; }
  // 0047 (Mos 30 ต.ค.): yesterday opened but never closed → close it first (open_shop refuses too)
  const { data: un, error: uErr } = await supabase.rpc("unclosed_day");
  if (uErr) return failed(uErr);
  if (un) { lateS.textContent = "ของ" + new Date(un + "T00:00:00Z").toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "short", timeZone: "UTC" });
    lateGo.href = "close.html?d=" + un; late.hidden = false; return; }
  form.hidden = false;
  // Mos 26 ต.ค.: the storefront photo is the opening time stamp · no photo = no opening (server 0031 refuses it too)
  // the red button opens the camera until a photo exists, then it becomes เปิดร้าน · "ถ่ายรูปใหม่" swaps the photo
  const shot = []; // 0 or 1 path
  // round 2 (Mos 26 ต.ค.): two steps on top, the big frame is the camera until a photo exists, then the photo fills the frame's place
  const sync = () => { const has = shot.length > 0; again.hidden = !has; shotL.hidden = has; go.hidden = !has; frame.hidden = has;
    st1.className = has ? "ok" : "on"; st2.className = has ? "on" : ""; st1.querySelector("i").textContent = has ? "✓" : "1";
    has ? (st2.setAttribute("aria-current", "step"), st1.removeAttribute("aria-current")) : (st1.setAttribute("aria-current", "step"), st2.removeAttribute("aria-current"));
    opT.textContent = has ? "กดปุ่ม เปิดร้าน" : "ถ่ายรูปหน้าร้าน"; };
  who.textContent = me.name;
  const tick = () => { now.textContent = hm(Date.now()) + " น."; }; tick(); setInterval(tick, 15e3); // real clock, the photo time is what the server keeps
  const shotL = document.getElementById("shot");
  Photo.picker(supabase, ph, { paths: shot, type: "open", name: "รูปหน้าร้าน", max: 1, status: phS, onChange: sync });
  go.onclick = async () => {
    if (!shot[0]) { msg.textContent = "ต้องถ่ายรูปหน้าร้านก่อน"; msg.className = "err"; return sync(); }
    go.disabled = true; msg.textContent = "กำลังเปิดร้าน…"; msg.className = "muted";
    const { error } = await supabase.rpc("open_shop", { photo: shot[0] });
    if (error) { msg.textContent = "เปิดร้านไม่ได้ ลองกดอีกครั้ง\n" + App.errText(error); msg.className = "err"; go.disabled = false; return; }
    form.hidden = true; doneS.textContent = "เปิดตอน " + hm(Date.now()) + " น."; done.hidden = false; scrollTo(0, 0);
  };
  } catch (e) { if (e.message !== "denied") failed(e); }
})();
</script></body></html>
