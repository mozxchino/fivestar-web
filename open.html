<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เปิดร้าน</title><meta name="theme-color" content="#C82128">
<link rel="icon" type="image/png" href="img/logo-96.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script><script src="lib/photo.js"></script>
</head><body ontouchstart="">
<header class="topbar"><a class="back" href="index.html" aria-label="กลับหน้าหลัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><img class="logo" src="img/logo-96.png" alt="" width="44" height="44"><div><h1>เปิดร้าน</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3 · <span id="d"></span></div></div></header>
<div id="done" hidden><p class="ok big" id="doneT"></p><a class="btn" href="index.html">กลับหน้าหลัก</a></div>
<div id="form" hidden>
  <div class="card steps"><p>ถ่ายรูปหน้าร้าน แล้วกดเปิดร้าน</p><p class="muted">รูปไม่บังคับ</p></div>
  <label class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>ถ่ายรูปหน้าร้าน <input id="ph" type="file" accept="image/*" capture="environment" hidden></label>
  <p id="phS" class="muted"></p>
  <div class="sticky"><button id="go" class="btn primary">เปิดร้านแล้ว</button>
  <p id="msg" class="muted"></p></div>
</div>
<script>
(async () => {
  const { supabase } = await App.ready();
  const today = Photo.todayPrefix().slice(0, 10).replaceAll("/", "-");
  d.textContent = today.slice(8) + "/" + today.slice(5, 7);
  const hm = (t) => new Date(t).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" });
  const { data: day } = await supabase.from("shop_days").select("opened_at").eq("date", today).maybeSingle();
  if (day?.opened_at) { doneT.textContent = "เปิดร้านแล้ว " + hm(day.opened_at); done.hidden = false; return; }
  form.hidden = false;
  let photo = null, noPhoto = false;
  ph.onchange = async () => { phS.textContent = "กำลังอัปโหลด…"; try { photo = await Photo.upload(supabase, "open", ph.files[0]); noPhoto = false; phS.textContent = "แนบรูปแล้ว"; } catch (e) { photo = null; noPhoto = true; phS.textContent = "ไม่มีรูป (อัปโหลดไม่สำเร็จ) · กดเปิดร้านต่อได้"; } };
  go.onclick = async () => {
    go.disabled = true; msg.textContent = "กำลังบันทึก…"; msg.className = "muted";
    const { error } = await supabase.rpc("open_shop", { photo });
    if (error) { msg.textContent = "ไม่สำเร็จ: " + error.message; msg.className = "err"; go.disabled = false; return; }
    form.hidden = true; doneT.textContent = "เปิดร้านแล้ว " + hm(Date.now()) + (photo ? "" : " · ไม่มีรูป"); done.hidden = false;
  };
})();
</script></body></html>
