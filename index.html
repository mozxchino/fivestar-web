<script>
(async () => {
  try {
    const { supabase, me } = await App.ready();
    document.getElementById("who").textContent = `${me.name} · ${UXS.ROLE[me.role] || "พนักงาน"}`;
    // Lucide icons, stroke 2
    const I = {
      open: '<path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>',
      receive: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/>',
      close: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
      issue: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      holiday: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m14 14-4 4"/><path d="m10 14 4 4"/>',
      history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      today: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
      approve: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
      settings: '<path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/>',
      staff: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      made: '<path d="M5 12h14"/><path d="M12 5v14"/>',
      costs: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    };
    const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const staff = [["open.html","เปิดร้าน","open","ถ่ายรูปหน้าร้าน แล้วกดเปิด"],["receive.html","รับของ","receive","ของ CPF มาถึง นับแล้วกดรับ"],["close.html","ปิดร้าน","close","นับของเหลือ นับเงิน ก่อนกลับ"],["issue.html","แจ้งปัญหา","issue","เครื่องพัง ลูกค้าร้องเรียน ของ CPF มาผิด"],["holiday.html","ขอหยุด/ลา","holiday","หยุดประจำ ลาป่วย ลากิจ"],["history.html","ประวัติ","history","ย้อนดู 30 วัน"]];
    const owner = [["owner.html","วันนี้","today","เปิดร้าน รับของ ปิดร้าน เงินสด"],["approve.html","อนุมัติใบสั่ง","approve","ตรวจใบสั่งพรุ่งนี้ แล้วส่งให้เซลล์"],["settings.html","ตั้งค่า","settings","พนักงาน สินค้า กลุ่ม LINE"],["costs.html","ต้นทุน/กำไร","costs","สรุปกำไรรายเดือน"],["holiday.html","ขอหยุด/ลา","holiday","วันหยุดและวันลาของพนักงาน"]];
    const tiles = (list, top = "") => { document.getElementById("menu").innerHTML = top + list
        .map(([h,t,ic,s],i) => `<a class="btn tile ${i===0&&!top?'primary':''}" href="${h}"><span class="ico">${svg(I[ic])}</span><span class="t">${t}<small>${s}</small></span><span class="go">${svg('<path d="m9 18 6-6-6-6"/>')}</span></a>`).join(""); };
    // round 6: a manager gets the owner hub without ต้นทุน/กำไร and with ตั้งค่า = วันหยุดพนักงาน only
    const MGR = me.role === "manager", mine = (list) => MGR ? list.filter((r) => r[0] !== "costs.html").map((r) => r[0] === "settings.html" ? [r[0], "พนักงาน", "staff", "วันหยุดของพนักงาน", ...r.slice(4)] : r) : list;
    // qa3 #2: a failed read never looks like "nothing to do" · say เปิดไม่ขึ้น + ลองอีกครั้ง, keep the plain menu under it
    const OWN = me.role === "owner" || MGR, hub = OWN ? ownerHub : staffHome;
    const home = async () => { try { await hub(); } catch (e) { console.error("home", e); failed(e); } };
    function failed(e) {
      const title = document.getElementById("title");
      title.classList.add("ux-hello"); title.innerHTML = `สวัสดี ${UXS.esc(me.name)}<small>${UXS.thd(UXS.today(), { weekday: "long" }).replace(/^วัน(\S+?)ที่ /, "$1 ")}</small>`;
      tiles(OWN ? mine(owner) : staff, `<p class="err" role="alert">เปิดไม่ขึ้น: ${UXS.esc(App.errText(e))}<button type="button" class="btn" id="retry">ลองอีกครั้ง</button></p>`);
      document.getElementById("retry").onclick = (ev) => { ev.currentTarget.disabled = true; ev.currentTarget.textContent = "กำลังเปิด…"; home(); };
    }
    await home(); return;
    // 0042: "ห่อข้าวเหนียวเสร็จ" while the shop is open (opened, not sent) · extra tile: a failed read (or 0042 not live yet) just leaves it out
    async function made(day, put, kind) {
      if (!day?.opened_at || day.closed_at || day.status === "sent") return;
      const [p, m] = await Promise.all([
        supabase.from("products").select("id,name,unit").eq("made_here", true).eq("active", true).order("sort").limit(1).maybeSingle(),
        supabase.from("made_logs").select("qty").eq("date", UXS.today()),
      ]);
      if (p.error || m.error || !p.data) return;
      const P = p.data, u = UXS.esc(P.unit || "ห่อ"), say = (n) => `วันนี้ห่อแล้ว ${n.toLocaleString("th-TH")} ${u}`;
      let n = (m.data || []).reduce((a, r) => a + +r.qty, 0);
      put(kind === "bt"
        ? `<button type="button" class="bt wide" id="madeB" aria-haspopup="dialog"><span class="k">ห่อข้าวเหนียวเสร็จ</span><span class="v" id="madeN">${say(n)}</span><span class="go">${svg(I.made)}</span></button>`
        : `<button type="button" class="btn tile ux-hub" id="madeB" aria-haspopup="dialog"><span class="ico">${svg(I.made)}</span><span class="t">ห่อข้าวเหนียวเสร็จ<small id="madeN">${say(n)}</small></span><span class="go">${svg('<path d="m9 18 6-6-6-6"/>')}</span></button>`);
      const sheet = UXD.sheet(document.getElementById("madeS")), q = document.getElementById("madeQ"), msg = document.getElementById("madeM"), go = document.getElementById("madeGo");
      document.getElementById("madeU").textContent = P.unit || "ห่อ";
      document.getElementById("madeB").onclick = () => { q.value = ""; msg.textContent = ""; sheet.open(); q.focus(); };
      q.onkeydown = (e) => { if (e.key === "Enter") go.click(); };
      // follow-up: after a save, "ยกเลิกรายการล่าสุด" stays 10 minutes (server rule in undo_made) or until used · a plain button, no 5 s toast
      const ub = document.createElement("button"); ub.type = "button"; ub.className = "ux-undo"; ub.hidden = true; ub.textContent = "ยกเลิกรายการล่าสุด";
      document.getElementById("madeB").insertAdjacentElement("afterend", ub);
      let ut; const hideU = () => { clearTimeout(ut); ub.hidden = true; };
      ub.onclick = async () => {
        ub.disabled = true;
        const r = await supabase.rpc("undo_made");
        ub.disabled = false;
        if (r.error) { UXM.toast(App.errText(r.error), { ms: 4000 }); return; }
        n = +r.data; document.getElementById("madeN").textContent = say(n); hideU(); UXM.toast("ยกเลิกรายการล่าสุดแล้ว");
      };
      go.onclick = async () => {
        const v = Number(q.value);
        if (!Number.isInteger(v) || v < 1 || v > 500) { msg.textContent = "ใส่จำนวน 1 ถึง 500 ห่อ"; q.focus(); return; }
        go.disabled = true; go.textContent = "กำลังบันทึก…"; msg.textContent = "";
        const r = await supabase.rpc("add_made", { p_product: P.id, p_qty: v });
        go.disabled = false; go.textContent = "บันทึกจำนวนห่อ";
        if (r.error) { msg.textContent = App.errText(r.error); return; }
        n = +r.data; document.getElementById("madeN").textContent = say(n); sheet.close();
        ub.hidden = false; clearTimeout(ut); ut = setTimeout(hideU, 10 * 60 * 1000);
      };
    }
    async function ownerHub() {
    // round 4: the owner menu is a hub · each row says what waits there right now · waiting rows first · the most urgent one leads (soft red)
    const { esc, thd, hm } = UXS, today = UXS.today();
    const [iss, lv, od, sd, hol, any] = await Promise.all([
      supabase.from("issues").select("id,status").eq("status", "open"),
      supabase.from("leave_requests").select("id,status,date").eq("status", "pending").gte("date", today),
      // 0033: the newest CPF order still to come (tonight's lands the day after tomorrow)
      supabase.from("orders").select("status,for_date").gt("for_date", today).order("created_at", { ascending: false }).limit(1).maybeSingle(),
      supabase.from("shop_days").select("status,opened_at,closed_at").eq("date", today).maybeSingle(),
      supabase.from("settings").select("key,value").in("key", ["holidays", "shop_closed_dow", "auto_send_at"]),
      supabase.from("orders").select("id").limit(1), // 0033: no order ever → the first-order row leads (takeover)
    ]);
    for (const r of [iss, lv, od, sd, hol, any]) if (r.error) throw r.error;
    const nIss = (iss.data || []).filter((i) => i.status === "open").length;
    const nLv = (lv.data || []).filter((l) => l.status === "pending" && l.date >= today).length;
    const S = Object.fromEntries((hol.data || []).map((x) => [x.key, x.value])), d = sd.data || {}, shut = d.status === "holiday" || (Array.isArray(S.holidays) && S.holidays.includes(today))
      || (!d.opened_at && (Array.isArray(S.shop_closed_dow) ? S.shop_closed_dow : [1]).includes(new Date(today + "T00:00:00Z").getUTCDay() || 7)); // 0034 weekly holiday
    // [status words, tone, rank when something waits for the owner] · failed order first, then new issues, then the order to send, then leave
    // 0033: named by the delivery day ("ใบสั่งของ ศ. 6 พ.ย. รอส่ง")
    const dd = od.data ? ` ${thd(od.data.for_date, { weekday: "short" })}` : "";
    const sendBy = `รอส่ง ก่อน ${esc(S.auto_send_at || "12:30")} น. ${od.data && od.data.for_date <= new Date(Date.parse(today + "T00:00:00Z") + 864e5).toISOString().slice(0, 10) ? "วันนี้" : "พรุ่งนี้"}`; // auto-send is the day after the order's night: an order landing tomorrow was made last night
    const ord = { proposed: [sendBy, "wait", 2], approved: [sendBy, "wait", 2], failed: ["ส่งไม่ออก", "bad", 0], sent: ["ส่งแล้ว", "ok"], skipped: ["ไม่สั่ง", ""] }[od.data?.status] || ["คืนนี้ยังไม่มี", ""];
    const shop = shut ? ["หยุด", ""] : d.closed_at ? [`ปิดแล้ว ${hm(d.closed_at)} น.`, "ok"] : d.opened_at ? [`เปิดอยู่ ตั้งแต่ ${hm(d.opened_at)} น.`, "ok"] : ["ยังไม่เปิด", ""];
    const R = [ // href, name, icon, status line, tone, rank (null = nothing waits)
      ["owner.html", "วันนี้", "today", `ร้านวันนี้ ${shop[0]}`, shop[1], null],
      ["owner.html?tab=iss", "ปัญหาจากร้าน", "issue", nIss ? `รอรับทราบ ${nIss} เรื่อง` : "ไม่มีเรื่องค้าง", nIss ? "bad" : "ok", nIss ? 1 : null],
      ...(me.role === "owner" && !(any.data || []).length ? [["opening.html", "ใบสั่งแรก", "approve", "นับของรับร้าน แล้วสร้างใบสั่งของ", "wait", 0]] : []),
      ["approve.html", "อนุมัติใบสั่ง", "approve", `ใบสั่งของ${od.data ? dd : ""} ${ord[0]}`, ord[1], ord[2] ?? null],
      ["holiday.html", "ขอหยุด/ลา", "holiday", nLv ? `รออนุมัติ ${nLv} เรื่อง` : "ไม่มีคำขอรอ", nLv ? "wait" : "ok", nLv ? 3 : null],
      ["costs.html", "ต้นทุน/กำไร", "costs", "สรุปกำไรรายเดือน", "-", null],
      ["settings.html", "ตั้งค่า", "settings", "พนักงาน สินค้า กลุ่ม LINE", "-", null],
    ].map((r) => mine([r])[0]).filter(Boolean);
    const wait = R.filter((r) => r[5] != null).sort((a, b) => a[5] - b[5]), list = [...wait, ...R.filter((r) => r[5] == null)];
    const title = document.getElementById("title");
    title.classList.add("ux-hello"); title.innerHTML = `สวัสดี ${esc(me.name)}<small>${thd(today, { weekday: "long" }).replace(/^วัน(\S+?)ที่ /, "$1 ")} ${wait.length ? `มีเรื่องรอ ${wait.length} อย่าง` : "ไม่มีเรื่องรอ"}</small>`;
    // one lead: the most urgent waiting row, or วันนี้ when nothing waits
    document.getElementById("menu").innerHTML = list.map(([h, t, ic, st, tone, rank], i) => `<a class="btn tile ux-hub${i === 0 ? " primary" : ""}${rank != null ? " waits" : ""}" href="${h}"><span class="ico">${svg(I[ic])}</span><span class="t">${t}<small data-tone="${tone}">${st}</small></span><span class="go">${svg('<path d="m9 18 6-6-6-6"/>')}</span></a>`).join("");
    await made(d, (h) => document.querySelector("#menu > :first-child").insertAdjacentHTML("afterend", h), "tile");
    }
    async function staffHome() {
    // staff: today's real status → strip + next-task tile · "เรื่องของฉัน" (own issues · upcoming leave · last day)
    const { esc, thd, hm } = UXS, today = UXS.today();
    const [st, iss, lv, last] = await Promise.all([
      UXS.status(supabase),
      supabase.from("issues").select("id,date,text,status,created_at").eq("created_by", me.userId).order("created_at", { ascending: false }).limit(50),
      supabase.from("leave_requests").select("id,date,type,status,requested_at").eq("user_id", me.userId).gte("date", UXS.back(30)).neq("status", "cancelled").order("date").limit(50),
      supabase.from("shop_days").select("date,status,closed_at,cash_expected,cash_counted").lt("date", today).order("date", { ascending: false }).limit(1).maybeSingle(),
    ]);
    for (const r of [iss, lv, last]) if (r.error) throw r.error; // qa3 #2: no "ยังไม่มีเรื่องที่แจ้ง" when the read failed
    const title = document.getElementById("title");
    title.classList.add("ux-hello"); title.innerHTML = `สวัสดี ${esc(me.name)}<small>${thd(today, { weekday: "long" }).replace(/^วัน(\S+?)ที่ /, "$1 ")} · งานวันนี้</small>`;
    const n = st.next, d = st.day || {}, rest = n.key === "done" || n.key === "holiday";
    const cell = (href, name, cls, sub) => `<a class="bt ${cls}" href="${href}"><span class="k"><i class="dot" aria-hidden="true"></i>${name}</span><span class="v">${sub}</span></a>`;
    const c1 = d.opened_at ? cell("open.html", "เปิดร้าน ✓", "ok", hm(d.opened_at) + " น.") : n.key === "open" ? cell("open.html", "เปิดร้าน", "now", "ยังไม่เปิด") : cell("open.html", "เปิดร้าน", "", rest ? "ร้านหยุด" : "ยังไม่เปิด");
    const c2 = st.receive === "ok" ? cell("receive.html", "รับของ ✓", "ok", hm(st.recvAt) + " น.") : st.receive === "short" ? cell("receive.html", "รับของ ✓", "wait", `ขาด ${st.short}<small> อย่าง</small>`)
      : n.key === "receive" ? cell("receive.html", "รับของ", "now", "ยังไม่รับ") : cell("receive.html", "รับของ", "", st.receive === "none" ? "ไม่มีของมา" : "ยังไม่รับ");
    const c3 = n.key === "done" ? cell("history.html", "ปิดร้าน ✓", "ok", hm(d.closed_at) + " น.") : n.key === "close" ? cell("close.html", "ปิดร้าน", "now", "ยังไม่ปิด") : cell("close.html", "ปิดร้าน", "", "ยังไม่ถึง");
    const icon = { open: "open", receive: "receive", close: "close", done: "history", holiday: "history" }[n.key];
    const ISS = { open: ["รอรับทราบ", "wait"], ack: ["รับทราบแล้ว", "ok"], closed: ["ปิดเรื่องแล้ว", "ok"] };
    const LT = { off: "หยุดประจำสัปดาห์", sick: "ลาป่วย", personal: "ลากิจ", special: "หยุดพิเศษ" }, LS = { pending: ["รออนุมัติ", "wait"], approved: ["อนุมัติแล้ว", "ok"], rejected: ["ไม่อนุมัติ", "bad"] };
    const line = (href, t, s, pill) => `<a class="row" href="${href}"><span class="grow"><span class="ux-t">${t}</span><span class="ux-s">${s}</span></span>${pill ? `<span class="pill" data-tone="${pill[1]}">${pill[0]}</span>` : '<span class="ux-go" aria-hidden="true">›</span>'}</a>`;
    // ข: my issues + my leave requests as one list · waiting for the owner (ยังไม่รับทราบ / รออนุมัติ) first, then newest · 4 here, the rest in a sheet
    const all = [
      ...(iss.data || []).map((i) => ({ k: "iss", wait: i.status === "open", at: i.created_at || "", h: line("issue.html", "แจ้งปัญหา", `${thd(i.date || today)} ${esc(i.text)}`, ISS[i.status]) })),
      ...(lv.data || []).map((r) => ({ k: "lv", wait: r.status === "pending", at: r.requested_at || r.date, h: line("holiday.html", "ขอหยุด/ลา", `${LT[r.type] || esc(r.type)} ${thd(r.date)}`, LS[r.status]) })),
    ].sort((a, b) => b.wait - a.wait || String(b.at).localeCompare(String(a.at)));
    const nWait = all.filter((x) => x.wait).length;
    const rows = all.slice(0, 4).map((x) => x.h);
    if (!(iss.data || []).length) rows.push(line("issue.html", "แจ้งปัญหา", "ยังไม่มีเรื่องที่แจ้ง"));
    if (!(lv.data || []).length) rows.push(line("holiday.html", "ขอหยุด/ลา", "ไม่มีวันที่ขอไว้"));
    if (all.length > 4) rows.push(`<button type="button" class="row ux-all" id="mineAll" aria-haspopup="dialog"><span class="grow ux-t">ดูทั้งหมด ${all.length} เรื่อง</span><span class="ux-go" aria-hidden="true">›</span></button>`);
    const L = last.data, gap = L && L.cash_counted != null && L.cash_expected != null ? L.cash_counted - L.cash_expected : null;
    rows.push(line("history.html", "ประวัติ 30 วัน", L ? [thd(L.date, { weekday: "short" }), L.closed_at ? `ปิด ${hm(L.closed_at)} น.` : "", gap == null ? "" : gap === 0 ? "เงินสดครบ" : `เงินสด${gap < 0 ? "ขาด" : "เกิน"} ${Math.abs(gap).toLocaleString("th-TH")} บาท`].filter(Boolean).join(" · ") : "ยังไม่มีประวัติ"));
    rows.push(line("waste.html", "ทิ้งของเสีย", "ถ่ายรูปตาชั่งและตอนทิ้งลงถัง"));
    rows.push(line("manual.html", "คู่มือ", "ทำอะไรบ้างในแต่ละวัน"));
    // Mos 23 ต.ค. รอบ 2: "งานถัดไป" across the top, only as tall as its words · เปิด / รับของ / ปิด in one row of 3 · เรื่องของฉัน below
    document.getElementById("menu").innerHTML = `<div class="bento trio">
      <a class="bt wide hero lead${rest ? " calm" : ""}" href="${n.href}"><span class="ico">${svg(I[icon])}</span><span class="tx"><span class="k">${rest ? "วันนี้" : "งานถัดไป"}</span><span class="v">${n.label}</span><span class="m">${n.sub}</span></span><span class="go">${svg('<path d="m9 18 6-6-6-6"/>')}</span></a>
      ${c1}${c2}${c3}
      <section class="bt wide list" aria-labelledby="mine"><h2 class="k" id="mine"${nWait ? ' data-tone="wait"' : ""}>เรื่องของฉัน${nWait ? `<span class="n">รอคำตอบ ${nWait} เรื่อง</span>` : ""}</h2><div>${rows.slice(0, -3).join("")}</div></section>
      <nav class="bt wide list ux-more-menu" aria-label="เมนูอื่น"><div>${rows.slice(-3).join("")}</div></nav></div>`;
    await made(d, (h) => document.querySelector("#menu .trio > section").insertAdjacentHTML("beforebegin", h), "bt");
    if (all.length > 4) {
      const sheet = UXD.sheet(document.getElementById("mineS")), F = [["all", "ทั้งหมด", () => true], ["iss", "ปัญหา", (x) => x.k === "iss"], ["lv", "ขอหยุด", (x) => x.k === "lv"], ["wait", "รอคำตอบ", (x) => x.wait]];
      let f = "all";
      const draw = () => {
        document.getElementById("mineF").innerHTML = F.map(([k, t, fn]) => `<button type="button" class="chip${k === f ? " on" : ""}" data-f="${k}" aria-pressed="${k === f}">${t} <b>${all.filter(fn).length}</b></button>`).join("");
        const list = all.filter(F.find(([k]) => k === f)[2]);
        document.getElementById("mineL").innerHTML = list.map((x) => x.h).join("") || `<p class="muted">${{ iss: "ยังไม่มีเรื่องที่แจ้ง", lv: "ไม่มีวันที่ขอไว้", wait: "ไม่มีเรื่องรอคำตอบ" }[f]}</p>`;
      };
      document.getElementById("mineF").onclick = (e) => { const b = e.target.closest("[data-f]"); if (b) { f = b.dataset.f; draw(); } };
      document.getElementById("mineAll").onclick = () => { f = "all"; draw(); sheet.open(); };
    }
    }
  } catch (e) {
    if (e.message !== "denied") { document.getElementById("title").textContent = "เปิดแอปไม่ได้"; document.getElementById("who").textContent = "ปิดแล้วเปิดใหม่ใน LINE\n" + App.errText(e); }
  }
})();
</script></body></html>
