<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้าดาว อ่อนนุช 44</title>
<link rel="stylesheet" href="lib/ui.css">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/config.js"></script><script src="lib/session.js"></script>
</head><body>
<div class="topbar"><div class="logo">5</div><div><h1>ไก่ย่างห้าดาว</h1><div class="sub">สาขาอ่อนนุช 44 จุด 3</div></div></div>
<h1 id="title" style="font-size:18px">กำลังเข้าระบบ…</h1>
<div id="menu"></div>
<p class="muted" id="who"></p>
<script>
(async () => {
  try {
    const { me } = await App.ready();
    document.getElementById("who").textContent = `${me.name} · ${me.role === "owner" ? "เจ้าของ" : "พนักงาน"}`;
    document.getElementById("title").textContent = "เลือกเมนู";
    const staff = [["open.html","เปิดร้าน","🌅"],["receive.html","รับของ","📦"],["close.html","ปิดร้าน","🌙"],["issue.html","แจ้งปัญหา","⚠️"],["holiday.html","ขอหยุด/ลา","🏖️"],["history.html","ประวัติ","📅"]];
    const owner = [["owner.html","วันนี้","📊"],["approve.html","อนุมัติใบสั่ง","✅"],["settings.html","ตั้งค่า","⚙️"],["holiday.html","ขอหยุด/ลา","🏖️"]];
    document.getElementById("menu").innerHTML = (me.role === "owner" ? owner : staff)
      .map(([h,t,ic],i) => `<a class="btn ${i===0?'primary':''}" href="${h}"><span class="ico">${ic}</span>${t}</a>`).join("");
  } catch (e) {
    if (e.message !== "denied") document.getElementById("title").textContent = "เข้าระบบไม่ได้: " + e.message;
  }
})();
</script></body></html>
